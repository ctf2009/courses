<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How RAG Actually Works — A Build-Up Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1B2E; --bg:#F6F7FB; --surface:#FFFFFF; --muted:#6B6E87;
    --line:#E4E6F0; --accent:#5B5BD6; --accent-deep:#4A45B8; --accent-soft:#ECECFB;
    --win:#D98A1F; --win-soft:#FBEFD8; --sparse:#2E8B6F; --sparse-soft:#E7F4EF; --danger:#C0506A; --danger-soft:#FBECEF;
    --display:'Space Grotesk',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
    --radius:14px; --shadow:0 1px 2px rgba(26,27,46,.04),0 8px 28px rgba(26,27,46,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
  .shell{display:grid;grid-template-columns:292px minmax(0,1fr);max-width:1260px;margin:0 auto}
  .rail{border-right:1px solid var(--line);padding:28px 20px 60px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
  .brandmark{display:flex;align-items:center;gap:10px}
  .brandmark .dot{width:11px;height:11px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .brandmark b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em}
  .rail .sub{font-size:12.5px;color:var(--muted);margin:6px 0 16px;line-height:1.4}
  .progress-wrap{background:var(--accent-soft);border-radius:10px;padding:10px 13px;margin-bottom:14px}
  .progress-wrap .pl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);display:flex;justify-content:space-between}
  .pbar{height:6px;background:#fff;border-radius:4px;margin-top:8px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .5s}
  .part{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:15px 0 6px}
  .mod{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:9px;margin:1px 0;cursor:pointer;color:var(--muted);font-size:13.5px;line-height:1.3;border:none;background:none;width:100%;text-align:left;font-family:var(--body)}
  .mod:hover{background:var(--bg);color:var(--ink)}
  .mod .num{font-family:var(--mono);font-size:12px;min-width:20px;color:var(--line)}
  .mod.active{background:var(--accent-soft);color:var(--ink);font-weight:600}.mod.active .num{color:var(--accent)}
  .mod .check{margin-left:auto;color:var(--sparse);font-size:13px;opacity:0;transition:opacity .2s}.mod.done .check{opacity:1}.mod.done .num{color:var(--sparse)}

  .main{padding:42px clamp(20px,5vw,70px) 100px;min-width:0}
  .module{display:none}.module.show{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin:0 0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .eyebrow .tag{background:var(--win-soft);color:var(--win);padding:3px 9px;border-radius:20px;letter-spacing:.06em;font-size:10.5px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,42px);line-height:1.07;letter-spacing:-.025em;margin:0 0 16px}
  h1 .lede{display:block;color:var(--accent);font-size:.48em;font-weight:500;margin-top:14px;line-height:1.32}
  .intro{font-size:18.5px;max-width:62ch;margin:0 0 30px}.intro b{font-weight:600}
  h2{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.02em;margin:44px 0 13px}
  h2 .k{font-family:var(--mono);font-size:12.5px;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px;vertical-align:middle;margin-right:10px;font-weight:500}
  p{max-width:65ch}a{color:var(--accent-deep)}
  code{font-family:var(--mono);font-size:.87em;background:var(--accent-soft);color:var(--accent-deep);padding:1px 6px;border-radius:5px}
  .takeaway{border-left:3px solid var(--accent);padding:4px 0 4px 18px;margin:26px 0}.takeaway b{font-weight:600}
  .flag{background:var(--win-soft);border:1px solid #EAD2A4;border-radius:11px;padding:13px 16px;margin:22px 0;font-size:14.5px;color:#7a5418}.flag b{color:#5e3f12}
  .callback{font-size:14.5px;color:var(--muted);font-style:italic;margin:22px 0}.callback b{color:var(--accent-deep);font-style:normal;font-weight:600}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin:18px 0}
  .ctitle{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
  .caption{font-size:13.5px;color:var(--muted);margin:0 0 16px}
  .controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:6px}
  button.btn{font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 15px;transition:background .2s}
  button.btn:hover{background:var(--accent-deep)}
  button.btn.ghost{background:transparent;color:var(--accent-deep);border-color:var(--line)}
  button.btn.ghost:hover{background:var(--accent-soft)}
  button.btn.ghost.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:focus-visible,.mod:focus-visible{outline:3px solid var(--win);outline-offset:2px}
  .readout{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:14px;line-height:1.5}.readout b{color:var(--accent-deep)}
  input[type=range]{accent-color:var(--accent);width:100%}
  .slider-row{display:grid;grid-template-columns:120px 1fr 64px;gap:12px;align-items:center;margin:6px 0;font-size:13px}
  .slider-row .lab{font-family:var(--mono);color:var(--muted)}.slider-row .val{font-family:var(--mono);text-align:right;color:var(--accent-deep)}
  .chip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:7px 12px;cursor:pointer}
  .chip:hover{border-color:var(--accent);background:var(--accent-soft)}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .nodes{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px;align-items:center}
  .node{width:9px;height:14px;border-radius:2px;background:var(--accent)}
  .node.pq{background:var(--sparse)}
  .nodes .nlabel{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
  .qchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .qline{font-family:var(--display);font-size:17px;margin:14px 0 4px}.qline b{color:var(--accent)}

  /* ranked lists (retrieval) */
  .retr{display:grid;gap:14px;margin-top:14px}
  .cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:1fr 1fr 1fr}
  .rcol{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--bg)}
  .rhead{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:600;font-size:13.5px;margin-bottom:3px}.rhead .pip{width:9px;height:9px;border-radius:3px}
  .rsub{font-size:11px;color:var(--muted);margin:0 0 10px;font-family:var(--mono)}
  .doc{margin:7px 0}.doc .dt{font-size:12px;line-height:1.35;display:flex;gap:6px;align-items:baseline}
  .doc .did{font-family:var(--mono);font-weight:600;font-size:11px}
  .doc .dtrack{height:6px;border-radius:4px;background:#fff;margin-top:4px;overflow:hidden}.doc .dfill{height:100%;width:0;border-radius:4px;transition:width .6s cubic-bezier(.22,1,.36,1)}
  .doc.zero{opacity:.38}
  .badge{font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:8px;margin-left:auto;white-space:nowrap}
  .badge.only{background:var(--win-soft);color:var(--win)}.badge.up{background:var(--sparse-soft);color:var(--sparse)}.badge.bad{background:var(--danger-soft);color:var(--danger)}

  /* flow / pipeline */
  .flow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .stage{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);text-align:center;transition:.25s}
  .stage.on{background:var(--accent-soft);border-color:var(--accent)}
  .stage .si{font-family:var(--mono);font-size:10px;color:var(--muted)}.stage .sn{font-family:var(--display);font-weight:600;font-size:14px;margin-top:3px}
  .artifact{font-family:var(--mono);font-size:12.5px;background:var(--ink);color:#E8E9F5;border-radius:10px;padding:13px 15px;margin-top:14px;white-space:pre-wrap;line-height:1.55;min-height:54px}
  .artifact .hl{color:#9BE6C4}.artifact .hl2{color:#C2A0F5}

  /* chunks */
  .chunkdoc{font-size:14px;line-height:1.85;letter-spacing:.01em}
  .ck{padding:1px 2px;border-radius:3px}
  .tradeoff{font-size:13.5px;color:var(--ink);margin-top:12px}.tradeoff b{font-weight:600}

  /* loop */
  .loop{display:flex;flex-direction:column;gap:8px}
  .lstep{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);opacity:.45;transition:.3s}
  .lstep.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
  .lstep.bad{border-color:var(--danger);background:var(--danger-soft)}
  .lstep.good{border-color:var(--sparse);background:var(--sparse-soft)}
  .lstep .ln{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:64px}.lstep .lt{font-size:13.5px}

  /* svg */
  .svg-wrap{width:100%;display:block}.gsvg text{font-family:var(--mono);font-size:10px;fill:var(--ink)}

  /* metric bars */
  .metrics{display:grid;gap:9px;margin-top:6px}
  .metric{display:grid;grid-template-columns:140px 1fr 44px;gap:10px;align-items:center;font-size:13px}
  .metric .ml{font-family:var(--mono);color:var(--muted)}.metric .mtrack{height:18px;background:var(--accent-soft);border-radius:5px;overflow:hidden}
  .metric .mfill{height:100%;width:0;border-radius:5px;transition:width .6s}.metric .mv{font-family:var(--mono);text-align:right;font-size:12px}

  .formula{font-family:var(--mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:15px;overflow-x:auto;line-height:2.3;color:var(--ink)}
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 5px}
  .frac .fn{padding:0 8px 2px}.frac .fd{padding:2px 8px 0;border-top:1.6px solid currentColor}
  .bmt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
  .bmt th,.bmt td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
  .bmt th{color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
  .bmt td:first-child,.bmt th:first-child{text-align:left;color:var(--accent-deep);font-weight:600}
  .bmt tr.total td{border-top:2px solid var(--accent);border-bottom:none;font-weight:600;color:var(--accent-deep)}
  .bmt td.zero{color:var(--muted)}
  .subline{font-family:var(--mono);font-size:12.5px;background:var(--ink);color:#E8E9F5;border-radius:8px;padding:11px 13px;margin-top:12px;overflow-x:auto;white-space:pre;line-height:1.7}
  .subline .hl{color:#9BE6C4}
  details.uh{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:22px 0;overflow:hidden}
  details.uh summary{cursor:pointer;padding:14px 18px;font-weight:600;font-family:var(--display);font-size:15px;list-style:none;display:flex;align-items:center;gap:11px;user-select:none}
  details.uh summary::-webkit-details-marker{display:none}
  details.uh summary .ic{font-family:var(--mono);color:var(--accent);transition:transform .2s}details.uh[open] summary .ic{transform:rotate(90deg)}
  details.uh summary .hint{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
  .uh-body{padding:2px 18px 20px;border-top:1px solid var(--line)}.uh-body p{font-size:15px}
  .decoder{display:grid;gap:7px;margin:13px 0}.decoder .d{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:baseline;font-size:14px}
  .decoder .sym{font-family:var(--mono);color:var(--accent-deep);font-weight:600;text-align:center;background:var(--accent-soft);border-radius:6px;padding:3px 4px;font-size:12px}

  .quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin:26px 0}
  .quiz h3{font-family:var(--display);font-size:16px;margin:0 0 2px}
  .q{margin:18px 0 0}.q .stem{font-weight:500;margin:0 0 11px}
  .opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:11px 14px;margin:7px 0;font-size:14.5px;cursor:pointer;font-family:var(--body)}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .opt.right{border-color:var(--sparse);background:var(--sparse-soft);color:#1d5e4a;font-weight:500}.opt.wrong{border-color:#d98a8a;background:#fbecec;color:#8a3232}.opt:disabled{cursor:default}
  .fb{font-size:13.5px;color:var(--muted);margin:10px 0 0;min-height:16px}.fb.show{color:var(--ink)}

  .mnav{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:44px;padding-top:24px}
  .mnav .left{display:flex;align-items:center;gap:12px}
  .done-badge{color:var(--sparse);font-weight:600;font-size:14px;display:none;align-items:center;gap:6px}.done-badge.show{display:flex}
  .nextlink{font-size:14px;color:var(--muted);cursor:pointer;text-align:right}.nextlink:hover b{color:var(--accent-deep)}.nextlink b{color:var(--ink);font-weight:600;display:block;font-family:var(--display)}

  .promise{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:28px 0}
  .promise .pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:17px}
  .promise .pc .n{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.1em}.promise .pc h4{font-family:var(--display);font-size:15px;margin:8px 0 5px}.promise .pc p{font-size:13.5px;color:var(--muted);margin:0}
  .howto{background:var(--accent-soft);border-radius:14px;padding:20px 24px;margin:24px 0}.howto h3{font-family:var(--display);margin:0 0 12px;font-size:18px}.howto ol{margin:0;padding-left:20px}.howto li{margin:7px 0;font-size:15px}
  .complete-banner{display:none;background:linear-gradient(120deg,var(--sparse-soft),var(--win-soft));border:1px solid #bfe3d3;border-radius:14px;padding:20px 24px;margin:22px 0}.complete-banner.show{display:block}.complete-banner h3{font-family:var(--display);margin:0 0 6px}

  @media (max-width:900px){
    .shell{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    .rail-map{display:none}.rail-map.open{display:block}
    .map-toggle{display:flex;width:100%;justify-content:space-between;align-items:center;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-top:6px;font-weight:600;cursor:pointer;font-family:var(--body)}
    .cols2,.cols3{grid-template-columns:1fr}.slider-row{grid-template-columns:96px 1fr 52px}.decoder .d{grid-template-columns:80px 1fr}.metric{grid-template-columns:110px 1fr 40px}
  }
  @media (min-width:901px){.map-toggle{display:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="shell">
<aside class="rail">
  <div class="brandmark"><span class="dot"></span><b>How RAG Actually Works</b></div>
  <p class="sub">From "why ground a model at all" to GraphRAG and agentic retrieval — built up, but not dumbed down.</p>
  <div class="progress-wrap"><div class="pl"><span>Progress</span><span id="progTxt">0 / 18</span></div><div class="pbar"><i id="progBar"></i></div></div>
  <button class="map-toggle" id="mapToggle" aria-expanded="false">Course map <span aria-hidden="true">▾</span></button>
  <nav class="rail-map" id="railMap" aria-label="Modules">
    <button class="mod" data-go="home"><span class="num">·</span> Welcome &amp; how to use</button>
  </nav>
</aside>
<main class="main" id="main"></main>
</div>

<script>
/* ============================ SHARED CORPUS (running spine) ============================ */
var DOCS=[
  {id:"D1",text:"Stop your dog from barking: training techniques for excessive noise.",tags:["dog","bark","noise","training"]},
  {id:"D2",text:"Why puppies cry at night and how to soothe a restless pup.",tags:["dog","puppy","cry","night","soothe","noise"]},
  {id:"D3",text:"Quieting a noisy canine: anti-bark collars reviewed.",tags:["dog","bark","noise","collar"]},
  {id:"D4",text:"The best dog food brands for growing puppies.",tags:["dog","puppy","food"]},
  {id:"D5",text:"Cats and kittens: litter training basics.",tags:["cat","litter","training"]},
  {id:"D6",text:"Soundproofing your apartment from loud neighbours.",tags:["noise","apartment","neighbour","soundproof"]}
];
var STOP={"the":1,"a":1,"an":1,"to":1,"from":1,"your":1,"my":1,"keep":1,"how":1,"and":1,"for":1,"of":1,"at":1,"with":1,"i":1};
function toks(s){return s.toLowerCase().split(/[^a-z]+/).filter(function(w){return w&&!STOP[w];});}
var DF={};DOCS.forEach(function(d){var seen={};toks(d.text).forEach(function(w){if(!seen[w]){seen[w]=1;DF[w]=(DF[w]||0)+1;}});});
function idf(w){return DF[w]?Math.log(1+DOCS.length/DF[w]):0;}
function sparseScore(q,d){var set={};toks(d.text).forEach(function(w){set[w]=(set[w]||0)+1;});var s=0;toks(q).forEach(function(w){if(set[w])s+=idf(w)*(1+0.3*(set[w]-1));});return s;}
function denseScore(concepts,d){var s=0;concepts.forEach(function(c){if(d.tags.indexOf(c)>=0)s+=(c==="noise"||c==="dog")?0.7:1.0;});return s/Math.sqrt(d.tags.length);}
function rankBy(fn){var arr=DOCS.map(function(d){return {d:d,s:fn(d)};});var mx=Math.max.apply(null,arr.map(function(o){return o.s;}))||1;arr.forEach(function(o){o.n=o.s/mx;});arr.sort(function(a,b){return b.s-a.s;});return arr;}
function docRow(o,colour,badge){
  return '<div class="doc'+(o.s<=0.0001?' zero':'')+'"><div class="dt"><span class="did" style="color:'+colour+'">'+o.d.id+'</span>'+
    '<span style="color:var(--muted)">'+o.d.text+'</span>'+(badge||'')+'</div>'+
    '<div class="dtrack"><div class="dfill" style="background:'+colour+'"></div></div></div>';
}
function paintDocs(el,arr,colour,badgeFn){
  el.innerHTML=arr.map(function(o,i){return docRow(o,colour,badgeFn?badgeFn(o,i):'');}).join("");
  requestAnimationFrame(function(){[].forEach.call(el.querySelectorAll('.doc'),function(node,i){node.querySelector('.dfill').style.width=Math.max(2,arr[i].n*100)+'%';});});
}

/* ============================ CONTENT HELPERS ============================ */
function underHood(inner){return `<details class="uh"><summary><span class="ic">&#9656;</span> Under the hood <span class="hint">optional · the gist, not the algebra</span></summary><div class="uh-body">${inner}</div></details>`;}
function decoder(rows){return `<div class="decoder">${rows.map(function(r){return `<div class="d"><span class="sym">${r[0]}</span><span>${r[1]}</span></div>`;}).join("")}</div>`;}
function quiz(id,qs){return `<div class="quiz"><h3>Quick check</h3><p class="caption" style="margin:0">Pick an answer to see why.</p>${qs.map(function(q,i){return `<div class="q" data-c="${q.correct}" data-ok="${esc(q.ok)}" data-no="${esc(q.no)}"><p class="stem">${i+1}. ${q.stem}</p>${q.opts.map(function(o){return `<button class="opt">${o}</button>`;}).join("")}<p class="fb"></p></div>`;}).join("")}</div>`;}
function esc(s){return s.replace(/"/g,"&quot;");}

/* ============================ MODULES ============================ */
var MODS=[
{id:"m1",num:"01",part:"Part 1 · Foundations",title:"Why RAG Exists",
 thesis:"A model predicts what's plausible, not what's true — and it can't know your private or recent data at all. Retrieval fixes both.",
 render:function(){return `
  <p class="intro">If you did the LLM course, you already know the core problem: a model generates the <i>plausible</i> next word, not the <i>true</i> one, and everything it "knows" was frozen at training time. So it cannot know last week's news, your internal wiki, or this customer's order — and when it doesn't know, it doesn't stop. It fills the gap with something that <i>sounds</i> right.</p>
  <div class="card">
    <p class="ctitle">▸ see it · same question, two answers</p>
    <p class="caption">Ask about a fact the model was never trained on. Toggle retrieval on and off.</p>
    <div class="controls" style="margin-bottom:12px">
      <button class="btn ghost on" id="g_base">No retrieval</button>
      <button class="btn ghost" id="g_rag">With retrieval</button>
    </div>
    <p style="font-family:var(--mono);font-size:13px;color:var(--muted);margin:0 0 6px">Q: "What's our Q3 refund policy for enterprise customers?"</p>
    <div class="artifact" id="g_out"></div>
    <p class="readout" id="g_read"></p>
  </div>
  <h2><span class="k">why</span>Two problems, one fix</h2>
  <p>RAG (Retrieval-Augmented Generation) attacks both failure modes at once. <b>Hallucination:</b> instead of letting the model answer from its blurry memory, you fetch real, relevant text and put it in front of the model so the grounded answer becomes the most plausible one. <b>Stale and private knowledge:</b> the model's weights never change, but the <i>documents you retrieve</i> can be today's, or yours. You get current, proprietary answers from a model that was never trained on them.</p>
  <p>There's a third quiet benefit that matters enormously in production: <b>provenance</b>. Because the answer was built from specific retrieved passages, you can cite them. "Here's the answer, and here's the document it came from" is the difference between a toy and something a bank will deploy.</p>
  <div class="takeaway">RAG doesn't make the model smarter. It changes <b>what's in front of it</b> at answer-time — swapping blurry memory for fresh, specific, citable text.</div>
  <div class="callback">This is the exact fix you reasoned to in our chat: put the truth where the model can't help but predict it. The whole rest of this course is about doing that <i>well</i>.</div>
  ${quiz("m1",[{stem:"What does RAG actually change about how a model answers?",correct:2,opts:["It retrains the model on new facts","It changes what text is in front of the model at answer-time","It makes the model bigger"],ok:"Right — same frozen weights, different context. That's the whole trick.",no:"The weights don't change — RAG changes the context the model sees when it answers."}])}`;},
 init:function(){groundingWidget();}},

{id:"m2",num:"02",part:"Part 1 · Foundations",title:"The Core Pipeline",
 thesis:"Every RAG system, however fancy, is four moves: index, retrieve, augment, generate.",
 render:function(){return `
  <p class="intro">Before the variations, lock in the skeleton. Strip any RAG system down and you find the same four stages. Everything later in this course is a smarter version of one of these boxes — so it helps to know exactly which box each technique is upgrading.</p>
  <div class="card">
    <p class="ctitle">▸ watch · a query move through the pipeline</p>
    <p class="caption">Press the button to send a question through all four stages.</p>
    <div class="flow" id="p_flow"></div>
    <div class="controls"><button class="btn" id="p_run">▶ Run a query</button><button class="btn ghost" id="p_reset">Reset</button></div>
    <div class="artifact" id="p_art">Press "Run a query" to begin.</div>
  </div>
  <h2><span class="k">how</span>The four stages</h2>
  <p><b>Index (once, ahead of time):</b> chop your documents into chunks, turn each into an embedding, and store them in a searchable index. This is the prep work — done before any query arrives. <b>Retrieve (per query):</b> take the user's question, find the most relevant chunks from the index. <b>Augment:</b> stitch those chunks into the prompt alongside the question — literally building a bigger prompt that says "using this context, answer this." <b>Generate:</b> the model produces an answer grounded in what you handed it.</p>
  <div class="takeaway">"Naive RAG" is just these four with the simplest possible choice at each step. It works surprisingly often — and fails in ways that name the rest of this course: bad chunks, missed documents, fuzzy matches, ungrounded answers.</div>
  <div class="callback">Map for later: <b>chunking</b> upgrades Index. <b>Hybrid, reranking, query transforms</b> upgrade Retrieve. <b>Agentic RAG</b> wraps a loop around the whole thing. Keep this diagram in your head.</div>
  ${quiz("m2",[{stem:"Which stage happens once, ahead of time, rather than per-query?",correct:1,opts:["Index","Retrieve","Generate"],ok:"Right — indexing is the upfront prep; the other three run on every query.",no:"Indexing is the one-time prep step; retrieve, augment and generate run per query."}])}`;},
 init:function(){pipelineWidget();}},

{id:"m3",num:"03",part:"Part 2 · Retrieval — the types",title:"Sparse / Lexical (BM25)",
 thesis:"The oldest trick still in the toolbox: score documents by the rare words they share with the query.",
 render:function(){return `
  <p class="intro">Long before embeddings, search worked by matching words — and a tuned version of that, <b>BM25</b>, is still a serious baseline that modern systems refuse to drop. Understanding it is worth it because its strengths and blind spots are razor-sharp and predictable.</p>
  <div class="card">
    <p class="ctitle">▸ the formula</p>
    <div class="formula">score(D, Q) &nbsp;=&nbsp; <span style="font-size:19px;vertical-align:middle">Σ</span><sub style="font-size:11px">t ∈ Q</sub> &nbsp; IDF(t) · <span class="frac"><span class="fn">f(t,D) · (k₁ + 1)</span><span class="fd">f(t,D) + k₁ · (1 − b + b · |D| / avgdl)</span></span></div>
    <div class="formula" style="margin-top:10px">IDF(t) &nbsp;=&nbsp; ln<span style="font-size:17px;vertical-align:middle">(</span> <span class="frac"><span class="fn">N − n(t) + 0.5</span><span class="fd">n(t) + 0.5</span></span> &nbsp;+&nbsp; 1 <span style="font-size:17px;vertical-align:middle">)</span></div>
    <p class="caption" style="margin-top:14px"><b>f</b> = term count in the doc · <b>n</b> = docs containing the term · <b>|D|</b> = doc length in words · <b>k₁, b</b> = tuning knobs</p>

    <p class="ctitle" style="margin-top:22px">▸ work it through</p>
    <p class="caption">Pick a query and a document — every variable is filled in from the corpus and the score computed live.</p>
    <div class="qchips" id="b_chips"></div>
    <div class="qchips" id="b_docs" style="margin-top:8px"></div>
    <p class="formula" id="b_consts" style="font-size:12px;line-height:1.7;margin-top:12px"></p>
    <div id="b_table" style="margin-top:10px;overflow-x:auto"></div>
    <div class="subline" id="b_sub"></div>
    <div class="slider-row" style="margin-top:14px"><span class="lab">k₁ · TF saturation</span><input type="range" id="b_k1" min="2" max="30" value="15"><span class="val" id="b_k1v">1.5</span></div>
    <div class="slider-row"><span class="lab">b · length norm</span><input type="range" id="b_b" min="0" max="100" value="75"><span class="val" id="b_bv">0.75</span></div>
    <p class="readout" id="b_read"></p>
  </div>
  <h2><span class="k">how</span>Two ideas: frequency and rarity</h2>
  <p>BM25 scores a document on two intuitions. <b>Term frequency:</b> a query word appearing in a document is good, and appearing more is a bit better (with diminishing returns — the tenth "dog" doesn't count ten times). <b>Rarity (inverse document frequency):</b> a shared word that's rare across your whole corpus is far more informative than a common one. Matching on "soundproofing" tells you a lot; matching on "the" tells you nothing. That rarity weighting is why BM25 is so good at exact, distinctive terms.</p>
  <div class="takeaway">BM25 is fast, needs no training, no GPU, and is fully explainable — you can always say <i>which words</i> caused a match. For exact terms, codes, names and jargon it is genuinely hard to beat.</div>
  <div class="flag"><b>Honesty flag:</b> this is the <i>real</i> BM25 formula, computed live on a tiny 6-document corpus so the numbers stay legible. At production scale the only differences are corpus size and a vocabulary in the millions — the maths is identical.</div>
  ${underHood(`<p>Two details the formula hides:</p>${decoder([["+ 0.5","smoothing inside IDF — stops division blow-ups and keeps scores sane for terms in every or no document."],["k₁ ≈ 1.2–2","how fast extra occurrences stop helping. Higher = repeated terms keep mattering longer."],["b = 0.75","the usual length-normalisation default. b = 0 ignores length entirely; b = 1 normalises fully."]])}<p>Tune k₁ and b on your own data — there's no universal best, though these defaults are a strong start.</p>`)}
  ${quiz("m3",[{stem:"Why does matching the word \"soundproofing\" count for more than matching \"the\"?",correct:2,opts:["It's longer","Rare words carry more information (higher IDF)","It comes later in the sentence"],ok:"Exactly — rarity (IDF) is what makes a match informative.",no:"It's about rarity: \"soundproofing\" is rare across the corpus, so it's far more informative than \"the\"."}])}`;},
 init:function(){bm25Widget();}},

{id:"m4",num:"04",part:"Part 2 · Retrieval — the types",title:"Sparse vs. Dense",
 thesis:"Two completely different ways to find a document — and the gap between them is the entire reason hybrid search exists.",
 render:function(){return `
  <p class="intro">Now the contrast that drives every later decision. Sparse retrieval matches <i>words</i>. Dense (vector) retrieval matches <i>meaning</i>. They fail in opposite places — and seeing exactly where is what makes "hybrid" stop being a buzzword.</p>
  <div class="card">
    <p class="ctitle">▸ live demo · same query, two retrievers</p>
    <p class="caption">Pick a query. Watch keyword search (BM25) and semantic search (vector) rank the same six documents — differently.</p>
    <div class="qchips" id="sd_chips"></div>
    <p class="qline">query: <b id="sd_q">—</b></p>
    <div class="retr cols2">
      <div class="rcol"><div class="rhead"><span class="pip" style="background:var(--sparse)"></span> Sparse · BM25</div><p class="rsub">matches exact words</p><div id="sd_sparse"></div></div>
      <div class="rcol"><div class="rhead"><span class="pip" style="background:var(--accent)"></span> Dense · vector</div><p class="rsub">matches meaning</p><div id="sd_dense"></div></div>
    </div>
    <p class="readout" id="sd_read"></p>
  </div>
  <div class="card">
    <p class="ctitle">▸ how dense scoring works · cosine similarity</p>
    <div class="formula">cos(q, d) = <span class="frac"><span class="fn">q · d</span><span class="fd">|q| · |d|</span></span> &nbsp;&nbsp;<span style="color:var(--muted);font-size:12px">where</span>&nbsp; q · d = Σ qᵢdᵢ &nbsp;,&nbsp; |q| = √(Σ qᵢ²)</div>
    <p class="caption" style="margin-top:14px">Each query and document is a vector. Cosine measures the <b>angle</b> between them — direction, not length. Pick a query and see it scored against three documents (shown here in 2D so you can watch the arrows).</p>
    <div class="qchips" id="cs_chips"></div>
    <svg viewBox="0 0 320 200" class="svg-wrap gsvg" id="cs_svg" style="max-width:360px;margin:6px auto"></svg>
    <div id="cs_table" style="overflow-x:auto"></div>
    <div class="subline" id="cs_sub"></div>
    <p class="readout" id="cs_read"></p>
  </div>
  <h2><span class="k">how</span>Opposite failure modes</h2>
  <p><b>Sparse</b> is blind to paraphrase: "noisy hound" finds nothing in a doc about a "barking dog," because no words are shared. <b>Dense</b> is the mirror image — it catches paraphrase beautifully, but it can be <i>fuzzy</i>, returning things that are topically near while missing the one exact term you needed, and drifting toward generally-relevant over precisely-correct.</p>
  <div class="takeaway">Sparse nails <b>exact and rare</b>. Dense nails <b>meaning and paraphrase</b>. Neither is better — they fail in opposite directions. That is the whole argument for combining them.</div>
  <div class="callback">This is your QMD, decomposed: the BM25 half and the vector half are these two columns. Your hybrid approach exists precisely because either one alone leaves documents on the table.</div>
  ${quiz("m4",[{stem:"A user searches \"noisy hound\" but every document says \"barking dog\". Which retriever finds them?",correct:2,opts:["Sparse / BM25","Dense / vector — it matches meaning, not words","Neither, ever"],ok:"Right — same meaning, different words is dense retrieval's home turf.",no:"Different words, same meaning is exactly where vector search wins and keyword search goes blind."}])}`;},
 init:function(){sparseDenseWidget();cosineDemo();}},

{id:"m5",num:"05",part:"Part 2 · Retrieval — the types",title:"Hybrid + Fusion (RRF)",
 thesis:"Run both retrievers, then merge their rankings. The merge — Reciprocal Rank Fusion — is simpler than it sounds.",
 render:function(){return `
  <p class="intro">If sparse and dense fail in opposite directions, the obvious move is to run both and combine the results. The trick is <i>how</i> you combine two ranked lists whose scores aren't even on the same scale. The cleanest, most popular answer is <b>Reciprocal Rank Fusion (RRF)</b> — and it's the heart of your QMD.</p>
  <div class="card">
    <p class="ctitle">▸ the formula</p>
    <div class="formula">RRF(d) = <span style="font-size:18px;vertical-align:middle">Σ</span><sub style="font-size:11px">lists L</sub> &nbsp; <span class="frac"><span class="fn">1</span><span class="fd">k + rank<sub>L</sub>(d)</span></span> &nbsp;&nbsp;<span style="color:var(--muted);font-size:12px">summed over every list where d appears</span></div>
    <p class="caption" style="margin-top:14px">Pick a query. Each list ranks the docs; every doc earns 1/(k+rank) from each list it shows up in, and those add up. Watch a doc that's only mid-rank in both still win.</p>
    <div class="qchips" id="rf_chips"></div>
    <div class="retr cols2">
      <div class="rcol"><div class="rhead"><span class="pip" style="background:var(--sparse)"></span> Sparse list</div><p class="rsub">ranked</p><div id="rf_sparse"></div></div>
      <div class="rcol"><div class="rhead"><span class="pip" style="background:var(--accent)"></span> Dense list</div><p class="rsub">ranked</p><div id="rf_dense"></div></div>
    </div>
    <div id="rf_table" style="overflow-x:auto;margin-top:14px"></div>
    <div class="subline" id="rf_sub"></div>
    <div class="slider-row" style="margin-top:14px"><span class="lab">k constant</span><input type="range" id="rf_k" min="1" max="60" value="10"><span class="val" id="rf_kv">10</span></div>
    <p class="readout" id="rf_read"></p>
  </div>
  <h2><span class="k">how</span>Why ranks, not scores</h2>
  <p>You can't add a BM25 score to a cosine score — they live on different scales. RRF sidesteps this entirely by ignoring the raw scores and using only the <b>rank position</b>. Each document gets <code>1/(k + rank)</code> from each list it appears in, and those are summed. A document ranked #1 contributes a lot; #50 contributes almost nothing. The magic: a document that's solidly mid-rank in <i>both</i> lists can beat one that's #1 in a single list — agreement across methods wins.</p>
  <div class="takeaway">RRF is scale-free, parameter-light, and shockingly effective. It's why "just fuse the rankings" beats elaborate score-blending schemes most of the time — and why it's a sensible default for hybrid search.</div>
  ${underHood(`${decoder([["rank","a document's position in one list (1, 2, 3…)."],["k","a constant (often 60) that softens the gap between top ranks."],["RRF","sum of <code>1/(k+rank)</code> across every list the doc appears in."]])}<p>No training, no score calibration. Appearing respectably in several lists beats topping just one — which is exactly the robustness you want from hybrid.</p>`)}
  ${quiz("m5",[{stem:"Why does RRF use rank position instead of the raw retriever scores?",correct:2,opts:["Ranks are easier to display","BM25 and cosine scores aren't on the same scale, so they can't be added directly","Scores are always wrong"],ok:"Exactly — ranks are scale-free, so you can fuse fundamentally different retrievers.",no:"The scores live on different scales and can't be summed; ranks are scale-free, which is the point."}])}`;},
 init:function(){rrfWidget();}},

{id:"m6",num:"06",part:"Part 2 · Retrieval — the types",title:"Reranking",
 thesis:"Retrieve a generous shortlist fast, then re-score it with a slower, sharper model. Two stages, big precision win.",
 render:function(){return `
  <p class="intro">First-stage retrieval (sparse, dense, hybrid) is built for <i>speed</i> over millions of documents, which means it's a little blunt — the truly best answer might land at rank 4, not rank 1. <b>Reranking</b> fixes this with a second pass: take the top ~20 candidates and re-score them with a much more accurate (but slower) model that reads each query–document pair closely.</p>
  <div class="card">
    <p class="ctitle">▸ run it · before and after the reranker</p>
    <p class="caption">First-stage retrieval is fuzzy — the best doc sits mid-list. Press rerank and watch it surface.</p>
    <div class="retr cols2">
      <div class="rcol"><div class="rhead"><span class="pip" style="background:var(--accent)"></span> First-stage (fast)</div><p class="rsub">top 6, a bit noisy</p><div id="rr_before"></div></div>
      <div class="rcol"><div class="rhead"><span class="pip" style="background:var(--win)"></span> After reranking</div><p class="rsub">re-scored closely</p><div id="rr_after"></div></div>
    </div>
    <div class="controls"><button class="btn" id="rr_go">Rerank the shortlist</button><button class="btn ghost" id="rr_reset">Reset</button></div>
    <p class="readout" id="rr_read"></p>
  </div>
  <h2><span class="k">how</span>Bi-encoder vs cross-encoder</h2>
  <p>Here's the distinction that explains the whole pattern. First-stage dense retrieval uses a <b>bi-encoder</b>: query and document are embedded <i>separately</i>, so you can pre-compute every document vector once — fast, but the two never "see" each other. A reranker is usually a <b>cross-encoder</b>: it feeds the query and document <i>together</i> through the model, so it can judge their relationship directly. Far more accurate, but you can't pre-compute it, so it's too slow to run over everything — only over a shortlist.</p>
  <div class="takeaway">Retrieve wide and cheap, then rerank narrow and sharp. That two-stage shape — your RRF-vs-cross-encoder work — is the standard recipe for high-precision RAG.</div>
  <div class="callback">This is the other half of your QMD reranking question: RRF fuses, a cross-encoder re-scores. They solve different problems — fusion combines retrievers, reranking sharpens precision on the shortlist.</div>
  ${quiz("m6",[{stem:"Why can't you just run the accurate cross-encoder reranker over your whole corpus?",correct:1,opts:["It must read each query–document pair together, so it can't be pre-computed — too slow at scale","It's less accurate than retrieval","It only works on images"],ok:"Right — no pre-computation means it only fits a shortlist, not millions of docs.",no:"A cross-encoder scores query+doc together (can't pre-compute), so it's only affordable on a shortlist."}])}`;},
 init:function(){rerankWidget();}},

{id:"m7",num:"07",part:"Part 3 · Chunking & indexing",title:"Chunking Strategies",
 thesis:"How you slice documents quietly decides everything downstream. Chop badly and even perfect retrieval returns nonsense.",
 render:function(){return `
  <p class="intro">This is the most underrated stage in RAG. You can't retrieve whole documents — they're too big for the context and too coarse for precise matching — so you split them into chunks. But <i>where</i> you cut determines whether a retrieved chunk is a self-contained, useful answer or a sentence sliced in half mid-thought.</p>
  <div class="card">
    <p class="ctitle">▸ compare · the same document, four ways</p>
    <p class="caption">Switch strategy and watch how the chunks (the coloured blocks) change.</p>
    <div class="qchips" id="ck_chips"></div>
    <div class="card" style="margin:14px 0 0;background:var(--bg);box-shadow:none"><div class="chunkdoc" id="ck_doc"></div></div>
    <p class="tradeoff" id="ck_trade"></p>
  </div>
  <h2><span class="k">how</span>From naive to smart</h2>
  <p><b>Fixed-size</b> cuts every N characters — dead simple, but it slices mid-sentence and shreds meaning. <b>Recursive</b> respects structure, splitting on paragraph and sentence boundaries first, only breaking mid-sentence as a last resort — the sensible default. <b>Semantic</b> goes further, cutting where the <i>topic</i> shifts, so each chunk is one coherent idea. <b>Sentence-window</b> retrieves on single precise sentences but returns the surrounding sentences as context — small for matching, big for answering.</p>
  <div class="takeaway">Chunk size is a tradeoff: small chunks match precisely but lose context; large chunks keep context but dilute the match and waste tokens. There's no universal answer — it depends on your documents.</div>
  <div class="flag"><b>Honesty flag:</b> the chunk boundaries here are illustrative. Real semantic chunking uses embedding-similarity between sentences to find topic shifts; the point is to <i>see</i> how strategy changes the cuts.</div>
  ${quiz("m7",[{stem:"What's the core tradeoff in choosing chunk size?",correct:2,opts:["Bigger is always better","Small chunks match precisely but lose context; big chunks keep context but blur the match","Chunk size has no effect on retrieval"],ok:"Exactly — precision vs context, with no universal winner.",no:"It's precision (small) versus context (large) — the right size depends on your documents."}])}`;},
 init:function(){chunkWidget();}},

{id:"m8",num:"08",part:"Part 3 · Chunking & indexing",title:"Indexing & Embeddings",
 thesis:"The index isn't just vectors. Metadata filtering, embedding choice, and multi-vector tricks decide what's even searchable.",
 render:function(){return `
  <p class="intro">The retrieval modules assumed a pile of chunks to search. This module is about how that pile is <i>built and organised</i> — because smart indexing can do more for quality than a fancier retriever. The biggest lever is often the least glamorous: filtering by metadata before you ever compute a similarity.</p>
  <div class="card">
    <p class="ctitle">▸ try it · metadata filtering before search</p>
    <p class="caption">Toggle filters. Watch the candidate set shrink <i>before</i> vector search runs — faster and more precise.</p>
    <div class="controls" id="mf_filters" style="margin-bottom:12px"></div>
    <div id="mf_list"></div>
    <p class="readout" id="mf_read"></p>
  </div>
  <h2><span class="k">how</span>Three indexing levers</h2>
  <p><b>Metadata filtering:</b> tag every chunk with structured fields — date, source, author, department — and filter on them <i>before</i> semantic search. "Only official docs from 2024" turns a fuzzy semantic search into a precise one over a clean candidate set. <b>Embedding choice:</b> the model and dimensionality you embed with sets your quality ceiling; bigger isn't always better, and domain-tuned models often beat general ones. <b>Multi-vector (e.g. ColBERT):</b> instead of one vector per chunk, store one per token for finer-grained matching — more accurate, more storage.</p>
  <div class="takeaway">Metadata filtering is the cheapest, highest-leverage quality win in RAG and the most often skipped. If you know the answer is in this year's HR policies, don't make the vector search guess that.</div>
  ${quiz("m8",[{stem:"Why filter by metadata before running vector search?",correct:1,opts:["It narrows the candidate set to relevant docs, making search faster and more precise","It replaces the need for embeddings","It makes documents longer"],ok:"Right — pre-filtering is cheap, precise, and badly underused.",no:"Pre-filtering shrinks the search space to relevant docs — cheaper and more precise than letting the vectors guess."}])}`;},
 init:function(){metadataWidget();}},

{id:"m9",num:"09",part:"Part 4 · Advanced architectures",title:"Query Transformation",
 thesis:"The user's raw question is often a bad search query. Rewrite it before you retrieve.",
 render:function(){return `
  <p class="intro">A subtle truth: the words a user types are tuned for a human reader, not for your retriever. "It's broken, help" is hopeless as a search query. <b>Query transformation</b> sits <i>before</i> retrieval and reshapes the question into something that retrieves well — often the single biggest quality jump in an advanced RAG system.</p>
  <div class="card">
    <p class="ctitle">▸ explore · four ways to rewrite a query</p>
    <p class="caption">A vague user question. Pick a transformation and see what actually gets sent to the retriever.</p>
    <p style="font-family:var(--mono);font-size:13px;color:var(--muted);margin:0 0 10px">user typed: "it keeps crashing when I upload"</p>
    <div class="qchips" id="qt_chips"></div>
    <div class="artifact" id="qt_out" style="margin-top:14px"></div>
    <p class="readout" id="qt_read"></p>
  </div>
  <h2><span class="k">how</span>The main techniques</h2>
  <p><b>Rewriting:</b> clean the question into a clear, keyword-rich query. <b>Multi-query:</b> fan one question into several phrasings, retrieve for each, and pool the results — catches documents any single phrasing would miss. <b>HyDE</b> (Hypothetical Document Embeddings): have the model <i>write a fake answer</i>, then embed that and search with it — because a hypothetical answer looks more like the real document than the question does. <b>Step-back:</b> ask a broader question first to pull in background context, then the specific one.</p>
  <div class="takeaway">All of these spend a cheap extra model call <i>before</i> retrieval to make retrieval far better. When recall is your bottleneck, this is usually where to look first.</div>
  <div class="callback">HyDE is a neat inversion of the LLM course's lesson: it deliberately generates a plausible-but-maybe-false answer — not to show the user, but because its <i>shape</i> retrieves the true document better than the question does.</div>
  ${quiz("m9",[{stem:"What's the clever idea behind HyDE?",correct:2,opts:["It deletes the user's question","It generates a hypothetical answer and embeds THAT, because an answer resembles the target document more than a question does","It translates the query to another language"],ok:"Exactly — search with a fake answer's shape, retrieve the real one.",no:"HyDE embeds a generated hypothetical answer, which resembles the target document more closely than the bare question."}])}`;},
 init:function(){queryTransformWidget();}},

{id:"m10",num:"10",part:"Part 4 · Advanced architectures",title:"Advanced Retrieval Patterns",
 thesis:"Decouple what you match on from what you feed the model. Match small and precise; generate from big and rich.",
 render:function(){return `
  <p class="intro">A recurring insight powers several advanced patterns: the ideal unit for <i>matching</i> and the ideal unit for <i>generating</i> are different. You want to match against something small and specific, but answer from something larger with full context. These "small-to-big" patterns exploit exactly that.</p>
  <div class="card">
    <p class="ctitle">▸ see it · retrieve small, return big</p>
    <p class="caption">Toggle between what the retriever matched and what actually gets sent to the model.</p>
    <div class="controls" style="margin-bottom:12px"><button class="btn ghost on" id="s2b_match">What was matched</button><button class="btn ghost" id="s2b_sent">What's sent to the model</button></div>
    <div class="card" style="margin:0;background:var(--bg);box-shadow:none"><div class="chunkdoc" id="s2b_doc"></div></div>
    <p class="readout" id="s2b_read"></p>
  </div>
  <h2><span class="k">how</span>The pattern family</h2>
  <p><b>Sentence-window:</b> match on a single precise sentence, then return that sentence plus its neighbours. <b>Parent-document:</b> match on small child chunks, but return the whole parent section they belong to. <b>Auto-merging:</b> if several retrieved child chunks share a parent, merge them up into the parent automatically rather than handing the model fragments. All three keep matching precise while keeping generation well-fed.</p>
  <div class="takeaway">Stop forcing one chunk size to do two jobs. Index small for matching, expand to large for answering — you get precise retrieval and coherent, context-rich generation at once.</div>
  ${quiz("m10",[{stem:"What problem do small-to-big patterns solve?",correct:1,opts:["The best chunk for matching is small and specific, but the best chunk for answering has more context","Embeddings are too slow","Documents are too short"],ok:"Right — match small, generate big, no compromise.",no:"They decouple matching (wants small/precise) from generation (wants large/context-rich)."}])}`;},
 init:function(){smallToBigWidget();}},

{id:"m11",num:"11",part:"Part 4 · Advanced architectures",title:"Agentic & Iterative RAG",
 thesis:"Stop treating retrieval as one shot. Let the system check its own results and try again when they're bad.",
 render:function(){return `
  <p class="intro">Everything so far has been a straight line: retrieve once, generate once. <b>Agentic RAG</b> wraps a <i>loop</i> around that line. The system retrieves, then <b>grades its own results</b>, and if they're poor it does something about it — rewrites the query, searches the web, or asks for more — before answering. It's the difference between a lookup and an investigation.</p>
  <div class="card">
    <p class="ctitle">▸ run it · a self-correcting retrieval loop</p>
    <p class="caption">A "Corrective RAG" run. The first retrieval is weak — watch the system notice and fix it.</p>
    <div class="loop" id="cr_loop"></div>
    <div class="controls"><button class="btn" id="cr_run">▶ Run the loop</button><button class="btn ghost" id="cr_reset">Reset</button></div>
    <p class="readout" id="cr_read"></p>
  </div>
  <h2><span class="k">how</span>The named patterns</h2>
  <p><b>Corrective RAG (CRAG):</b> grade retrieved chunks for relevance; if they're weak, fall back to a web search or query rewrite before generating. <b>Self-RAG:</b> the model decides <i>whether</i> it even needs to retrieve, and critiques its own output for being grounded. <b>Adaptive RAG:</b> route easy questions straight to the model and hard ones through full retrieval. <b>Multi-hop:</b> for questions needing several facts, retrieve, reason, then retrieve again using what you just learned.</p>
  <div class="takeaway">The shift is from "retrieval is a function" to "retrieval is a step an agent controls." This is where RAG meets your Factory work — grading, routing, and looping are agent decisions, with all the human-in-the-loop and control questions that brings.</div>
  <div class="callback">Note the safety surface you care about: once the agent can trigger web searches and re-retrieval on its own, you're back in dangerous-tool-call territory — exactly the HITL enforcement problem from your Zora architecture.</div>
  ${quiz("m11",[{stem:"What core capability separates agentic RAG from naive RAG?",correct:2,opts:["It uses bigger embeddings","It runs faster","It grades its own retrieval and can act to fix poor results before answering"],ok:"Right — self-assessment and corrective action, in a loop.",no:"The key is self-evaluation: it judges its own retrieval and can re-retrieve or rewrite before answering."}])}`;},
 init:function(){cragWidget();}},

{id:"m12",num:"12",part:"Part 4 · Advanced architectures",title:"GraphRAG",
 thesis:"Some questions need connected facts, not similar paragraphs. Build a knowledge graph and traverse it.",
 render:function(){return `
  <p class="intro">Vector search finds passages that are <i>similar</i> to your query. But some questions need facts that are <i>connected</i> — and connection isn't similarity. "Which product did the founder of the company that acquired Acme work on?" needs you to hop across relationships, not find one matching paragraph. <b>GraphRAG</b> builds a knowledge graph of entities and relationships, then answers by walking it.</p>
  <div class="card">
    <p class="ctitle">▸ compare · flat chunks vs graph traversal</p>
    <p class="caption">A multi-hop question. Watch flat retrieval grab one node and stall, while the graph walks the path.</p>
    <p style="font-family:var(--mono);font-size:13px;color:var(--muted);margin:0 0 4px">Q: "What did the founder of the company that made Orbit work on before?"</p>
    <svg viewBox="0 0 380 230" class="svg-wrap gsvg" id="gr_svg"></svg>
    <div class="controls"><button class="btn" id="gr_flat">Flat retrieval</button><button class="btn ghost" id="gr_graph">Graph traversal</button></div>
    <p class="readout" id="gr_read"></p>
  </div>
  <h2><span class="k">how</span>Building and using the graph</h2>
  <p>An indexing pass uses an LLM to extract <b>entities</b> (people, companies, products) and the <b>relationships</b> between them from your documents, assembling a graph. At query time you find the relevant entities, then <b>traverse</b> the connections to gather facts that no single chunk contains. Microsoft's GraphRAG adds <b>community summaries</b> — pre-summarising clusters of the graph — so it can also answer broad "what are the main themes?" questions that flat retrieval handles terribly.</p>
  <div class="takeaway">Use GraphRAG when relationships and multi-hop reasoning matter, or when you need global, whole-corpus answers. It's heavier to build than vector RAG, so reach for it when flat retrieval visibly fails — not by default.</div>
  ${quiz("m12",[{stem:"When is GraphRAG worth its extra complexity over plain vector search?",correct:2,opts:["When documents are short","Always — it's strictly better","When questions need connected facts across multiple hops, or global whole-corpus themes"],ok:"Right — connection and multi-hop reasoning are where graphs beat similarity.",no:"It shines on multi-hop, relationship-heavy, or global questions — not as a blanket replacement."}])}`;},
 init:function(){graphWidget();}},

{id:"m13",num:"13",part:"Part 5 · Making it real",title:"Evaluation",
 thesis:"You can't improve what you don't measure. RAG has its own metrics — and 'it seemed fine' isn't one.",
 render:function(){return `
  <p class="intro">Every change you make to a RAG system — chunk size, retriever, reranker — could help or quietly hurt. Eyeballing a few answers won't tell you which. RAG evaluation breaks quality into specific, separately-measurable pieces so you can see exactly <i>where</i> a pipeline is failing: retrieval, or generation.</p>
  <div class="card">
    <p class="ctitle">▸ the metrics, as formulas</p>
    <div class="formula">precision = <span class="frac"><span class="fn">relevant chunks retrieved</span><span class="fd">total chunks retrieved</span></span> &nbsp;&nbsp; recall = <span class="frac"><span class="fn">relevant chunks retrieved</span><span class="fd">relevant chunks that exist</span></span></div>
    <div class="formula" style="margin-top:8px">faithfulness = <span class="frac"><span class="fn">answer claims supported by context</span><span class="fd">total claims in the answer</span></span></div>
    <p class="caption" style="margin-top:14px">Toggle a healthy vs broken pipeline. The chunks and claims below feed straight into the fractions.</p>
    <div class="controls" style="margin-bottom:14px"><button class="btn ghost on" id="ev_good">Healthy RAG</button><button class="btn ghost" id="ev_bad">Broken RAG</button></div>
    <div id="ev_scenario"></div>
    <div id="ev_calc" style="margin-top:12px"></div>
    <p class="readout" id="ev_read"></p>
  </div>
  <h2><span class="k">how</span>The four core metrics</h2>
  <p>Split into <b>retrieval</b> quality and <b>generation</b> quality. <b>Context precision:</b> of the chunks you retrieved, how many were actually relevant (low = you're pulling junk). <b>Context recall:</b> of the chunks you needed, how many did you retrieve (low = you're missing evidence). <b>Faithfulness:</b> is the answer actually supported by the retrieved context, or did the model make things up (low = hallucination). <b>Answer relevance:</b> does the answer address the question. The first two grade retrieval; the last two grade generation.</p>
  <div class="takeaway">These let you localise failure. Bad faithfulness with good context means your generation prompt is the problem; bad recall means fix retrieval. Frameworks like RAGAS automate this — often using an LLM as the judge.</div>
  ${quiz("m13",[{stem:"Your answers are confident but often unsupported by the retrieved docs. Which metric catches this?",correct:1,opts:["Faithfulness — it measures whether the answer is grounded in the context","Context recall","Latency"],ok:"Right — low faithfulness means the model is going beyond (or against) its evidence.",no:"That's faithfulness: it specifically measures whether the answer is supported by the retrieved context."}])}`;},
 init:function(){evalWidget();}},

{id:"m14",num:"14",part:"Part 5 · Making it real",title:"Production Concerns",
 thesis:"Shipping RAG means caching, latency, freshness — and a real security boundary, because retrieved text can attack you.",
 render:function(){return `
  <p class="intro">A RAG demo and a RAG product are different animals. In production you fight latency and cost, keep the index fresh, and — the one most teams underestimate — you treat retrieved content as <b>untrusted input</b>. Because if an attacker can get text into your index or your sources, they can put instructions in front of your model.</p>
  <div class="card">
    <p class="ctitle">▸ the one that bites · context poisoning</p>
    <p class="caption">A malicious instruction is hiding in a retrieved document. Toggle between trusting it blindly and validating first.</p>
    <div class="controls" style="margin-bottom:12px"><button class="btn ghost on" id="px_naive">Trust all retrieved text</button><button class="btn ghost" id="px_safe">Validate &amp; isolate</button></div>
    <div class="card" style="margin:0 0 12px;background:var(--bg);box-shadow:none"><p style="margin:0;font-family:var(--mono);font-size:12px;color:var(--muted)">📄 retrieved chunk #3</p><p id="px_doc" style="margin:7px 0 0;font-size:14px"></p></div>
    <div class="artifact" id="px_out"></div>
    <p class="readout" id="px_read"></p>
  </div>
  <h2><span class="k">how</span>The production checklist</h2>
  <p><b>Caching:</b> cache embeddings and frequent query results — your multi-layer caching work — to cut latency and cost dramatically. <b>Latency:</b> every stage adds time; reranking and agentic loops especially, so budget them. <b>Freshness:</b> documents change, so you need a re-indexing strategy, not a one-time build. <b>Security:</b> retrieved text is untrusted — sanitise it, keep it clearly separated from your instructions in the prompt, and never let a retrieved document silently become a command. <b>Observability:</b> log what was retrieved for every answer so you can debug and audit.</p>
  <div class="takeaway">The retrieved context is an attack surface. Indirect prompt injection through poisoned documents is a real, active threat — and it's the exact trust-boundary problem from your agentic and HITL work, now wearing a RAG hat.</div>
  <div class="callback">Full circle to your Factory concerns: the moment retrieval feeds an agent that can act, "is this retrieved text trustworthy?" becomes a load-bearing safety question, not a nicety.</div>
  ${quiz("m14",[{stem:"Why must retrieved documents be treated as untrusted input?",correct:2,opts:["They're always low quality","They slow the system down","An attacker who gets text into your sources can inject instructions the model may follow"],ok:"Right — indirect prompt injection via poisoned content is a genuine production threat.",no:"Retrieved text can carry injected instructions; if you trust it blindly, an attacker can steer your model."}])}`;},
 init:function(){poisonWidget();}},
{id:"mcache",num:"15",part:"Part 5 · Making it real",title:"Semantic Query Caching",
 thesis:"Different people ask the same question in different words. Cache by meaning, not by string — and stop paying for the same answer twice.",
 render:function(){return `
  <p class="intro">Start from the absolute basics. A <b>cache</b> is just a memory of past work: the first time a question comes in, you do the expensive thing (run the whole RAG pipeline), then <b>store the answer next to the question</b>. If the same question arrives again, you skip the pipeline and serve the stored answer — milliseconds instead of seconds, fractions of a cent instead of a full model call. The catch is one word in that sentence: <i>same</i>. What counts as the same question?</p>
  <div class="card">
    <p class="ctitle">▸ play · one cache, two matching rules</p>
    <p class="caption">Three answers are already cached. Send in a query and see whether it hits. Toggle between exact-string matching and semantic matching.</p>
    <div class="controls" style="margin-bottom:10px"><button class="btn ghost on" id="sc_exact">Exact-match cache</button><button class="btn ghost" id="sc_sem">Semantic cache</button></div>
    <div class="qchips" id="sc_chips"></div>
    <div id="sc_store" style="margin-top:14px"></div>
    <div class="slider-row" id="sc_thr_row" style="margin-top:10px"><span class="lab">threshold</span><input type="range" id="sc_thr" min="70" max="99" value="90"><span class="val" id="sc_thrv">0.90</span></div>
    <div class="artifact" id="sc_out"></div>
    <p class="readout" id="sc_read"></p>
  </div>
  <h2><span class="k">how</span>From exact-match to meaning-match</h2>
  <p><b>Exact-match caching</b> is the classic kind: the key is the query string itself (usually hashed). It is instant and cannot be wrong — but only a <i>verbatim</i> repeat hits. "How do I reset my password?", "password reset help" and "I forgot my login details" are one intent in three strings, and a string cache sees three different keys. Real user traffic is nearly all paraphrase, so exact matching leaves most of the savings on the table.</p>
  <p><b>Semantic caching</b> fixes it with machinery you already have from Module 4: <b>embed the incoming query</b>, compare it to the embeddings of cached queries with cosine similarity, and if the best match clears a <b>threshold</b>, serve that cached answer. On a miss, run the pipeline and store the new pair — the cache warms itself up from live traffic.</p>
  <div class="takeaway">A semantic cache is just <b>dense retrieval over your own past Q&amp;A</b>. Same embeddings, same cosine, same nearest-neighbour search — pointed at questions you have already paid to answer.</div>
  <h2><span class="k">why</span>The threshold is the whole game</h2>
  <p>Set it <b>too high</b> (say 0.98) and honest paraphrases miss — you pay for the pipeline again and the cache barely earns its keep. Set it <b>too low</b> and you get the failure that is <i>worse than a miss</i>: a <b>false hit</b>. Try it above — "How do I <b>cancel</b> my subscription?" sits at 0.88 similarity to the cached "How do I <b>renew</b> my subscription?" — nearly identical words, <i>opposite intent</i>. Drop the threshold below 0.88 and the user asking to leave gets renewal instructions. A miss costs you a model call; a false hit costs you a wrong answer served with total confidence.</p>
  <p>The payoff when it is tuned right is blunt economics: at 10,000 queries a day, a 35% hit rate on a $0.01 pipeline call saves about <code>10,000 × 0.35 × $0.01 ≈ $35/day</code> — and every hit returns in ~15 ms instead of ~2.5 s. Cost <i>and</i> latency drop together, which is rare.</p>
  <div class="flag"><b>Honesty flag:</b> the similarity numbers in the demo are hand-set so the teaching cases are crisp. A real system computes them from an embedding model — but the behaviour, including the cancel/renew trap, is exactly what happens in production.</div>
  ${underHood(`${decoder([["threshold","typical values are 0.90–0.97. There is no universal number — tune it on your own traffic, and start high: false hits hurt more than misses."],["TTL / invalidation","cached answers go stale when source documents change. Give entries a lifetime, and flush the cache when you re-index (Module 14 freshness)."],["scope","cache per-tenant or per-permission-level. Never let one user\\u2019s personalised or private answer become another user\\u2019s cache hit."]])}<p>One more production habit: log every hit with its similarity score. A drift in hit quality is your early warning that the threshold or the embedding model needs revisiting.</p>`)}
  <h2><span class="k">edge</span>When the same question has different answers</h2>
  <p>Everything above assumed one question maps to one stable answer. Often it does not, and a cache handles each flavour differently. <b>Sampling wobble</b> — the LLM dice-roll — means the same prompt words itself differently each run; a cache accidentally <i>fixes</i> this by freezing the first answer for everyone, which is usually a feature. Just remember you froze a random draw, so only cache answers that pass a quality check. <b>Volatile facts</b> ("current outage status", "today\\u2019s exchange rate") have a shelf life of minutes — classify these and bypass the cache or give them a short TTL. <b>Conversational queries</b> ("what about the second option?") mean nothing standalone — run the Module 9 query rewrite <i>first</i>, then cache the rewritten question.</p>
  <p>And the sharpest one: <b>personalised answers</b>. "When does my subscription renew?" is the same string from every customer, but the correct answer is different for each — and serving one user\\u2019s answer to another is a privacy breach, not just a wrong answer. The fix is in the <b>key</b>: cache on (query embedding + user or tenant scope), not the embedding alone.</p>
  <div class="card">
    <p class="ctitle">▸ try it · why the scope belongs in the key</p>
    <p class="caption">Two users ask the identical question. Toggle how the cache key is built.</p>
    <div class="controls" style="margin-bottom:10px"><button class="btn ghost on" id="sk_naive">Key = query only</button><button class="btn ghost" id="sk_scoped">Key = query + user</button></div>
    <p style="font-family:var(--mono);font-size:13px;color:var(--muted);margin:0 0 8px">Alice, then Bob, both ask: "When does my subscription renew?"</p>
    <div class="artifact" id="sk_out"></div>
    <p class="readout" id="sk_read"></p>
  </div>
  <div class="takeaway">A cache is only safe for a <b>pure function</b>. <code>answer(query)</code> is secretly <code>answer(query, docs version, user, time, dice)</code> — caching silently pins the hidden arguments. Either fold them into the key, or recognise that query class is not cacheable.</div>
  <div class="callback">This upgrades the caching line from Module 14 — and it is the same cosine worked example from Module 4, re-aimed. You already run this pattern in your multi-layer caching work; semantic matching is the layer that survives users rewording things.</div>
  ${quiz("mcache",[
    {stem:"Why does exact-string caching perform poorly on real user questions?",correct:2,opts:["Hashing strings is slow","Users phrase the same intent in many different strings, and each string is a different key","Cached answers expire too quickly"],ok:"Right — paraphrase is the norm, and a string cache treats every rewording as a brand-new question.",no:"The problem is paraphrase: same intent, different strings, different keys — so almost everything misses."},
    {stem:"What is the risk of setting the similarity threshold too low?",correct:3,opts:["The cache uses more memory","Paraphrases stop matching","False hits — a semantically close but different-intent question gets served the wrong cached answer"],ok:"Exactly — like serving renewal steps to someone asking to cancel. Worse than a miss.",no:"Too low means false hits: near-identical wording with opposite intent gets a confident wrong answer."}
  ])}`;},
 init:function(){semCacheWidget();scopeKeyWidget();}},
{id:"mscale",num:"16",part:"Part 5 · Making it real",title:"RAG at Massive Scale",
 thesis:"Millions of PDFs means billions of comparisons you cannot afford. Approximate search, compression, and sharding keep retrieval fast — and they are three separate tools.",
 render:function(){return `
  <p class="intro">Run the numbers for "millions of PDFs": easily 100M+ chunks, each a vector of ~1,536 floats. Comparing a query against <i>every</i> vector is too slow, and the raw vectors alone run to hundreds of gigabytes — too big for one machine. Scale forces three separate fixes: a <b>smarter search</b> (ANN — HNSW or IVF), <b>compression</b> (PQ), and <b>more machines</b> (sharding). The scary line "Sharding + HNSW / IVF / PQ" is just those three, mashed together.</p>

  <div class="card">
    <p class="ctitle">▸ explore · IVF — search a few buckets, not everything</p>
    <p class="caption">37 vectors, clustered into 4 cells. Pick a query, toggle the mode, and watch how many vectors actually get checked — and whether the true nearest neighbour is found.</p>
    <div class="controls" style="margin-bottom:8px"><button class="btn ghost on" id="iv_brute">Brute force</button><button class="btn ghost" id="iv_ivf">IVF</button></div>
    <div class="qchips" id="iv_chips"></div>
    <svg viewBox="0 0 380 250" class="svg-wrap gsvg" id="iv_svg" style="margin-top:10px"></svg>
    <div class="slider-row" id="iv_np_row"><span class="lab">nProbe (cells searched)</span><input type="range" id="iv_np" min="1" max="4" value="1"><span class="val" id="iv_npv">1</span></div>
    <p class="readout" id="iv_read"></p>
  </div>

  <h2><span class="k">how</span>Approximate, not exhaustive</h2>
  <p><b>IVF</b> (inverted file index) is postcode logic: cluster the vectors up front, and at query time compare against the handful of <i>centroids</i> first, then search only the nearest few cells. You check a fraction of the vectors — at the cost you just saw: if the true nearest neighbour sits across a cell boundary, a low <code>nProbe</code> misses it. That miss <i>is</i> the "approximate" in ANN.</p>
  <p><b>HNSW</b> gets the same speed a different way: a navigable graph of vectors with layers like a road network — sparse motorway links on top for long jumps, dense local streets at the bottom for precision. Start anywhere, greedily hop toward the query, and you arrive in a few dozen hops instead of millions of comparisons. It is the accuracy king of ANN, but it keeps the whole graph in RAM — which is exactly why the next two tools exist.</p>
  <div class="takeaway">ANN trades a <b>sliver of recall</b> for <b>orders of magnitude of speed</b>. Every production vector search you have ever used makes this trade — the knobs (nProbe, efSearch) just decide how big the sliver is.</div>

  <h2><span class="k">how</span>PQ — the quantization ruler, again</h2>
  <p>Product Quantization is the <i>same ruler trick</i> as the quantization module in the LLM course, aimed at the index instead of the model. Chop each 1,536-dim vector into sub-chunks, snap each sub-chunk to its nearest entry in a small learned codebook, and store only the tiny codes: <code>1,536 floats × 4 B ≈ 6 KB</code> becomes <code>~128 B</code> of codes — a <b>~48× shrink</b> for a small accuracy cost. Suddenly far more of the index fits in RAM, and the sharding maths below changes completely.</p>
  <div class="card">
    <p class="ctitle">▸ the memory maths · raw vectors vs PQ</p>
    <p class="caption">Slide the corpus size. Toggle compression. Watch how many machines the index needs.</p>
    <div class="slider-row"><span class="lab">chunks (millions)</span><input type="range" id="sw_ch" min="10" max="500" step="10" value="100"><span class="val" id="sw_chv">100M</span></div>
    <div class="controls" style="margin:6px 0 0"><button class="btn ghost on" id="sw_fp">Raw FP32</button><button class="btn ghost" id="sw_pq">PQ-compressed</button></div>
    <div class="nodes" id="sw_nodes"></div>
    <p class="readout" id="sw_read"></p>
  </div>

  <h2><span class="k">how</span>Sharding — Kafka partitions for vectors</h2>
  <p>When even the compressed index outgrows one machine, you <b>shard</b>: split the vectors across nodes, fan the query out to every shard, let each search its slice, and merge the local top-k lists into a global answer. Scatter-gather — the identical mental model to Kafka partitions across brokers or Elasticsearch shards. Sharding solves <i>memory and throughput</i>; it has nothing to do with how each shard searches internally (that is HNSW/IVF) or how big the vectors are (that is PQ). Three tools, three different problems.</p>
  <div class="card">
    <p class="ctitle">▸ run it · scatter-gather across three shards</p>
    <p class="caption">The six-document corpus, split across three shards. Query: "keep my noisy hound quiet". No shard sees everything — the merge rebuilds the global view.</p>
    <div class="retr cols3" id="sw_shards"></div>
    <div class="rcol" style="margin-top:12px"><div class="rhead"><span class="pip" style="background:var(--win)"></span> Merged · global top-3</div><div id="sw_merged"></div></div>
    <div class="controls"><button class="btn" id="sw_run">▶ Run the query</button><button class="btn ghost" id="sw_reset">Reset</button></div>
    <p class="readout" id="sw_sread"></p>
  </div>

  <h2><span class="k">why</span>And the pile of vector databases?</h2>
  <p>Milvus, Qdrant, Vespa, Weaviate, pgvector, Elastic — these are <b>alternatives, not a stack</b>, like listing Postgres, MySQL and Oracle in one breath. They all implement the machinery above; they differ on operational shape (managed vs self-hosted, filtering strength, hybrid support). The unglamorous enterprise guidance: <b>start with what you already operate</b> — Elastic or Postgres+pgvector cover single-node scale comfortably — and reach for a dedicated distributed store only when the maths above forces you to. And remember Module 8: metadata filtering shrinks the search space <i>before</i> any of this machinery runs. The cheapest vector comparison is the one you never make.</p>
  <div class="flag"><b>Honesty flag:</b> the IVF widget is a 2-D toy — real vectors live in hundreds of dimensions where cell boundaries are hyperplanes, but the boundary-miss behaviour you see is exactly the real failure mode. The shard demo splits our six-doc corpus for legibility; real shards hold millions each.</div>
  ${underHood(`${decoder([["nlist / nProbe","how many cells you create (rule of thumb: about the square root of N) and how many you search. Raising nProbe buys recall with latency."],["M / efSearch","the HNSW knobs — graph connectivity and search-time effort. Bigger = more accurate, more RAM, slower."],["PQ m × bits","split each vector into m sub-vectors, each coded with (say) 8 bits against a learned codebook. Compression is m bytes per vector instead of dims × 4."]])}<p>All three knobs move the same dial: recall versus speed versus memory. Production tuning is picking the corner of that triangle you can live with.</p>`)}
  <div class="callback">This decodes the interview one-liner properly: <i>shard the index across machines; inside each shard use HNSW or IVF; compress with PQ so more fits</i>. And note what Zora tells you: at single-node scale, none of this machinery is needed — hybrid BM25 + vectors on one box is the right answer until the memory maths says otherwise.</div>
  ${quiz("mscale",[
