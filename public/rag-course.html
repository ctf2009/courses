{id:"m15",num:"17",part:"Part 6 · Frontiers & tradeoffs",title:"Multimodal RAG",
 thesis:"Not all knowledge is text. Retrieve across images, tables and charts by embedding them into the same space.",
 render:function(){return `
  <p class="intro">So far every chunk has been text. But a huge amount of real knowledge lives in <b>images, diagrams, tables and charts</b> — a wiring diagram, a revenue table, a screenshot. Multimodal RAG lets a text query reach those too, by embedding different media into a <i>shared</i> vector space where a sentence and a picture of the same thing land near each other.</p>
  <div class="card">
    <p class="ctitle">▸ try it · a text query over a mixed corpus</p>
    <p class="caption">The query is text. Toggle the index type and watch whether the relevant <i>image</i> can be retrieved.</p>
    <div class="controls" style="margin-bottom:12px"><button class="btn ghost on" id="mm_text">Text-only index</button><button class="btn ghost" id="mm_multi">Multimodal index</button></div>
    <p style="font-family:var(--mono);font-size:13px;color:var(--muted);margin:0 0 8px">query: "a dog barking in a garden"</p>
    <div id="mm_list"></div>
    <p class="readout" id="mm_read"></p>
  </div>
  <h2><span class="k">how</span>Two approaches</h2>
  <p>There are two ways to do it. <b>Shared-embedding models</b> (like CLIP for image–text) embed every modality into one space directly, so a text query's vector can match an image's vector. <b>Caption-then-embed</b> is the pragmatic alternative: run images and tables through a vision model to produce text descriptions, then embed those as normal text — simpler, and it slots into an existing text pipeline. Tables and charts especially benefit from being summarised into text before indexing.</p>
  <div class="takeaway">If your documents are full of figures, screenshots or tabular data, text-only RAG is blind to most of your knowledge. Multimodal retrieval — or at least captioning — is how you stop leaving it on the floor.</div>
  ${quiz("m15",[{stem:"How can a text query retrieve a relevant image?",correct:3,opts:["It can't — text and images are incompatible","Only by converting every image to text first","Both modalities are embedded into a shared vector space, so their vectors can be compared directly"],ok:"Right — a shared space (or caption-then-embed) makes cross-modal matching possible.",no:"A shared embedding space lets a sentence and an image of the same thing land near each other."}])}`;},
 init:function(){multimodalWidget();}},
{id:"m16",num:"18",part:"Part 6 · Frontiers & tradeoffs",title:"Long-Context vs. RAG",
 thesis:"If the model has a million-token window, do you still need retrieval? Usually yes — and here's exactly why.",
 render:function(){return `
  <p class="intro">A fair question with huge context windows: why retrieve at all — why not just stuff every document into the prompt and let the model sort it out? Sometimes that's the right call. But for most production systems it isn't, and the reasons are concrete: cost, latency, recall, and scale.</p>
  <div class="card">
    <p class="ctitle">▸ compare · stuff-everything vs retrieve-then-generate</p>
    <p class="caption">Slide the corpus size. Watch cost, latency and answer quality for each approach.</p>
    <div class="slider-row"><span class="lab">corpus size</span><input type="range" id="lc_size" min="1" max="100" value="15"><span class="val" id="lc_sizev"></span></div>
    <div class="retr cols2" style="margin-top:8px">
      <div class="rcol"><div class="rhead"><span class="pip" style="background:var(--danger)"></span> Stuff everything</div><div class="metrics" id="lc_stuff" style="margin-top:8px"></div></div>
      <div class="rcol"><div class="rhead"><span class="pip" style="background:var(--sparse)"></span> RAG (retrieve top-k)</div><div class="metrics" id="lc_rag" style="margin-top:8px"></div></div>
    </div>
    <p class="readout" id="lc_read"></p>
  </div>
  <h2><span class="k">how</span>The real tradeoffs</h2>
  <p><b>Cost</b> scales with tokens: stuffing a whole corpus into every query is linear and brutal at scale; RAG sends only the top few chunks, so its cost stays roughly flat. <b>Latency</b> follows cost — more tokens, slower responses. <b>Recall</b> is the surprise: long-context models suffer "lost in the middle," where facts buried in a huge context get overlooked, so quality can actually <i>degrade</i> as you stuff more in. And <b>scale</b> is a hard wall — no window fits a million-document corpus, ever.</p>
  <div class="takeaway">Long context doesn't replace RAG — it <i>complements</i> it. The modern pattern is RAG to narrow millions of documents to the best dozen, then a generous context window to reason over them richly. Retrieval for precision, context for depth.</div>
  <div class="callback">"Lost in the middle" is the same effect from Module 6's reranking and your QMD work — position matters, whether in a reranked shortlist or a giant context window.</div>
  ${quiz("m16",[{stem:"Why not just put the entire corpus in a long context window for every query?",correct:3,opts:["Long context is always less accurate","It's technically impossible to use long context","Cost and latency scale with tokens, recall degrades from 'lost in the middle', and no window fits a huge corpus"],ok:"Right — cost, latency, recall and scale all push toward retrieval for most systems.",no:"It's the combination: token cost, latency, lost-in-the-middle recall loss, and corpora too big to ever fit."}])}`;},

/* M3 bm25 — full formula worked example */
function bm25Widget(){
  function ftoks(s){return s.toLowerCase().split(/[^a-z]+/).filter(Boolean);}
  var docTok=DOCS.map(function(d){return {id:d.id,text:d.text,tk:ftoks(d.text)};});
  var N=DOCS.length;
  var avgdl=docTok.reduce(function(a,d){return a+d.tk.length;},0)/N;
  function nContaining(t){var c=0;docTok.forEach(function(d){if(d.tk.indexOf(t)>=0)c++;});return c;}
  function tf(t,d){var c=0;d.tk.forEach(function(w){if(w===t)c++;});return c;}
  function bidf(t){var n=nContaining(t);return Math.log((N-n+0.5)/(n+0.5)+1);}
  var QPRE=["dog training","barking noise","loud neighbours"];
  var STOPQ={"the":1,"a":1,"for":1,"and":1,"to":1,"of":1,"my":1,"your":1};
  function qterms(q){return ftoks(q).filter(function(w){return !STOPQ[w];});}
  var state={qi:0,doc:"D1"};
  var chips=document.getElementById('b_chips'),docbtns=document.getElementById('b_docs'),
      consts=document.getElementById('b_consts'),table=document.getElementById('b_table'),
      sub=document.getElementById('b_sub'),read=document.getElementById('b_read'),
      k1s=document.getElementById('b_k1'),bs=document.getElementById('b_b'),k1v=document.getElementById('b_k1v'),bv=document.getElementById('b_bv');
  QPRE.forEach(function(q,i){var btn=document.createElement('button');btn.className='chip';btn.textContent=q;btn.dataset.i=i;btn.onclick=function(){state.qi=i;draw();};chips.appendChild(btn);});
  DOCS.forEach(function(d){var btn=document.createElement('button');btn.className='chip';btn.textContent=d.id;btn.dataset.id=d.id;btn.onclick=function(){state.doc=d.id;draw();};docbtns.appendChild(btn);});
  function draw(){
    [].forEach.call(chips.children,function(c){c.classList.toggle('on',+c.dataset.i===state.qi);});
    [].forEach.call(docbtns.children,function(c){c.classList.toggle('on',c.dataset.id===state.doc);});
    var k1=+k1s.value/10,b=+bs.value/100;k1v.textContent=k1.toFixed(1);bv.textContent=b.toFixed(2);
    var d=docTok.filter(function(x){return x.id===state.doc;})[0];
    var terms=qterms(QPRE[state.qi]),len=d.tk.length,lenFactor=(1-b+b*len/avgdl);
    consts.innerHTML='N = '+N+' docs &nbsp;·&nbsp; avgdl = '+avgdl.toFixed(2)+' &nbsp;·&nbsp; |'+d.id+'| = '+len+' words &nbsp;·&nbsp; k₁ = '+k1.toFixed(1)+' &nbsp;·&nbsp; b = '+b.toFixed(2);
    var total=0,rows='',first=null;
    terms.forEach(function(t){
      var f=tf(t,d),n=nContaining(t),id=bidf(t);
      var tfpart=f===0?0:f*(k1+1)/(f+k1*lenFactor),contrib=id*tfpart;
      total+=contrib;if(f>0&&first===null)first={t:t,f:f,n:n,id:id,tfpart:tfpart,contrib:contrib};
      rows+='<tr><td>'+t+'</td><td'+(f===0?' class="zero"':'')+'>'+f+'</td><td>'+n+'</td><td>'+id.toFixed(2)+'</td><td>'+lenFactor.toFixed(2)+'</td><td'+(f===0?' class="zero"':'')+'>'+tfpart.toFixed(2)+'</td><td'+(f===0?' class="zero"':'')+'>'+contrib.toFixed(2)+'</td></tr>';
    });
    table.innerHTML='<table class="bmt"><tr><th>term</th><th>f(t,D)</th><th>n(t)</th><th>IDF</th><th>len factor</th><th>TF part</th><th>score</th></tr>'+rows+'<tr class="total"><td colspan="6">BM25 score</td><td>'+total.toFixed(2)+'</td></tr></table>';
    if(first){
      sub.innerHTML='<span style="color:#8C8FB5">// working through &#39;'+first.t+'&#39; in '+d.id+':</span>\n'+
        'IDF  = ln( (6 − '+first.n+' + 0.5) / ('+first.n+' + 0.5) + 1 )  =  <span class="hl">'+first.id.toFixed(3)+'</span>\n'+
        'TF   = ('+first.f+' × ('+k1.toFixed(1)+'+1)) / ('+first.f+' + '+k1.toFixed(1)+' × '+lenFactor.toFixed(2)+')  =  <span class="hl">'+first.tfpart.toFixed(3)+'</span>\n'+
        'term = '+first.id.toFixed(3)+' × '+first.tfpart.toFixed(3)+'  =  <span class="hl">'+first.contrib.toFixed(3)+'</span>';
    } else {
      sub.innerHTML='<span style="color:#8C8FB5">// none of the query words appear in '+d.id+' → every term scores 0.</span>';
    }
    var zeros=terms.filter(function(t){return tf(t,d)===0;});
    if(total===0) read.innerHTML='<b>Score 0.</b> '+d.id+' shares no exact words with the query — even when it&#39;s about the same topic, BM25 only sees literal matches. (That gap is exactly what the next module fixes.)';
    else if(zeros.length) read.innerHTML='Note <b>'+zeros.join(', ')+'</b> scored 0 (not in '+d.id+'). Raise <b>k₁</b> to reward repeated terms more, or <b>b</b> to penalise long documents harder.';
    else read.innerHTML='Every term matched. Drag <b>k₁</b> (term-frequency saturation) and <b>b</b> (length normalisation) and watch the score respond — IDF stays fixed, the rest moves.';
  }
  k1s.addEventListener('input',draw);bs.addEventListener('input',draw);draw();
}

function sparseDenseWidget(){

/* M4 cosine worked example */
function cosineDemo(){
  var DV=[{id:"D1",t:"dog barking & training",v:[0.9,0.6]},{id:"D6",t:"soundproofing neighbours",v:[0.15,0.95]},{id:"D4",t:"dog food brands",v:[0.95,0.15]}];
  var QV=[{label:"noisy dog",v:[0.7,0.7]},{label:"loud apartment",v:[0.1,0.9]},{label:"puppy food",v:[0.9,0.1]}];
  var chips=document.getElementById('cs_chips'),svg=document.getElementById('cs_svg'),table=document.getElementById('cs_table'),sub=document.getElementById('cs_sub'),read=document.getElementById('cs_read');
  var qi=0;

  function dot(a,b){return a[0]*b[0]+a[1]*b[1];}
  function mag(a){return Math.sqrt(a[0]*a[0]+a[1]*a[1]);}
  function draw(){
    [].forEach.call(chips.children,function(c){c.classList.toggle('on',+c.dataset.i===qi);});
    var q=QV[qi],qm=mag(q.v);
    var scored=DV.map(function(d){var dt=dot(q.v,d.v),dm=mag(d.v);return {d:d,dt:dt,dm:dm,cos:dt/(qm*dm)};});
    var best=scored.slice().sort(function(a,b){return b.cos-a.cos;})[0];
    var ox=42,oy=170,S=120;
    function px(v){return ox+v[0]*S;}function py(v){return oy-v[1]*S;}
    var s='<defs><marker id="cah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--accent)"/></marker><marker id="cah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"/></marker><marker id="cah3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--win)"/></marker></defs>'+
      '<line x1="'+ox+'" y1="'+oy+'" x2="'+(ox+S+15)+'" y2="'+oy+'" stroke="var(--line)"/>'+
      '<line x1="'+ox+'" y1="'+oy+'" x2="'+ox+'" y2="'+(oy-S-15)+'" stroke="var(--line)"/>'+
      '<text x="'+(ox+40)+'" y="'+(oy+14)+'" style="fill:var(--muted);font-size:8px">about dogs →</text>'+
      '<text x="'+(ox-34)+'" y="'+(oy-S-3)+'" style="fill:var(--muted);font-size:8px">↑ about noise</text>';
    scored.forEach(function(o){var isb=o.d.id===best.d.id,col=isb?'var(--win)':'var(--muted)',mk=isb?'cah3':'cah2';
      s+='<line x1="'+ox+'" y1="'+oy+'" x2="'+px(o.d.v).toFixed(1)+'" y2="'+py(o.d.v).toFixed(1)+'" stroke="'+col+'" stroke-width="2" marker-end="url(#'+mk+')"/>'+
         '<text x="'+(px(o.d.v)+3).toFixed(1)+'" y="'+(py(o.d.v)-2).toFixed(1)+'" style="fill:'+col+';font-size:9px">'+o.d.id+'</text>';});
    s+='<line x1="'+ox+'" y1="'+oy+'" x2="'+px(q.v).toFixed(1)+'" y2="'+py(q.v).toFixed(1)+'" stroke="var(--accent)" stroke-width="3" marker-end="url(#cah)"/>'+
       '<text x="'+(px(q.v)+4).toFixed(1)+'" y="'+(py(q.v)+11).toFixed(1)+'" style="fill:var(--accent);font-size:9px">query</text>';
    svg.innerHTML=s;
    table.innerHTML='<table class="bmt"><tr><th>doc</th><th>vector</th><th>q · d</th><th>|d|</th><th>cosine</th></tr>'+
      scored.map(function(o){return '<tr><td>'+o.d.id+'</td><td>['+o.d.v[0]+', '+o.d.v[1]+']</td><td>'+o.dt.toFixed(2)+'</td><td>'+o.dm.toFixed(2)+'</td><td'+(o.d.id===best.d.id?' style="color:var(--win)"':'')+'>'+o.cos.toFixed(3)+'</td></tr>';}).join("")+
      '<tr class="total"><td colspan="4">|query| = '+qm.toFixed(2)+'</td><td>best: '+best.d.id+'</td></tr></table>';
    sub.innerHTML='<span style="color:#8C8FB5">// working through query vs '+best.d.id+':</span>\n'+
      'q · d = ('+q.v[0]+'×'+best.d.v[0]+') + ('+q.v[1]+'×'+best.d.v[1]+') = <span class="hl">'+best.dt.toFixed(3)+'</span>\n'+
      '|q| = √('+q.v[0]+'² + '+q.v[1]+'²) = <span class="hl">'+qm.toFixed(3)+'</span>    |d| = <span class="hl">'+best.dm.toFixed(3)+'</span>\n'+
      'cosine = '+best.dt.toFixed(3)+' / ('+qm.toFixed(3)+' × '+best.dm.toFixed(3)+') = <span class="hl">'+best.cos.toFixed(3)+'</span>';
    read.innerHTML='<b>'+best.d.id+'</b> wins — its arrow points most like the query\u2019s. The length of an arrow is irrelevant; only the <b>angle</b> counts. Real embeddings do this in hundreds of dimensions, but the maths is exactly this.';
  }
  draw();
}

/* M5 RRF */
function rrfWidget(){
  var chips=document.getElementById('rf_chips'),sp=document.getElementById('rf_sparse'),de=document.getElementById('rf_dense'),table=document.getElementById('rf_table'),sub=document.getElementById('rf_sub'),read=document.getElementById('rf_read'),ks=document.getElementById('rf_k'),kv=document.getElementById('rf_kv');
  var cur=1;buildChips(chips,function(i){cur=i;draw();});
  function listRows(arr,colour){return arr.map(function(o,r){return '<div class="doc"><div class="dt"><span class="did" style="color:'+colour+'">'+(r+1)+'.&nbsp;'+o.d.id+'</span><span style="color:var(--muted);font-size:11px">'+o.d.text+'</span></div></div>';}).join("");}
  function draw(){
    var k=+ks.value;kv.textContent=k;
    var q=QSET[cur];
    var S=rankBy(function(d){return sparseScore(q.label,d);}).filter(function(o){return o.s>0.0001;});
    var D=rankBy(function(d){return denseScore(q.concepts,d);}).filter(function(o){return o.s>0.0001;});
    sp.innerHTML=listRows(S,'var(--sparse)');de.innerHTML=listRows(D,'var(--accent)');
    var sRank={},dRank={};S.forEach(function(o,r){sRank[o.d.id]=r+1;});D.forEach(function(o,r){dRank[o.d.id]=r+1;});
    var ids={},order=[];S.concat(D).forEach(function(o){if(!ids[o.d.id]){ids[o.d.id]=o.d;order.push(o.d.id);}});
    var rows=order.map(function(id){var rs=sRank[id],rd=dRank[id],cs=rs?1/(k+rs):0,cd=rd?1/(k+rd):0;return {id:id,rs:rs,rd:rd,cs:cs,cd:cd,tot:cs+cd};}).sort(function(a,b){return b.tot-a.tot;});
    var best=rows[0];
    table.innerHTML='<table class="bmt"><tr><th>doc</th><th>sparse rank</th><th>dense rank</th><th>1/(k+r)ₛ</th><th>1/(k+r)_d</th><th>RRF</th></tr>'+
      rows.map(function(o,i){return '<tr><td>'+o.id+(i===0?' ★':'')+'</td><td>'+(o.rs||'—')+'</td><td>'+(o.rd||'—')+'</td><td'+(o.rs?'':' class="zero"')+'>'+(o.rs?o.cs.toFixed(3):'0')+'</td><td'+(o.rd?'':' class="zero"')+'>'+(o.rd?o.cd.toFixed(3):'0')+'</td><td style="color:var(--win)">'+o.tot.toFixed(3)+'</td></tr>';}).join("")+'</table>';
    sub.innerHTML='<span style="color:#8C8FB5">// RRF for '+best.id+'  (k = '+k+'):</span>\n'+

    read.innerHTML='Top of the fused list: <b>'+best.id+'</b> — often a doc that ranked respectably in <i>both</i> lists, beating one that topped only a single list. Lower <b>k</b> makes top ranks count for far more; raise it toward 60 and the gaps flatten, which is what makes RRF robust to small ranking wobbles.';

/* M7 chunking */
function chunkWidget(){
  var chips=document.getElementById('ck_chips'),doc=document.getElementById('ck_doc'),trade=document.getElementById('ck_trade');
  var text="Our refund policy changed in 2024. Enterprise customers now have 14 days to request a refund. Manager approval is required for all enterprise refunds. Separately, our support hours are 9am to 6pm on weekdays. Weekend support is email only. For urgent issues, use the priority line.";
  var sentences=text.match(/[^.]+\./g).map(function(s){return s.trim();});
  var strategies=[
    {name:"Fixed-size",cut:"fixed",note:"Cuts every ~90 characters regardless of meaning. Notice a sentence gets sliced in half — a chunk that's useless on its own."},
    {name:"Recursive",cut:"sent",note:"Splits on sentence boundaries. Clean, self-contained chunks — the sensible default for most documents."},
    {name:"Semantic",cut:"sem",note:"Cuts where the topic shifts (refunds → support hours). Each chunk is one coherent idea, even across several sentences."},
    {name:"Sentence-window",cut:"win",note:"Each sentence is its own tiny chunk for precise matching — but at answer-time you'd return its neighbours too (Module 10)."}
  ];
  var cols=['#5B5BD6','#2E8B6F','#D98A1F','#C0506A','#4A45B8','#2E8B6F'];
  function tint(i){return cols[i%cols.length];}
  function render(s){
    var html='';
    if(s.cut==='fixed'){
      var size=90,idx=0,ci=0;
      while(idx<text.length){var seg=text.slice(idx,idx+size);html+='<span class="ck" style="background:'+tint(ci)+'22;border-bottom:2px solid '+tint(ci)+'">'+seg+'</span>';idx+=size;ci++;}
    } else if(s.cut==='sent'||s.cut==='win'){
      html=sentences.map(function(se,i){return '<span class="ck" style="background:'+tint(i)+'22;border-bottom:2px solid '+tint(i)+'">'+se+' </span>';}).join("");
    } else if(s.cut==='sem'){
      var groups=[[0,1,2],[3,4,5]];
      html=groups.map(function(g,gi){return '<span class="ck" style="background:'+tint(gi)+'22;border-bottom:2px solid '+tint(gi)+'">'+g.map(function(k){return sentences[k];}).join(' ')+' </span>';}).join("");
    }
    doc.innerHTML=html;trade.innerHTML='<b>'+s.name+':</b> '+s.note;
  }
  strategies.forEach(function(s,i){var b=document.createElement('button');b.className='chip';b.textContent=s.name;b.dataset.i=i;b.onclick=function(){[].forEach.call(chips.children,function(c){c.classList.toggle('on',+c.dataset.i===i);});render(s);};chips.appendChild(b);});
  chips.children[1].classList.add('on');render(strategies[1]);
}

/* M15 semantic cache */
function semCacheWidget(){
  var CACHE=[
    {id:"C1",q:"How do I reset my password?",a:"Go to Settings → Security → Reset password. A reset link is emailed to you and expires in 30 minutes."},
    {id:"C2",q:"What are your support hours?",a:"Support runs 9am–6pm on weekdays; weekends are email-only."},
    {id:"C3",q:"How do I renew my subscription?",a:"Open Billing → Renew. Your saved card is charged and the new term starts immediately."}
  ];
  var IN=[
    {label:"How do I reset my password?",sims:[1.00,0.31,0.28],exact:true},
    {label:"password reset help",sims:[0.93,0.33,0.30]},
    {label:"I forgot my login details",sims:[0.86,0.35,0.29]},
    {label:"How do I cancel my subscription?",sims:[0.30,0.34,0.88],trap:true},
    {label:"Do you ship to Australia?",sims:[0.22,0.28,0.25]}
  ];
  var mode='exact',qi=1;
  var chips=document.getElementById('sc_chips'),store=document.getElementById('sc_store'),out=document.getElementById('sc_out'),read=document.getElementById('sc_read'),
      thr=document.getElementById('sc_thr'),thrv=document.getElementById('sc_thrv'),thrRow=document.getElementById('sc_thr_row'),
      bE=document.getElementById('sc_exact'),bS=document.getElementById('sc_sem');
  IN.forEach(function(q,i){var b=document.createElement('button');b.className='chip';b.textContent=q.label;b.dataset.i=i;b.onclick=function(){qi=i;draw();};chips.appendChild(b);});
  function draw(){
    [].forEach.call(chips.children,function(c){c.classList.toggle('on',+c.dataset.i===qi);});
    bE.classList.toggle('on',mode==='exact');bS.classList.toggle('on',mode==='sem');
    thrRow.style.opacity=mode==='sem'?1:.35;thr.disabled=(mode!=='sem');
    var T=+thr.value/100;thrv.textContent=T.toFixed(2);
    var q=IN[qi],best=0;q.sims.forEach(function(s,i){if(s>q.sims[best])best=i;});
    var hit,hitIdx=-1;
    if(mode==='exact'){hit=!!q.exact;if(hit)hitIdx=0;}
    else{hit=q.sims[best]>=T;if(hit)hitIdx=best;}
    var falseHit=hit&&q.trap;
    store.innerHTML=CACHE.map(function(c,i){
      var s=q.sims[i],isHit=(i===hitIdx);
      var col=isHit?(falseHit?'var(--danger)':'var(--sparse)'):'var(--accent)';
      var badge=isHit?(falseHit?'<span class="badge bad">false hit!</span>':'<span class="badge up">cache hit</span>'):'';
      var simLabel=mode==='sem'?('cos '+s.toFixed(2)):(q.exact&&i===0?'identical string':'string differs');
      return '<div class="doc"><div class="dt"><span class="did" style="color:'+col+'">'+c.id+'</span><span style="color:var(--muted)">"'+c.q+'" · <i>'+simLabel+'</i></span>'+badge+'</div>'+
        (mode==='sem'?'<div class="dtrack"><div class="dfill" style="background:'+col+';width:'+(s*100)+'%"></div></div>':'')+'</div>';
    }).join("");
    if(hit){
      out.innerHTML='<span class="hl">CACHE HIT · ~15 ms · ≈ $0</span>\nServed: "'+CACHE[hitIdx].a+'"';
    } else {
      out.innerHTML='<span class="hl2">CACHE MISS · full pipeline runs (~2.5 s, ≈ $0.01)</span>\nAnswer generated fresh — then stored, so the next paraphrase of this question hits.';
    }
    if(mode==='exact'){
      read.innerHTML = q.exact ? 'A verbatim repeat — the string hashes to the same key, instant hit. This is the <b>only</b> case exact matching ever catches.' :
        'Same intent as a cached question, but the <b>string differs</b>, so the hash differs, so it misses. Every rewording is a full-price pipeline run — this is the gap semantic caching closes.';
    } else if(falseHit){
      read.innerHTML='<b style="color:var(--danger)">False hit.</b> The user asked to <b>cancel</b> and was served <b>renewal</b> instructions — 0.88 similar in wording, opposite in intent. Raise the threshold above 0.88 and this becomes a correct miss. This is why you start high and tune down carefully.';
    } else if(hit){
      read.innerHTML='Paraphrase caught: cosine '+q.sims[best].toFixed(2)+' ≥ threshold '+T.toFixed(2)+', so the cached answer for <b>'+CACHE[best].id+'</b> is served — same meaning, different words, no pipeline cost.';
    } else if(q.trap){
      read.innerHTML='Correctly rejected: 0.88 is <i>close</i>, but below your '+T.toFixed(2)+' threshold. Good — the wording is nearly identical to the renew question, yet the intent is opposite. A miss here is the right outcome.';
    } else if(q.sims[best]>=0.8){
      read.innerHTML='Missed at threshold '+T.toFixed(2)+' — but cosine '+q.sims[best].toFixed(2)+' says this is almost certainly the same intent as <b>'+CACHE[best].id+'</b>. Lower the threshold slightly and this paraphrase starts hitting.';
    } else {
      read.innerHTML='A genuinely new question — nothing cached is close (best cosine '+q.sims[best].toFixed(2)+'). The pipeline runs and the answer joins the cache.';
    }
  }
  bE.onclick=function(){mode='exact';draw();};
  bS.onclick=function(){mode='sem';draw();};
  thr.addEventListener('input',draw);
  draw();
}

        'Bob   → HIT  → served: "Your plan renews on <span class="hl">3 August</span>."  <span style="color:#E69">← Alice\\u2019s date!</span>';
      read.innerHTML='<b style="color:var(--danger)">Bob just received Alice\\u2019s account details.</b> Identical string, different correct answers — the query alone was never a valid key. This is a privacy incident, not a caching quirk.';
    } else {
      out.innerHTML='<span class="hl">key: hash("when does my subscription renew" + user_id)</span>\n'+
        'Alice → MISS → pipeline → "renews <span class="hl">3 August</span>" → cached under alice\n'+
        'Bob   → MISS → pipeline → "renews <span class="hl">19 September</span>" → cached under bob';
      read.innerHTML='Scoped keys: each user\\u2019s answer is cached in their own lane. Bob\\u2019s first ask is a miss — that is the correct price of isolation. Repeat asks per user still hit. Same idea applies per-tenant and per-permission-level.';
    }
  }
  bN.onclick=function(){show('naive');};bS.onclick=function(){show('scoped');};
  show('naive');
}

/* M16 scale widgets */
function ivfWidget(){
  var CENT=[[80,70],[285,65],[85,190],[290,190]];
  var COLS=['var(--accent)','var(--sparse)','var(--win)','var(--danger)'];
  var OFF=[[-18,-8],[12,-15],[20,6],[-6,14],[4,22],[-22,10],[15,20],[-12,-20],[25,-5]];
  var PTS=[];
  CENT.forEach(function(c,ci){OFF.forEach(function(o){PTS.push({x:c[0]+o[0],y:c[1]+o[1],c:ci});});});
  PTS.push({x:CENT[0][0]+55,y:CENT[0][1]+35,c:0}); // outlier reaching toward the middle
  var QPOS=[{label:"deep in a cluster",x:280,y:70},{label:"on a boundary",x:185,y:120}];
  var mode='brute',qi=0;
  var svg=document.getElementById('iv_svg'),read=document.getElementById('iv_read'),chips=document.getElementById('iv_chips'),
      np=document.getElementById('iv_np'),npv=document.getElementById('iv_npv'),npRow=document.getElementById('iv_np_row'),
      bB=document.getElementById('iv_brute'),bI=document.getElementById('iv_ivf');
  QPOS.forEach(function(q,i){var b=document.createElement('button');b.className='chip';b.textContent=q.label;b.dataset.i=i;b.onclick=function(){qi=i;draw();};chips.appendChild(b);});
  function d2(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}
  function draw(){
    [].forEach.call(chips.children,function(c){c.classList.toggle('on',+c.dataset.i===qi);});
    bB.classList.toggle('on',mode==='brute');bI.classList.toggle('on',mode==='ivf');
    npRow.style.opacity=mode==='ivf'?1:.35;np.disabled=(mode!=='ivf');
    var P=+np.value;npv.textContent=P;
    var q=QPOS[qi];
    var order=CENT.map(function(c,i){return {i:i,d:d2(q.x,q.y,c[0],c[1])};}).sort(function(a,b){return a.d-b.d;});
    var probed={};if(mode==='brute'){CENT.forEach(function(_,i){probed[i]=1;});}else{order.slice(0,P).forEach(function(o){probed[o.i]=1;});}
    var trueBest=0;PTS.forEach(function(p,i){if(d2(q.x,q.y,p.x,p.y)<d2(q.x,q.y,PTS[trueBest].x,PTS[trueBest].y))trueBest=i;});
    var checked=[],best=-1;
    PTS.forEach(function(p,i){if(probed[p.c]){checked.push(i);if(best<0||d2(q.x,q.y,p.x,p.y)<d2(q.x,q.y,PTS[best].x,PTS[best].y))best=i;}});
    var found=(best===trueBest);
    var s='';
    PTS.forEach(function(p,i){
      var on=!!probed[p.c];
      s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="'+COLS[p.c]+'" opacity="'+(on?0.95:0.22)+'"/>';
    });
    CENT.forEach(function(c,i){
      s+='<rect x="'+(c[0]-5)+'" y="'+(c[1]-5)+'" width="10" height="10" transform="rotate(45 '+c[0]+' '+c[1]+')" fill="#fff" stroke="'+COLS[i]+'" stroke-width="2"'+(probed[i]?'':' opacity="0.3"')+'/>';
      if(probed[i]&&mode==='ivf')s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="12" fill="none" stroke="'+COLS[i]+'" stroke-dasharray="3 3" opacity="0.6"/>';
    });
    if(best>=0)s+='<line x1="'+q.x+'" y1="'+q.y+'" x2="'+PTS[best].x+'" y2="'+PTS[best].y+'" stroke="var(--ink)" stroke-width="1.4"/>';
    if(!found){s+='<line x1="'+q.x+'" y1="'+q.y+'" x2="'+PTS[trueBest].x+'" y2="'+PTS[trueBest].y+'" stroke="var(--danger)" stroke-width="1.2" stroke-dasharray="4 3"/>';
      s+='<circle cx="'+PTS[trueBest].x+'" cy="'+PTS[trueBest].y+'" r="8" fill="none" stroke="var(--danger)" stroke-width="2" stroke-dasharray="3 2"/>';
      s+='<text x="'+(PTS[trueBest].x+11)+'" y="'+(PTS[trueBest].y+3)+'" style="fill:var(--danger)">true NN — missed</text>';}
    else if(best>=0){s+='<circle cx="'+PTS[best].x+'" cy="'+PTS[best].y+'" r="8" fill="none" stroke="var(--sparse)" stroke-width="2.2"/>';}
    s+='<circle cx="'+q.x+'" cy="'+q.y+'" r="6" fill="var(--ink)"/><circle cx="'+q.x+'" cy="'+q.y+'" r="2.4" fill="#fff"/><text x="'+(q.x+10)+'" y="'+(q.y-8)+'">query</text>';
    svg.innerHTML=s;
    var pct=Math.round(checked.length/PTS.length*100);
    if(mode==='brute')read.innerHTML='Brute force: checked <b>all '+PTS.length+' vectors</b> — guaranteed to find the true nearest neighbour, and hopeless at 100M vectors.';
    else if(found)read.innerHTML='IVF: compared 4 centroids, then checked <b>'+checked.length+' of '+PTS.length+' vectors ('+pct+'%)</b> in '+P+' cell'+(P>1?'s':'')+' — and found the true nearest neighbour. This is the entire speed win.';
    else read.innerHTML='IVF: checked only <b>'+checked.length+' of '+PTS.length+'</b> — but the true nearest neighbour sits just across a cell boundary, in a cell you never probed. <b>Missed.</b> Raise nProbe to 2 and watch it get caught. That miss is the "approximate" in ANN.';
  }
  bB.onclick=function(){mode='brute';draw();};
  bI.onclick=function(){mode='ivf';draw();};
  np.addEventListener('input',draw);
  draw();
}

function scaleWidget(){
  var ch=document.getElementById('sw_ch'),chv=document.getElementById('sw_chv'),nodes=document.getElementById('sw_nodes'),read=document.getElementById('sw_read'),
      bF=document.getElementById('sw_fp'),bP=document.getElementById('sw_pq');
  var mode='fp';
  function draw(){
    bF.classList.toggle('on',mode==='fp');bP.classList.toggle('on',mode==='pq');
    var M=+ch.value;chv.textContent=M+'M';
    var bytes=mode==='fp'?6144:128;
    var GB=M*1e6*bytes/1e9;
    var N=Math.max(1,Math.ceil(GB/48));
    var show=Math.min(N,60),html='';
    for(var i=0;i<show;i++)html+='<span class="node'+(mode==='pq'?' pq':'')+'"></span>';
    html+='<span class="nlabel">× '+N+' node'+(N>1?'s':'')+'</span>';
    nodes.innerHTML=html;
    var calc=M+'M × '+(mode==='fp'?'6,144 B (1,536 floats × 4 B)':'128 B (PQ codes)')+' ≈ <b>'+(GB>=1000?(GB/1000).toFixed(1)+' TB':Math.round(GB)+' GB')+'</b> → <b>'+N+' node'+(N>1?'s':'')+'</b> at ~48 GB usable each.';
    read.innerHTML=calc+' '+(mode==='fp'?'Raw floats are why the index outgrows machines so fast.':'Same corpus, ~48× smaller — PQ often turns a cluster back into a single box, for a small recall cost.');
  }
  bF.onclick=function(){mode='fp';draw();};
  bP.onclick=function(){mode='pq';draw();};
  ch.addEventListener('input',draw);
  draw();
}

function shardWidget(){
  var SH=[[0,1],[2,3],[4,5]];
  var CONC=["dog","noise"];
  var host=document.getElementById('sw_shards'),merged=document.getElementById('sw_merged'),read=document.getElementById('sw_sread');
  var scored=DOCS.map(function(d){return {d:d,s:denseScore(CONC,d)};});
  var gmax=Math.max.apply(null,scored.map(function(o){return o.s;}))||1;
  function docHTML(o,colour,badge){
    return '<div class="doc'+(o.s<=0.0001?' zero':'')+'"><div class="dt"><span class="did" style="color:'+colour+'">'+o.d.id+'</span><span style="color:var(--muted)">'+o.d.text+'</span>'+(badge||'')+'</div><div class="dtrack"><div class="dfill" style="background:'+colour+';width:'+Math.max(2,o.s/gmax*100)+'%"></div></div></div>';
  }
  function base(){
    host.innerHTML=SH.map(function(sh,i){return '<div class="rcol" id="swsh'+i+'" style="opacity:.4;transition:opacity .3s"><div class="rhead"><span class="pip" style="background:var(--accent)"></span> Shard '+(i+1)+'</div><p class="rsub">holds '+sh.map(function(k){return DOCS[k].id;}).join(', ')+'</p><div class="shbody"></div></div>';}).join("");
    merged.innerHTML='<p style="font-size:13px;color:var(--muted);padding:12px 0;text-align:center">Run the query →</p>';
    read.innerHTML='';
  }
  var timers=[];
  function run(){
    base();timers.forEach(clearTimeout);timers=[];
    SH.forEach(function(sh,i){
      timers.push(setTimeout(function(){
        var col=document.getElementById('swsh'+i);col.style.opacity=1;
        col.querySelector('.shbody').innerHTML=sh.map(function(k){return docHTML(scored[k],'var(--accent)');}).join("");
      },400+i*600));
    });
    timers.push(setTimeout(function(){
      var all=scored.slice().sort(function(a,b){return b.s-a.s;}).slice(0,3);
      merged.innerHTML=all.map(function(o){
        var si=SH.findIndex(function(sh){return sh.indexOf(DOCS.indexOf(o.d))>=0;});
        return docHTML(o,'var(--win)','<span class="badge up">from shard '+(si+1)+'</span>');
      }).join("");
      read.innerHTML='Each shard searched only its own slice in parallel; the coordinator merged three local top-2 lists into the global top-3. <b>No single machine ever saw the whole index</b> — same scatter-gather as Kafka partitions or Elasticsearch shards.';
    },400+SH.length*600+300));
  }
  document.getElementById('sw_run').onclick=run;
  document.getElementById('sw_reset').onclick=function(){timers.forEach(clearTimeout);base();};
  base();
}

/* M17 multimodal */
function multimodalWidget(){
  var list=document.getElementById('mm_list'),read=document.getElementById('mm_read');
  var items=[
    {id:"T1",kind:"📄 text",t:"Guide: stopping a dog barking in the yard",txt:true,score:0.88},
    {id:"I1",kind:"🖼️ image",t:"Photo: dog barking in a garden",txt:false,score:0.96},
    {id:"B1",kind:"📊 table",t:"Table: noise complaints by area",txt:false,score:0.42},
    {id:"T2",kind:"📄 text",t:"Article: apartment soundproofing tips",txt:true,score:0.34}
  ];
  function show(mode){
    document.getElementById('mm_text').classList.toggle('on',mode==='text');
    document.getElementById('mm_multi').classList.toggle('on',mode==='multi');
    var searchable=items.filter(function(it){return mode==='multi'||it.txt;});
    var ranked=searchable.slice().sort(function(a,b){return b.score-a.score;});
    list.innerHTML=items.map(function(it){
      var rank=ranked.indexOf(it),on=rank>=0;
      return '<div class="doc" style="opacity:'+(on?1:.32)+'"><div class="dt"><span class="did" style="color:'+(on?'var(--accent)':'var(--muted)')+'">'+it.id+'</span><span style="color:var(--muted)">'+it.kind+' · '+it.t+'</span>'+(!on?'<span class="badge bad">not indexed</span>':(rank===0?'<span class="badge up">top result</span>':''))+'</div>'+(on?'<div class="dtrack"><div class="dfill" style="background:var(--accent);width:'+(it.score*100)+'%"></div></div>':'')+'</div>';
    }).join("");
    read.innerHTML = mode==='text' ? 'Text-only: the images and tables are <b>invisible</b> to search. The best answer here — a <i>photo</i> of exactly this — can never be retrieved.' :
      'Multimodal: the image and table are embedded into the same space, so the text query retrieves the <b>photo (I1)</b> as the top result. The most relevant knowledge was visual all along.';
  }
  document.getElementById('mm_text').onclick=function(){show('text');};
  document.getElementById('mm_multi').onclick=function(){show('multi');};
  show('text');
}

/* M16 long-context vs RAG */
function longContextWidget(){
  var size=document.getElementById('lc_size'),sv=document.getElementById('lc_sizev'),stuff=document.getElementById('lc_stuff'),rag=document.getElementById('lc_rag'),read=document.getElementById('lc_read');
  function bars(host,vals,colour){
    var names=["cost","latency","answer quality"];
    host.innerHTML=names.map(function(n,i){return '<div class="metric" style="grid-template-columns:96px 1fr 36px"><span class="ml">'+n+'</span><div class="mtrack"><div class="mfill" style="background:'+colour+'"></div></div><span class="mv">'+Math.round(vals[i]*100)+'</span></div>';}).join("");
    requestAnimationFrame(function(){[].forEach.call(host.querySelectorAll('.mfill'),function(f,i){f.style.width=Math.min(100,vals[i]*100)+'%';});});
  }
  function draw(){
    var s=+size.value;sv.textContent=s+(s<8?' · small':s>60?' · huge':' · large');
    var sc=Math.min(1,s/40),sl=Math.min(1,s/45),sq=s<25?0.95:Math.max(0.25,0.95-(s-25)/90);
    var rc=0.18,rl=0.25,rq=0.88;
    bars(stuff,[sc,sl,sq],'var(--danger)');bars(rag,[rc,rl,rq],'var(--sparse)');
    read.innerHTML = s<15 ? 'Small corpus: stuffing everything is simple and works fine — RAG\u2019s extra machinery isn\u2019t earning its keep yet.' :
      s>55 ? 'Large corpus: stuffing is now expensive, slow, and losing facts in the middle. RAG stays cheap and precise — and a real corpus wouldn\u2019t even fit.' :
      'Crossover zone: stuffing\u2019s cost and latency are climbing and quality is starting to slip, while RAG holds steady. This is where most production systems switch.';
  }
  size.addEventListener('input',draw);draw();
}

var DONE=loadDone();
