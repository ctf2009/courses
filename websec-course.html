<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --panel:#FFFFFF; --ink:#1B1F2C; --ink-soft:#5A6172;
  --line:#E3E6EF; --indigo:#4F46E5; --indigo-soft:#EEF0FE;
  --amber:#B45309; --amber-soft:#FEF3E2;
  --teal:#0D9488; --teal-soft:#E6F7F5;
  --ok:#059669; --ok-soft:#E8F7F0; --no:#DC2626; --no-soft:#FDECEC;
  --radius:10px;
  --disp:"Space Grotesk",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
a{color:var(--indigo)}
header.top{position:sticky;top:0;z-index:40;background:rgba(246,247,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.2px}
.brand .tag{color:var(--indigo)}
.progress-pill{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--panel)}
nav.mods{max-width:1100px;margin:0 auto;padding:0 12px 10px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.mods button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:var(--mono);font-size:12px;padding:7px 12px;border-radius:99px;cursor:pointer;transition:all .15s}
nav.mods button.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
nav.mods button.done::after{content:" ✓";color:var(--ok)}
nav.mods button.active.done::after{color:#C7F5DF}
nav.mods button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
main{max-width:840px;margin:0 auto;padding:28px 18px 90px}
.mod-head{margin-bottom:26px}
.mod-code{font-family:var(--mono);font-size:12px;color:var(--indigo);letter-spacing:1px}
h1.mod-title{font-family:var(--disp);font-size:clamp(26px,5vw,36px);font-weight:700;line-height:1.15;margin:6px 0 4px}
.mod-sub{color:var(--ink-soft);font-size:15px}
.md h2{font-family:var(--disp);font-size:22px;margin:34px 0 10px;padding-top:10px;border-top:1px solid var(--line)}
.md h3{font-family:var(--disp);font-size:17px;margin:24px 0 8px}
.md p{margin:0 0 14px}
.md ul,.md ol{margin:0 0 14px 22px}
.md li{margin-bottom:6px}
.md code{font-family:var(--mono);font-size:.86em;background:var(--indigo-soft);border-radius:4px;padding:1px 5px}
.md pre{background:#14172A;color:#E6E8F5;border-radius:var(--radius);padding:16px;overflow-x:auto;margin:0 0 16px;font-size:13px;line-height:1.55}
.md pre code{background:none;color:inherit;padding:0;font-size:inherit}
.md table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.md th{background:var(--indigo-soft);font-family:var(--disp);font-size:13px}
.md blockquote{border-left:3px solid var(--teal);background:var(--teal-soft);padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;margin:0 0 16px;font-size:15px}
.md blockquote p:last-child{margin:0}
.callout{border:1px solid var(--line);border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:var(--radius);padding:12px 16px;margin:0 0 16px;font-size:15px}
/* wire view */
.wire{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin:0 0 18px;overflow:hidden}
.wire-head{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.wire-dir{font-weight:600}
.wire-dir.req{color:var(--indigo)} .wire-dir.res{color:var(--teal)}
.wire pre{margin:0;padding:14px;background:#14172A;color:#E6E8F5;font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow-x:auto}
.wire pre .hl-cookie{color:#FBBF24}
.wire pre .hl-dim{color:#8A90AD}
.verdict{display:flex;align-items:center;gap:10px;padding:10px 14px;font-family:var(--disp);font-weight:500;font-size:14px;border-top:1px solid var(--line)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--no-soft);color:var(--no)}
.verdict .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.verdict.ok .dot{background:var(--ok)} .verdict.no .dot{background:var(--no)}
/* widgets */
.widget{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:18px;margin:0 0 20px}
.widget h4{font-family:var(--disp);font-size:15px;margin:0 0 4px}
.widget .hint{font-size:13px;color:var(--ink-soft);margin:0 0 14px}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.opt-label{width:100%;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-soft);text-transform:uppercase}
.opt-row button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:12.5px;cursor:pointer;color:var(--ink);transition:all .12s}
.opt-row button.sel{background:var(--indigo);border-color:var(--indigo);color:#fff}
.opt-row button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.anatomy{font-family:var(--mono);font-size:13px;line-height:2.1;background:#14172A;color:#E6E8F5;border-radius:var(--radius);padding:16px;margin-bottom:12px;overflow-x:auto;white-space:nowrap}
.anatomy span[data-part]{border-bottom:2px dotted #6D74F8;cursor:pointer;border-radius:3px;padding:2px 1px}
.anatomy span[data-part].active{background:#2A2F55}
.anatomy-note{min-height:52px;border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--ink-soft)}
.anatomy-note strong{color:var(--ink)}
/* quiz */
.quiz{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin:34px 0 0;padding:20px}
.quiz h2{font-family:var(--disp);font-size:20px;margin:0 0 4px}
.quiz .qmeta{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:16px}
.q{margin-bottom:22px}
.q-text{font-weight:600;margin-bottom:10px}
.q .choices{display:flex;flex-direction:column;gap:8px}
.q .choices button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-family:var(--body);font-size:14.5px;cursor:pointer;color:var(--ink);transition:all .12s}
.q .choices button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.q .choices button.picked-ok{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);font-weight:600}
.q .choices button.picked-no{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.q .choices button.reveal-ok{border-color:var(--amber)}
.q .why{margin-top:8px;font-size:13.5px;color:var(--ink-soft);border-left:3px solid var(--line);padding-left:10px;display:none}
.q.answered .why{display:block}
.quiz-score{font-family:var(--disp);font-weight:600;margin-top:8px;display:none}
.mod-footer{display:flex;justify-content:space-between;gap:10px;margin-top:40px}
.mod-footer button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 16px;font-family:var(--disp);font-weight:500;font-size:14px;cursor:pointer}
.mod-footer button.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.mod-footer button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.placeholder-note{border:1px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--ink-soft);font-size:15px}
.sim-result{margin-top:4px}
@media(max-width:640px){ main{padding:20px 14px 70px} .widget{padding:14px} }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">

<!-- MODULE 00 — OVERVIEW -->
<!-- ============================================================= -->
<script type="text/markdown" id="md-00-a">
## What this course covers

Almost every web security mechanism exists to answer one question: **when a request arrives at your server, what should the browser have attached to it — and should you trust it?**

Cookies, CORS, CSRF tokens, SameSite, JWTs, Bearer headers — they are all rules about *what crosses the wire and when*. So this course works at the wire level. Every concept is shown as an actual HTTP exchange, and every simulator ends with the same verdict strip: **did the credential ship, yes or no?**

### The modules

| # | Module | Why it's here |
|---|--------|---------------|
| 01 | Same-Origin Policy | The default rule everything else modifies |
| 02 | Cookies | Every attribute: `Secure`, `HttpOnly`, `SameSite`, `Domain`, `Path`, prefixes |
| 03 | CORS | How servers *relax* SOP — and why CORS is not a CSRF defence |
| 04 | XSS | Why `HttpOnly` exists, and the case against tokens in `localStorage` |
| 05 | CSRF | The attack step-by-step, then mitigations in layers |
| 06 | Sessions vs JWTs | Anatomy, statelessness, why "logout" is suddenly hard |
| 07 | JWT invalidation | Short-lived access tokens, refresh token in an httpOnly cookie, rotation |
| 08 | Dual auth | One API accepting browser cookies *and* app Bearer tokens; the BFF pattern |
| 09 | Hardening | CSP, clickjacking, and the security header checklist |

### How to use it

Each module: plain-English explanation → wire view of the real HTTP → interactive simulator → Java/Spring code you could ship → quick-check quiz. Progress is saved in your browser (localStorage), so you can close the tab and pick up where you left off.

> **Site vs origin — learn this pair early.** An **origin** is scheme + host + port (`https://app.bank.com:443`). A **site** is the registrable domain (`bank.com`). CORS thinks in *origins*. Cookies and SameSite think in *sites*. Half the confusion in this field is people using one word while the browser is using the other.
</script>

<!-- ============================================================= -->
<!-- MODULE 01 — SAME-ORIGIN POLICY -->
<!-- ============================================================= -->
<script type="text/markdown" id="md-01-a">
## The default rule of the web

The Same-Origin Policy (SOP) is the browser's built-in isolation model. It answers: **can JavaScript running on page A read data belonging to site B?** Default answer: **no**.

An **origin** is the exact triple:

```
scheme :// host : port
https  :// app.bank.com : 443
```

Change *any* of the three and you have a different origin. Two pages share an origin only when all three match exactly.

### What SOP blocks — and what it deliberately allows

This is the part people get wrong. SOP does **not** stop your browser from *sending* cross-origin requests. It stops scripts from *reading the responses*.

| Action from `evil.example` targeting `bank.com` | Allowed? |
|---|---|
| `<img src="https://bank.com/logo.png">` — embed an image | ✅ Sends request, renders image |
| `<form action="https://bank.com/transfer" method="POST">` — submit a form | ✅ Sends request (this gap is CSRF, module 05) |
| `<script src="https://bank.com/app.js">` — load a script | ✅ Sends and executes |
| Top-level navigation (link click) | ✅ |
| `fetch("https://bank.com/api/balance")` then **read the JSON** | ❌ Blocked — unless CORS allows it (module 03) |
| Read `bank.com` cookies or DOM from a script on `evil.example` | ❌ Blocked |

> The mental model: SOP is a **read barrier**, not a **send barrier**. Requests fly across origins all day — that's how the web works. What's guarded is the *response data* and the other site's *state*.

### Why the next eight modules exist

- **CORS** (03) is the server-controlled mechanism for *relaxing* the read barrier.
- **CSRF** (05) is what happens because SOP was never a send barrier: the browser happily attaches `bank.com` cookies to a form submitted *from* `evil.example`.
- **SameSite cookies** (02) are the modern patch for exactly that gap.

Try the comparator below — the port and scheme cases catch nearly everyone once.
</script>

<script type="text/markdown" id="md-01-b">
## Origin vs site — the distinction that pays rent

The browser uses a *second* boundary for cookies: the **site**, meaning the registrable domain (technically eTLD+1).

```
https://app.bank.com   and   https://api.bank.com
→ different ORIGINS  (host differs)
→ same SITE          (both are bank.com)
```

Why you care, concretely: a `SameSite=Strict` cookie set by `api.bank.com` **is** sent on requests from `app.bank.com` — they're the same *site*, so it isn't "cross-site" at all. Meanwhile CORS on `api.bank.com` will still block `app.bank.com` from reading responses, because they're different *origins*. Same pair of hosts, two different verdicts, two different rulebooks.

Keep the pair on a sticky note:

| Mechanism | Boundary it uses |
|---|---|
| SOP, CORS, `postMessage` | **Origin** (scheme + host + port) |
| Cookies, `SameSite` | **Site** (registrable domain; scheme counts too — "schemeful same-site") |
</script>

<!-- ============================================================= -->
<!-- MODULE 02 — COOKIES -->
<!-- ============================================================= -->
<script type="text/markdown" id="md-02-a">
## The round trip

A cookie is a small piece of state the **server asks the browser to store and replay**. Two headers, one contract:

1. Server responds with `Set-Cookie` → browser stores it.
2. Browser attaches `Cookie` on every *matching* future request — automatically, with no JavaScript involved.

That word **automatically** is the whole story of this course. It's why cookies are convenient (the browser does auth for you) and why CSRF exists (the browser does auth for *anyone who can make your browser send a request*).
</script>

<script type="text/markdown" id="md-02-b">
## Types of cookies

**Session vs persistent** — decided by one thing: does the cookie have an expiry?

- **Session cookie**: no `Expires`/`Max-Age`. Lives until the browser closes (in theory — browsers with "restore tabs" often resurrect them). Right choice for login sessions.
- **Persistent cookie**: has `Max-Age=86400` or `Expires=<date>`. Survives restarts. Right choice for "remember this device", consent flags, refresh tokens with a deliberate lifetime.

**First-party vs third-party** — decided by *context*, not by the cookie itself:

- **First-party**: the cookie's site matches the site in the address bar. You're on `bank.com`, a `bank.com` cookie is sent → first-party use.
- **Third-party**: you're on `news.example`, which embeds a widget from `tracker.example` — cookies sent to `tracker.example` are third-party in that context. This is the mechanism behind cross-site tracking, and it's why browsers now restrict or phase out third-party cookies by default.

The same cookie can be first-party in one tab and third-party in another. It's a role, not a property.
</script>

<script type="text/markdown" id="md-02-c">
## The attributes, one honest sentence each

```
Set-Cookie: SESSION=abc123; Secure; HttpOnly; SameSite=Lax; Path=/; Max-Age=28800
```

| Attribute | What it actually does |
|---|---|
| `Secure` | Cookie is only ever sent over HTTPS. Non-negotiable for anything sensitive. |
| `HttpOnly` | JavaScript cannot read it via `document.cookie`. Your XSS blast-radius reducer (module 04). |
| `SameSite` | Controls whether the cookie ships on **cross-site** requests. The CSRF lever — full treatment below. |
| `Domain` | *Widens* the cookie to a parent domain and all subdomains (`Domain=bank.com` → sent to `app.`, `api.`, everything). Omit it and the cookie is host-only: exact host, no subdomains. Counter-intuitive: setting `Domain` makes scope *bigger*, never smaller. |
| `Path` | Only send under this URL path. A tidiness tool, **not** a security boundary — same-origin pages can reach across paths. |
| `Max-Age` / `Expires` | Lifetime. Present → persistent; absent → session cookie. |

### Cookie name prefixes — the contract in the name

- `__Host-SESSION=...` — the browser **refuses to store it** unless it has `Secure`, `Path=/`, and **no `Domain`** attribute. Result: locked to exactly one host, can't be planted by a sibling subdomain. Use this for session cookies. Always.
- `__Secure-ID=...` — weaker sibling: just requires `Secure`.

Why prefixes exist: a compromised or hostile subdomain (`blog.bank.com`) can otherwise set a `Domain=bank.com` cookie and have it sent to `app.bank.com` — *cookie tossing*, used for session fixation. The `__Host-` prefix makes that impossible by construction.

### SameSite in depth

Three values, and the differences only show up on **cross-site** requests (different registrable domain — remember module 01):

- **`Strict`** — never sent cross-site. Not even when the user *clicks a link* to your site: the first request after arriving from an email link or Google has **no cookie**, so the user looks logged out. Great for a separate high-security cookie (approving payments), hostile to normal UX as the main session.
- **`Lax`** (the default in modern browsers if unspecified) — sent on **top-level navigations with safe methods** (clicking a link → GET). Not sent on cross-site POSTs, images, iframes, or `fetch`. This one default quietly killed the classic auto-submitting-form CSRF.
- **`None`** — sent everywhere, like the pre-2020 web. **Must** be paired with `Secure` or browsers reject it. Legitimate uses: cross-site SSO redirects, embedded widgets. Every `SameSite=None` cookie is a written invitation to re-check your CSRF story (module 05).

> Wrinkle worth knowing: Chrome's "Lax-allowing-unsafe" grace applies Lax-by-default cookies to top-level cross-site **POSTs** for 2 minutes after creation — a compatibility patch for SSO flows, not something to design around. Set `SameSite` explicitly and the wrinkle disappears.

Now drive the simulator. Pick attributes, pick a scenario, and check the verdict strip before tapping — the goal is to stop being surprised.
</script>

<script type="text/markdown" id="md-02-d">
## Setting cookies safely in Spring

`ResponseCookie` is the modern builder — it supports `SameSite`, which the old `javax.servlet.http.Cookie` never learned.

```java
// Issuing the session cookie after login
ResponseCookie session = ResponseCookie.from("__Host-SESSION", sessionId)
    .httpOnly(true)          // JS cannot read it
    .secure(true)            // HTTPS only (required by __Host-)
    .sameSite("Lax")         // link-clicks work; cross-site POSTs don't carry it
    .path("/")               // required by __Host-
    // no .domain(...)       // required by __Host- : host-locked
    .maxAge(Duration.ofHours(8))
    .build();

response.addHeader(HttpHeaders.SET_COOKIE, session.toString());
```

```java
// Clearing it on logout: same name/path, Max-Age=0
ResponseCookie clear = ResponseCookie.from("__Host-SESSION", "")
    .httpOnly(true).secure(true).sameSite("Lax").path("/")
    .maxAge(Duration.ZERO)
    .build();
response.addHeader(HttpHeaders.SET_COOKIE, clear.toString());
```

Two production notes:

- **Deletion must match name + path + domain scope** or the browser treats it as a different cookie and keeps the original. Symptom: "logout doesn't work" bugs.
- The cookie **value** should be an opaque random ID (or, later, a refresh token — module 07). Never structured data you trust; the client can edit anything it stores.

We'll reuse this exact `__Host-` + `HttpOnly` + `Lax` recipe as the foundation for the refresh-token pattern in module 07 — the recipe doesn't change, only what the value points to.
</script>

<!-- MODULE 03 — CORS -->
<script type="text/markdown" id="md-03-a">
## Relaxing the read barrier

Module 01 established: SOP lets cross-origin requests *go*, but blocks scripts from *reading* the responses. CORS is the mechanism by which a **server volunteers to relax that** for specific origins.

The protocol is refreshingly simple:

1. The browser stamps every cross-origin request with an `Origin` header — the attacker can't remove or fake it from a page.
2. The server answers with `Access-Control-Allow-Origin` (and friends) saying who may read.
3. **The browser** compares and decides. The server never blocks anything; it just declares policy. Enforcement lives entirely in the browser.

### Simple vs preflighted

Requests the browser *could already send before CORS existed* (form posts, image loads) are **simple** — they go straight out, and only the *read* is gated. Anything the old web couldn't do — `PUT`, `DELETE`, `Content-Type: application/json`, an `Authorization` header — triggers a **preflight**: the browser first sends an `OPTIONS` request asking permission, and only sends the real request if the server approves.

A request is simple when **all** of these hold:

- Method is `GET`, `HEAD`, or `POST`
- Content-Type (if any) is `application/x-www-form-urlencoded`, `multipart/form-data`, or `text/plain`
- No custom headers

That JSON detail surprises people: `POST` with `application/json` is **not** simple. Your everyday SPA-to-API call is preflighted (the browser caches the approval per `Access-Control-Max-Age`, so it's one extra round trip, not one per call).

### Credentials mode

By default, cross-origin `fetch()` sends **no cookies**. Opting in with `credentials: "include"` raises the bar on the server's answer: `Access-Control-Allow-Origin` must be the **exact origin** (wildcard `*` is rejected) *and* the response must carry `Access-Control-Allow-Credentials: true`. The browser refuses to expose credentialed responses to a wildcard — otherwise any site could read any user's data anywhere that lazily set `*`.

Drive the exchange below — pay attention to which cases still *send* the request even when the read is blocked.
</script>

<script type="text/markdown" id="md-03-b">
## What CORS is not

Two misconceptions cause real vulnerabilities:

**CORS does not protect your server.** `curl`, Postman, and any backend ignore it entirely — it's browser-enforced. CORS protects *your users' data* from being read by scripts on other origins, riding the user's own browser and cookies. If your API is "secured by CORS", it is secured by nothing.

**CORS is not a CSRF defence.** Watch the simulator: with a missing `Access-Control-Allow-Origin`, a simple `POST` is still **sent and executed server-side** — only the response read fails. A CSRF attacker doesn't want the response; the damage is the request. Worse, misconfigured CORS (reflecting any `Origin` back with credentials allowed) actively *creates* a read primitive attackers otherwise lacked.

> One honest sentence to keep: **CORS decides who may read; CSRF defences decide who may write.** Modules 05 and 08 build on exactly this split.
</script>

<script type="text/markdown" id="md-03-c">
## CORS in Spring

Declare it centrally — scattering `@CrossOrigin` across controllers is how one endpoint ends up with `*` in production.

```java
@Bean
CorsConfigurationSource corsConfigurationSource() {
    CorsConfiguration cfg = new CorsConfiguration();
    cfg.setAllowedOrigins(List.of("https://app.bank.com"));  // exact origins
    cfg.setAllowedMethods(List.of("GET", "POST", "PUT", "DELETE"));
    cfg.setAllowedHeaders(List.of("Authorization", "Content-Type"));
    cfg.setAllowCredentials(true);   // cookies may ride along
    cfg.setMaxAge(Duration.ofHours(1));  // cache preflight approvals

    var source = new UrlBasedCorsConfigurationSource();
    source.registerCorsConfiguration("/api/**", cfg);
    return source;
}
```

```java
// Wire it into Spring Security so preflights clear the filter chain:
http.cors(Customizer.withDefaults());
```

Production notes:

- `setAllowCredentials(true)` + `setAllowedOrigins(List.of("*"))` throws at startup — Spring is protecting you from the wildcard-with-credentials trap. If you genuinely need patterns (`https://*.bank.com`), use `setAllowedOriginPatterns`, which sends back the *specific* requesting origin rather than a literal wildcard.
- Preflights are `OPTIONS` requests with no cookies and no `Authorization`. If your security config demands auth on everything, preflights get 401s and every cross-origin call mysteriously dies — the `http.cors(...)` line above is what exempts them properly.
- Never reflect arbitrary `Origin` values back. Allow-list exact origins.
</script>

<!-- MODULE 04 — XSS -->
<script type="text/markdown" id="md-04-a">
## When SOP switches sides

Cross-Site Scripting means an attacker gets **their JavaScript running inside your origin** — because you rendered untrusted input as markup. From that moment SOP works *for* the attacker: their script is a first-class citizen of `app.bank.com`, with every right your own code has.

| Type | Where the payload lives | Example |
|---|---|---|
| Reflected | In the request, echoed back | Search page renders `?q=<script>…<\/script>` |
| Stored | In your database | A "customer note" containing a script tag, shown to staff |
| DOM-based | Never reaches the server | Client JS pipes `location.hash` into `innerHTML` |

The root cause is always the same category of bug — data crossed into code context without encoding:

```java
// The bug: data concatenated into markup
out.println("<h2>Results for " + query + "</h2>");

// The fix is contextual OUTPUT encoding, not input filtering.
// In Thymeleaf you get it by default:
//   <h2 th:text="${query}">…</h2>        ← escapes
//   <h2 th:utext="${query}">…</h2>       ← does NOT ("u" = unescaped). Grep your codebase for th:utext.
```

Validate input for *shape* (an IBAN looks like an IBAN), but the defence that actually holds is **encode on output, for the context you're writing into** — HTML body, attribute, URL, and JS-string contexts each escape differently. The OWASP Java Encoder (`Encode.forHtml(...)`, `Encode.forJavaScript(...)`) covers the cases templates don't.
</script>

<script type="text/markdown" id="md-04-b">
## What XSS means for your credentials

This module sits here, between cookies and CSRF, for one reason: **where you store the session credential decides your XSS blast radius.**

| Credential lives in… | Injected script can read it? | Consequence |
|---|---|---|
| `localStorage` | **Always** — that's the API | Token exfiltrated to attacker's server; replayable from anywhere until expiry |
| Cookie, no `HttpOnly` | Yes, via `document.cookie` | Same — session stolen outright |
| Cookie with `HttpOnly` | **No** | Attacker can still *use* the session from the page, but can't *take* it |

Be honest about that last row: `HttpOnly` does not make XSS safe. The injected script can still call `fetch("/api/transfer", …)` and the browser will attach the cookie — the attacker rides the session while the tab is open. What `HttpOnly` removes is **exfiltration**: no stolen credential that works offline, from the attacker's machine, after the victim closes the tab, invisible to your session controls.

Try the blast-radius widget — same payload, three storage choices.

> This table is the strongest argument in the JWT storage debate (module 07): a refresh token in `localStorage` is one XSS away from long-term account takeover; the same token in an `HttpOnly` cookie is not readable, and module 07's rotation + reuse detection covers the session-riding remainder. CSP (module 09) is the backstop that makes the injection itself harder to land.
</script>

<!-- MODULE 05 — CSRF -->
<script type="text/markdown" id="md-05-a">
## The attack, step by step

Cross-Site Request Forgery weaponises the fact you learned in module 02: **the browser attaches cookies automatically** — including to requests the user never meant to make.

1. Victim logs into `app.bank.com`. Session cookie stored.
2. Victim, in another tab, opens `evil.example` (an ad, a forum post, a phishing link).
3. That page contains an invisible form pointed at your endpoint, submitted by script:

```html
<form action="https://app.bank.com/transfer" method="POST" id="f">
  <input type="hidden" name="to" value="AT61…attacker">
  <input type="hidden" name="amount" value="9000">
</form>
<script>document.getElementById("f").submit();<\/script>
```

4. The browser sends the POST — and attaches the `app.bank.com` session cookie, because that's what browsers do.
5. Your server sees a well-formed, *authenticated* transfer request. Nothing distinguishes it — except the `Origin` header, and whether you check it.

Note what the attacker never gets: the **response**. SOP's read barrier holds. They don't care — the damage *is the request*. That's why CORS (a read control) is irrelevant here, and why the preconditions are exactly: automatic credential attachment (cookies) + a predictable state-changing request + no server-side check.
</script>

<script type="text/markdown" id="md-05-b">
## Mitigations, in layers

**Layer 1 — `SameSite=Lax` (browser-side).** From module 02: Lax keeps the cookie home on cross-site POSTs, killing the classic form above. Necessary, not sufficient on its own:

- A state-changing **GET** endpoint (`/transfer?to=…` — yes, they exist) is reachable by top-level navigation, which Lax allows.
- Any `SameSite=None` cookie you legitimately need reopens the door.
- "Cross-**site**" is the boundary — an attacker running script on *any subdomain* of `bank.com` (one XSS on the marketing blog) is same-site, and SameSite offers nothing.

**Layer 2 — Synchronizer token (server-side, the classic).** Server generates a random token per session, embeds it in every form, requires it back in the POST. Here SOP finally works *for* you: the attacker can *send* the form, but to include the token they'd have to *read* your page first — and the read barrier stops that. No token, 403.

**Layer 3 — Double-submit cookie (the stateless variant).** Token goes in a cookie *and* a header/field; server just compares the two. No server-side storage — attractive for stateless APIs. Weakness: anyone who can *set* a cookie for your site (a hostile subdomain — cookie tossing again) can forge both halves. Fixes: sign the token, and use the `__Host-` prefix from module 02 so subdomains can't plant it. The circle closes.

**Layer 4 — `Origin` header validation.** Browsers stamp cross-site POSTs with `Origin: https://evil.example`, and pages can't forge it. Reject unexpected origins early in the filter chain. Cheap, effective, occasionally absent (some old browsers/proxies strip it) — treat missing-Origin per your risk appetite.

**Layer 5 — Custom header requirement.** For JSON APIs: demand e.g. `X-Requested-With`. A cross-site *form* can't set headers, and a cross-site *fetch* with a custom header triggers a CORS preflight (module 03) that your server declines. CSRF and CORS finally shake hands.

And the structural one: **APIs authenticated only by `Authorization: Bearer …` are immune** — nothing is attached automatically, so there is nothing to forge. The browser/app split in module 08 leans on exactly this.

Run the replay below: switch mitigations on and watch where the attack dies.
</script>

<script type="text/markdown" id="md-05-c">
## CSRF in Spring Security

Spring Security enables synchronizer-token CSRF protection **by default** for state-changing methods — half your job is *not turning it off*. The config work is the SPA case:

```java
http
  .csrf(csrf -> csrf
      // SPA pattern: token lives in a cookie the JS CAN read…
      .csrfTokenRepository(CookieCsrfTokenRepository.withHttpOnlyFalse())
      .csrfTokenRequestHandler(new CsrfTokenRequestAttributeHandler())
      // …and bearer-only endpoints don't need CSRF at all (module 08):
      .ignoringRequestMatchers("/api/mobile/**")
  );
```

Why `withHttpOnlyFalse` is *correct* and not a hole: the SPA must read the `XSRF-TOKEN` cookie and echo it as an `X-XSRF-TOKEN` header — that's the double-submit dance. The token isn't a secret *from your own origin*; the security property is that a **cross-origin** attacker can't read it (SOP) and can't set the header from a form. Angular does this dance automatically; for `fetch` you copy the cookie value into the header yourself.

Production notes:

- Spring Security 6 defers token generation (BREACH mitigation). If your SPA can't find the cookie on first load, that's why — the token materialises after the first mutating interaction or an explicit fetch of it.
- Only exempt endpoints that **cannot** be cookie-authenticated. `ignoringRequestMatchers("/api/**")` on an API that also accepts session cookies quietly reintroduces CSRF — this exact misconfiguration is module 08's opening case study.
- Keep state changes off GET. No token scheme rescues `/transfer?amount=…` from being a link.
</script>

<!-- MODULE 06 — SESSIONS VS JWTS -->
<script type="text/markdown" id="md-06-a">
## Two ways to answer "who is this?"

**Server-side session** — the cookie carries an opaque random ID; all actual state lives server-side:

```
Cookie: __Host-SESSION=9f2c…e1   →   sessionStore.get("9f2c…e1")   →   { userId: 42, roles: […] }
```

Revocation is trivial: delete the entry, the session is dead *now*. The cost appears at scale — every instance needs to reach the session store (Redis, database), and every request pays a lookup.

**JWT** — the credential *is* the state. A signed, self-contained document; any service holding the verification key can check it locally:

```
Authorization: Bearer eyJhbGciOi…   →   verify signature + exp locally   →   { sub: "42", roles: […] }
```

No lookup, no shared store, works beautifully across microservices. The cost is the mirror image: **the server no longer holds the thing it would need to delete.** A signed token is valid until `exp`, and nothing you do server-side changes the maths of the signature.

> The trade in one line: **sessions make revocation easy and scale-out harder; JWTs make scale-out easy and revocation harder.** Module 07 is entirely about buying revocation back.
</script>

<script type="text/markdown" id="md-06-b">
## JWT anatomy

Three base64url segments joined by dots — decode one below, then tamper with it:

```
header  . payload . signature
eyJhbG… . eyJzdW… . SflKxw…
```

Two facts people pay to learn twice:

- **Signed, not encrypted.** base64url is an *encoding* — anyone who obtains the token reads every claim with zero keys. Never put secrets in a JWT payload. The signature proves *integrity and issuer*, not confidentiality.
- **The claims are promises the verifier must actually check.** `exp` (expiry), `iss` (who minted it), `aud` (who it's for) do nothing unless your verification enforces them. Accepting a token minted for a different audience is a classic cross-service escalation.

| Claim | Job |
|---|---|
| `sub` | Subject — the user/principal ID |
| `exp` / `iat` | Expiry and issued-at (epoch seconds) |
| `iss` | Issuer — must match your auth server exactly |
| `aud` | Audience — must include *this* service |
| `jti` | Unique token ID — the hook for denylisting (module 07) |

### Algorithms, and the one rule about them

`HS256` signs with a **shared secret** — every service that verifies can also *mint*, so the secret sprawls. `RS256`/`ES256` sign with a **private key** and verify with the **public** one: the auth server keeps the only minting capability, and resource servers fetch public keys from a JWKS endpoint. Default to asymmetric for anything multi-service.

The rule: **the verifier decides the algorithm, never the token.** Historic libraries read `alg` from the attacker-controlled header — accepting `"none"` (no signature at all) or treating an RSA public key as an HS256 secret. Modern libraries pin the expected algorithm; make sure your config actually does.
</script>

<script type="text/markdown" id="md-06-c">
## Verifying in Spring

Resource-server config — every request verified locally, no session store anywhere:

```java
// application.yml
// spring.security.oauth2.resourceserver.jwt.issuer-uri: https://auth.bank.com

http
  .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
  .oauth2ResourceServer(oauth2 -> oauth2.jwt(Customizer.withDefaults()));
```

From `issuer-uri` alone, Spring discovers the JWKS endpoint, caches the public keys, pins the algorithm, and validates signature + `exp` + `iss` on every request. Add the audience check yourself — it's the one validators forget:

```java
@Bean
JwtDecoder jwtDecoder() {
    NimbusJwtDecoder decoder = JwtDecoders.fromIssuerLocation("https://auth.bank.com");
    decoder.setJwtValidator(new DelegatingOAuth2TokenValidator<>(
        JwtValidators.createDefaultWithIssuer("https://auth.bank.com"),
        new JwtClaimValidator<List<String>>("aud", aud -> aud != null && aud.contains("accounts-api"))
    ));
    return decoder;
}
```

Keep access-token lifetimes short — the *why* is the entire next module.
</script>

<!-- MODULE 07 — JWT INVALIDATION -->
<script type="text/markdown" id="md-07-a">
## Buying revocation back

Module 06 left us with a problem: a JWT can't be un-signed. Every practical answer is a version of the same idea — **make the un-revokable thing short-lived, and gate its renewal on something you CAN revoke.**

The standard split:

| Token | Lifetime | Lives | Revokable? |
|---|---|---|---|
| **Access token** (JWT) | 5–15 min | Client memory (a JS variable) | No — and short enough not to need it |
| **Refresh token** (opaque) | Days–weeks | `__Host-` HttpOnly cookie | **Yes** — server stores it |

The loop: login issues both → API calls carry `Authorization: Bearer <access>` → access expires → client calls `POST /auth/refresh` (the cookie rides automatically) → server checks its **stored record** of the refresh token → new access token + **rotated** refresh cookie.

Revocation lands at the refresh boundary: delete the server-side record and the next refresh fails — the user is out within one access-token lifetime, worst case. **Your revocation window equals your access TTL.** That sentence is why "we'll just make access tokens last 24 hours for convenience" is a security decision, not a convenience one.

For truly instant kills (compromised admin account), add a **denylist**: store the `jti` of revoked access tokens until their `exp`, checked on each request. Note what you just did — reintroduced a per-request lookup, the thing JWTs existed to avoid. It's a legitimate tool for rare emergencies, not the default path. Most systems: short TTL + accept the window.

> Where this design comes from: the access/refresh split *is* OAuth2's token model — in a federated setup these tokens arrive via the authorization-code + PKCE flow from your IdP rather than your own `/login`. Same lifecycle, same storage rules; this course stops at the pattern and leaves the full OAuth choreography to its own course.
</script>

<script type="text/markdown" id="md-07-b">
## Why the refresh token is a cookie — and rotation

**Storage argument (module 04, cashed in).** The refresh token is the *long-lived* credential — the one worth stealing. In `localStorage`, one XSS anywhere on the origin exfiltrates it: durable, portable account takeover. In an `HttpOnly` cookie it cannot be read at all; the worst XSS can do is *use* the refresh endpoint from the page, and rotation below turns even that into a detectable event.

**The attribute recipe, one last time:**

```
Set-Cookie: __Host-REFRESH=…; Secure; HttpOnly; SameSite=Strict; Path=/; Max-Age=1209600
```

Notice `Strict` finally gets its job: the refresh endpoint is only ever called by *your own* front-end via `fetch` — a same-site request. No user ever "arrives at" `/auth/refresh` from an email link, so Strict's UX penalty (module 02) doesn't exist here, and cross-site delivery is exactly what we want gone. One tension to settle honestly: you might want `Path=/auth/refresh` so the cookie rides on nothing else, but `__Host-` demands `Path=/`. Keep `__Host-` — module 02 established that `Path` is not a security boundary, while host-locking against cookie tossing is real protection. And since the endpoint is cookie-authenticated, its CSRF story is `Strict` + Origin validation (module 05, layers 1 and 4).

**Rotation + reuse detection.** Every refresh call consumes the presented token and issues a new one, all linked in a *family*:

1. Login creates family `F1`, token `RT-1`.
2. Refresh: `RT-1` marked **used**, `RT-2` issued (family `F1`).
3. A token marked used shows up again — say a stolen `RT-1` replayed by an attacker after the real client already spent it. That's not a retry; **someone has a copy**. Revoke family `F1` entirely.
4. Next refresh from *anyone* — attacker or legitimate user — fails. Both are sent to login. The user re-authenticates and carries on; the thief hits a wall — and you got a theft signal in your logs instead of silent long-term access.

Run the simulator: play the happy path first, then steal a token and replay it.
</script>

<script type="text/markdown" id="md-07-c">
## The refresh endpoint in Spring

```java
@PostMapping("/auth/refresh")
ResponseEntity<TokenResponse> refresh(
        @CookieValue("__Host-REFRESH") String presented,
        HttpServletResponse response) {

    // Store hashes, never raw tokens — a leaked DB must not mint sessions
    RefreshToken stored = refreshTokens.findByHash(sha256(presented))
        .orElseThrow(InvalidRefreshTokenException::new);

    if (stored.isUsed() || stored.isRevoked()) {
        // A spent token replayed = someone holds a copy. Kill the family.
        refreshTokens.revokeFamily(stored.familyId());
        throw new InvalidRefreshTokenException();
    }
    if (stored.isExpired()) throw new InvalidRefreshTokenException();

    stored.markUsed();                                        // consume
    RefreshToken next = refreshTokens.issue(stored.userId(), stored.familyId());
    String access = jwtMinter.mint(stored.userId(), Duration.ofMinutes(10));

    response.addHeader(HttpHeaders.SET_COOKIE, refreshCookie(next.rawValue()).toString());
    return ResponseEntity.ok(new TokenResponse(access, 600));
}

private ResponseCookie refreshCookie(String value) {
    return ResponseCookie.from("__Host-REFRESH", value)
        .httpOnly(true).secure(true).sameSite("Strict").path("/")
        .maxAge(Duration.ofDays(14))
        .build();
}
```

```java
@PostMapping("/auth/logout")
ResponseEntity<Void> logout(@CookieValue(value = "__Host-REFRESH", required = false) String presented,
                            HttpServletResponse response) {
    if (presented != null)
        refreshTokens.findByHash(sha256(presented))
                     .ifPresent(t -> refreshTokens.revokeFamily(t.familyId()));
    response.addHeader(HttpHeaders.SET_COOKIE, refreshCookie("").mutate().maxAge(Duration.ZERO).build().toString());
    return ResponseEntity.noContent().build();               // client discards the access token from memory
}
```

Production notes:

- **Logout = revoke family + clear cookie.** The in-flight access token survives up to 10 more minutes — that's the accepted window (or the denylist's job if you carry one).
- Mark-used and issue must be **atomic** (same transaction / conditional update), or a race between a legitimate retry and a genuine reuse becomes a coin toss. Related mercy: some implementations allow a few-seconds grace for the *immediately previous* token to absorb network retries — a deliberate, bounded exception, not a loophole.
- The access token lives in a **JS variable**, not localStorage — module 04. Page reload loses it; the app silently calls `/auth/refresh` on boot to get a fresh one. That "silent login on reload" is the pattern working, not a bug.
</script>

<!-- MODULE 08 — DUAL AUTH -->
<script type="text/markdown" id="md-08-a">
## The foot-gun, as promised

Module 05 flagged this line; here's the incident it causes:

```java
.csrf(csrf -> csrf.ignoringRequestMatchers("/api/**"))   // "it's an API, APIs don't need CSRF"
```

True — **if** `/api/**` only ever authenticates via `Authorization: Bearer`. But this system, like most real ones, also accepts the session cookie there, because the web SPA calls the same endpoints. Result: a cookie-authenticated, state-changing endpoint with CSRF switched off. The attacker's form from module 05 works again, and the config *looks* deliberate in review.

The root cause is exempting by **URL** when the risk lives in the **credential**. CSRF is an automatic-attachment problem: cookies have it, Bearer headers don't. So:

> **Exempt CSRF by how *this request* authenticated, never by where it's going.**

## One API, both credentials

The realistic requirement: browsers should use cookies (modules 04 and 07 made that case), while mobile apps and services use Bearer — same endpoints. The resolution rule must be deterministic:

1. `Authorization: Bearer` present → **token path**: verify the JWT locally (module 06), skip CSRF. Safe to skip because no attacker context can *set* that header — forms can't carry headers, and a cross-site `fetch` with one triggers a CORS preflight your server declines (module 05, layer 5).
2. Otherwise, cookie present → **session path**: CSRF token required, SameSite doing its work.
3. Both present → Bearer wins, cookie ignored. Pick the rule once and enforce it; ambiguity here is how auth bypasses are born.
4. Neither → 401.

```java
http
  .oauth2ResourceServer(oauth2 -> oauth2.jwt(Customizer.withDefaults()))  // Bearer path
  .csrf(csrf -> csrf.ignoringRequestMatchers(this::isBearerRequest));     // exempt by credential, not URL

private boolean isBearerRequest(HttpServletRequest request) {
    String auth = request.getHeader(HttpHeaders.AUTHORIZATION);
    return auth != null && auth.startsWith("Bearer ");
}
```

Route requests through the decision table below — the "both credentials" and "cookie to an exempted path" rows are where designs go wrong.
</script>

<script type="text/markdown" id="md-08-b">
## The BFF pattern — the clean cut

If the dual-mode API feels like two security models sharing one door, the Backend-for-Frontend pattern is the structural answer: **the browser never touches a token at all.**

```
Browser ── __Host-SESSION cookie ──▶ BFF ── Bearer (client credentials / user's tokens) ──▶ APIs
Mobile app ───────────── Bearer ─────────────────────────────────────────────────────────▶ APIs
```

- The BFF holds the user's access/refresh tokens **server-side**, keyed by the session. The browser gets exactly one credential: the `__Host-` HttpOnly session cookie from module 02.
- XSS story becomes as good as it gets: there is no token in the browser to steal — not in localStorage, not in memory. Module 04's blast-radius table has no bad row left.
- The browser-facing surface is a plain cookie-authenticated app: SameSite + CSRF token, exactly modules 02 and 05, no exceptions to reason about.
- Mobile and third parties talk Bearer to the APIs directly and never meet the cookie machinery.

The cost is honest: another deployable, token storage keyed to sessions inside it, and every browser call takes the extra hop. For a small estate the dual-mode API above is fine; the moment you have several SPAs, an IdP, and public APIs, the BFF's "one credential type per channel" simplicity tends to win the argument. Either way, the invariant is the same one this module opened with: **each request authenticates by exactly one deterministic rule, and CSRF applies wherever cookies do.**
</script>

<!-- MODULE 09 — HARDENING -->
<script type="text/markdown" id="md-09-a">
## CSP — the backstop

Module 04's defence was output encoding. Content-Security-Policy is the layer for the day someone misses a spot: even if an injection lands in your HTML, the browser refuses to execute scripts the policy doesn't sanction.

```
Content-Security-Policy: default-src 'self';
                         script-src 'self' 'nonce-R4nd0mPerResponse';
                         frame-ancestors 'none';
                         base-uri 'self'; form-action 'self'
```

- **`script-src` with nonces** is the heart: only script tags carrying this response's random nonce run. An injected `<script>alert(1)<\/script>` has no nonce → dead on arrival. Avoid `'unsafe-inline'` — it re-opens exactly the hole CSP exists to close.
- **`form-action 'self'`** stops injected forms posting your users' input to attacker domains — a phishing primitive people forget CSP covers.
- **Roll out with `Content-Security-Policy-Report-Only`** first: same policy, violations reported (not blocked), so you find your inline-script debt before breaking production.

## Clickjacking — the invisible overlay

The attack needs no code on your origin at all: `evil.example` frames your app in an iframe at `opacity: 0`, positions it so your **Confirm transfer** button sits exactly under their **Claim your prize** button, and lets the victim's own click do authenticated work — cookies attach, because a framed page is still your page in their session. Try it below, then flip the defence on.

The defence is one directive: **`frame-ancestors 'none'`** (or an allow-list of framing origins) — the browser refuses to render your page in anyone else's frame. `X-Frame-Options: DENY` is the legacy spelling; send both, let modern browsers prefer the CSP directive.
</script>

<script type="text/markdown" id="md-09-b">
## The header checklist

| Header | One honest sentence |
|---|---|
| `Strict-Transport-Security: max-age=31536000; includeSubDomains` | After first contact, the browser refuses plain HTTP to you entirely — no downgrade, no stripped redirects. Every `Secure` cookie in this course assumes it. |
| `Content-Security-Policy` | The XSS and clickjacking backstop above — `script-src` + `frame-ancestors` earn their keep. |
| `X-Content-Type-Options: nosniff` | Browsers must trust your declared Content-Type — stops an uploaded "image" being sniffed into executable script. |
| `Referrer-Policy: strict-origin-when-cross-origin` | Cross-site requests learn your origin, never your full URLs — path and query stay home (tokens in URLs shouldn't exist, but this catches the day they do). |
| `Cache-Control: no-store` on authenticated responses | Shared caches and back-buttons don't serve one user's data to the next. |
| `Permissions-Policy: camera=(), geolocation=(), …` | Features you don't use can't be abused in your name — including by anything you embed. |

```java
http.headers(h -> h
    .httpStrictTransportSecurity(hsts -> hsts.maxAgeInSeconds(31536000).includeSubDomains(true))
    .contentSecurityPolicy(csp -> csp.policyDirectives(
        "default-src 'self'; script-src 'self' 'nonce-" + nonce + "'; " +
        "frame-ancestors 'none'; base-uri 'self'; form-action 'self'"))
    .contentTypeOptions(Customizer.withDefaults())
    .referrerPolicy(r -> r.policy(ReferrerPolicy.STRICT_ORIGIN_WHEN_CROSS_ORIGIN))
);
```

(Spring sends `X-Content-Type-Options` and a cache-control set on secured responses by default — the config above is you *keeping* them while adding the rest. The nonce needs a per-response filter; Spring doesn't generate it for you.)

## The whole course in nine sentences

1. **SOP** is a read barrier, not a send barrier — requests fly, responses are guarded.
2. **Cookies** attach automatically: the entire convenience and the entire attack surface, in one behaviour.
3. **CORS** decides who may *read*, protects users rather than servers, and therefore never defends against CSRF.
4. **XSS** blast radius is decided by where the credential lives — `HttpOnly` removes exfiltration, nothing removes session-riding except fixing the injection.
5. **CSRF** is the automatic-attachment gap: defend in layers, because every single layer fails somewhere.
6. **Sessions** buy easy revocation at the cost of shared state; **JWTs** buy local verification at the cost of revocation.
7. Your **revocation window equals your access-token TTL**; rotate refresh tokens and treat reuse as theft, not noise.
8. Exempt CSRF **by credential, never by URL** — or adopt the BFF and keep tokens out of the browser entirely.
9. **Headers** are the backstop for the day one of the above fails — and one of them will.

That's the course. Progress and quiz scores are in your browser's localStorage; push the file to GitHub Pages next to its siblings and it's live.
</script>

  "origin-check": function(el){
    const pairs = [
      { a:"https://app.bank.com", b:"https://app.bank.com/settings", same:true,  why:"Path is not part of the origin. Scheme, host and port all match." },
      { a:"https://bank.com",     b:"http://bank.com",               same:false, why:"Scheme differs. https and http are different origins even on the same host." },
      { a:"https://bank.com",     b:"https://bank.com:8443",         same:false, why:"Port differs — 443 (implied) vs 8443." },
      { a:"https://app.bank.com", b:"https://api.bank.com",          same:false, why:"Host differs. Different origin — but same *site* (bank.com), which is why cookies may still flow between them." },
      { a:"https://bank.com",     b:"https://bank.com.evil.example", same:false, why:"Classic phish shape: the registrable domain here is evil.example. Read hostnames right-to-left." }
    ];
    let i = 0, answered = false;
    el.innerHTML = '<h4>Origin comparator</h4><p class="hint">Same origin or not? Decide, then tap.</p><div id="oc-body"></div>';
    const body = el.querySelector("#oc-body");
    function render(){
      const p = pairs[i];
      answered = false;
      body.innerHTML =
        '<div class="anatomy" style="white-space:normal;line-height:1.8">A: ' + p.a + '<br>B: ' + p.b + '</div>' +

          answered = true;

  "cookie-anatomy": function(el){
    const parts = {
      name:  "<strong>__Host-SESSION</strong> — the name. The __Host- prefix is an enforced contract: Secure + Path=/ + no Domain, or the browser refuses to store it.",
      value: "<strong>9f2c…e1</strong> — the value. Opaque random ID; the client can edit anything it stores, so never put trusted data here.",
      sec:   "<strong>Secure</strong> — HTTPS only. Without it the cookie leaks on any plain-HTTP request.",
      http:  "<strong>HttpOnly</strong> — invisible to document.cookie. An XSS payload can still *use* the session by making requests, but can no longer *exfiltrate* the cookie itself.",
      ss:    "<strong>SameSite=Lax</strong> — ships on top-level link-click navigations, stays home on cross-site POSTs, images, iframes and fetch.",
      path:  "<strong>Path=/</strong> — attach on every path of this host. Required by __Host-.",
      age:   "<strong>Max-Age=28800</strong> — persistent for 8 hours. Remove it and this becomes a session cookie."
    };
    el.innerHTML =
      '<h4>Anatomy of a Set-Cookie header</h4>' +
      '<p class="hint">Tap each part.</p>' +
      '<div class="anatomy">Set-Cookie: ' +
      '<span data-part="name">__Host-SESSION</span>=<span data-part="value">9f2c…e1</span>; ' +
      '<span data-part="sec">Secure</span>; ' +
      '<span data-part="http">HttpOnly</span>; ' +
      '<span data-part="ss">SameSite=Lax</span>; ' +
      '<span data-part="path">Path=/</span>; ' +
      '<span data-part="age">Max-Age=28800</span></div>' +
      '<div class="anatomy-note" id="an-note">Tap an underlined part of the header above.</div>';
    el.querySelectorAll("[data-part]").forEach(function(sp){

  "samesite-sim": function(el){
    const scenarios = [
      { id:"nav",   label:"Link click → your site",       desc:"Top-level GET navigation from another site (email link, search result)", crossSite:true,  topLevelGet:true },
      { id:"post",  label:"Cross-site form POST",         desc:"evil.example auto-submits a form to your site — the classic CSRF shape", crossSite:true,  topLevelGet:false },
      { id:"img",   label:"Image / iframe embed",         desc:"Another site embeds <img src=\"https://app.bank.com/…\">",              crossSite:true,  topLevelGet:false },
      { id:"fetch", label:"Cross-site fetch()",           desc:"Script on another site calls fetch(…, {credentials:'include'})",         crossSite:true,  topLevelGet:false },
      { id:"same",  label:"Same-site request",            desc:"app.bank.com calling api.bank.com — same registrable domain",           crossSite:false, topLevelGet:false }
    ];
    let ss = "Lax", secure = true, scen = "post";
    el.innerHTML =
      '<h4>SameSite simulator</h4>' +
      '<p class="hint">Configure the cookie, pick the request, predict the verdict before you look.</p>' +
      '<div class="opt-row"><span class="opt-label">SameSite</span>' +
        ['Strict','Lax','None'].map(function(v){ return '<button data-ss="'+v+'">'+v+'</button>'; }).join('') + '</div>' +
      '<div class="opt-row"><span class="opt-label">Secure</span>' +
        '<button data-sec="1">Secure ✓</button><button data-sec="0">no Secure</button></div>' +
      '<div class="opt-row"><span class="opt-label">Scenario</span>' +
        scenarios.map(function(s){ return '<button data-scen="'+s.id+'">'+s.label+'</button>'; }).join('') + '</div>' +
      '<div id="ss-out"></div>';

    function update(){
      el.querySelectorAll("[data-ss]").forEach(function(b){ b.classList.toggle("sel", b.getAttribute("data-ss")===ss); });
      el.querySelectorAll("[data-sec]").forEach(function(b){ b.classList.toggle("sel", (b.getAttribute("data-sec")==="1")===secure); });
      el.querySelectorAll("[data-scen]").forEach(function(b){ b.classList.toggle("sel", b.getAttribute("data-scen")===scen); });

      const s = scenarios.find(function(x){ return x.id===scen; });
      let sent, why;
      if(ss==="None" && !secure){
        sent = false;
        why = "SameSite=None without Secure: the browser rejects the cookie at Set-Cookie time — it was never stored, so there is nothing to send anywhere.";
      } else if(!s.crossSite){
        sent = true;
        why = "Same-site request — SameSite never blocks these. app.bank.com → api.bank.com share the registrable domain bank.com.";
      } else if(ss==="None"){
        sent = true;
        why = "SameSite=None ships everywhere, like the pre-2020 web. Your CSRF defences (module 05) are now the only thing standing.";
      } else if(ss==="Strict"){
        sent = false;
        why = "Strict never crosses a site boundary — " + (s.topLevelGet ? "not even on a link click, which is why arriving users look logged out." : "this request goes out with no cookie.");
      } else { // Lax
        sent = s.topLevelGet;
        why = s.topLevelGet
          ? "Lax's one exception: top-level navigation with a safe method (GET). The user lands logged in."
          : "Lax stays home on cross-site " + (scen==="post" ? "POSTs — this default alone defeats the classic auto-submit CSRF form." : (scen==="img" ? "subresource loads (images, iframes)." : "fetch/XHR calls."));
      }

      const cookieLine = '__Host-SESSION=9f2c…e1' + (secure ? '; Secure' : '') + '; HttpOnly; SameSite=' + ss + '; Path=/';
      document.getElementById("ss-out").innerHTML =
        wire("res", "cookie as stored", '<span class="hl-cookie">Set-Cookie: ' + cookieLine + '</span>', null) +
        wire("req", s.desc,
          (scen==="post" ? "POST /transfer HTTP/1.1" : "GET /api/… HTTP/1.1") + "\nHost: app.bank.com\n" +
          (sent ? '<span class="hl-cookie">Cookie: __Host-SESSION=9f2c…e1</span>' : '<span class="hl-dim">(no Cookie header)</span>'),
          {ok:sent, text: sent ? "Cookie ships" : "Cookie stays home"}) +
        '<div class="callout" style="border-left-color:' + (sent ? 'var(--ok)' : 'var(--no)') + ';background:var(--panel)">' + why + '</div>';
    }
    el.addEventListener("click", function(e){
      const b = e.target.closest("button"); if(!b) return;
      if(b.hasAttribute("data-ss")) ss = b.getAttribute("data-ss");
      else if(b.hasAttribute("data-sec")) secure = b.getAttribute("data-sec")==="1";
      else if(b.hasAttribute("data-scen")) scen = b.getAttribute("data-scen");
      else return;
      update();
    });
    update();
  },

  "cors-preflight": function(el){
    let method="POST", ctype="json", auth=false, creds=true, acao="exact";
    el.innerHTML =
      '<h4>CORS exchange simulator</h4>' +
      '<p class="hint">Page on <code style="font-family:var(--mono)">app.bank.com</code> calls <code style="font-family:var(--mono)">api.bank.com</code>. Configure both sides; predict the exchange.</p>' +

      '<div id="cp-out"></div>';

    function isSimple(){
      return (method==="GET" || (method==="POST" && (ctype==="none" || ctype==="form"))) && !auth;
    }
    function update(){
      el.querySelectorAll("[data-m]").forEach(function(b){ b.classList.toggle("sel", b.getAttribute("data-m")===method); });
      el.querySelectorAll("[data-c]").forEach(function(b){ b.classList.toggle("sel", b.getAttribute("data-c")===ctype); });
      el.querySelectorAll("[data-a]").forEach(function(b){ b.classList.toggle("sel", auth); });
      el.querySelectorAll("[data-cr]").forEach(function(b){ b.classList.toggle("sel", creds); });
      el.querySelectorAll("[data-o]").forEach(function(b){ b.classList.toggle("sel", b.getAttribute("data-o")===acao); });

      const simple = isSimple();
      const acaoLine = acao==="exact" ? "Access-Control-Allow-Origin: https://app.bank.com\nAccess-Control-Allow-Credentials: true"
                     : acao==="star" ? "Access-Control-Allow-Origin: *" : '<span class="hl-dim">(no CORS headers)</span>';
      const readable = acao==="exact" || (acao==="star" && !creds);
      let out = "", why = "";

      const reqHeaders = "Origin: https://app.bank.com" +
        (ctype!=="none" ? "\nContent-Type: " + (ctype==="json" ? "application/json" : "application/x-www-form-urlencoded") : "") +
        (auth ? "\nAuthorization: Bearer eyJ…" : "") +
        (creds ? '\n<span class="hl-cookie">Cookie: __Host-SESSION=9f2c…e1</span>' : "");

      if(!simple){
        out += wire("req", "preflight — browser asks permission first",
          "OPTIONS /api/transfer HTTP/1.1\nHost: api.bank.com\nOrigin: https://app.bank.com\nAccess-Control-Request-Method: " + method +
          (auth || ctype==="json" ? "\nAccess-Control-Request-Headers: " + [ctype==="json"?"content-type":null, auth?"authorization":null].filter(Boolean).join(", ") : ""), null);
        if(!readable){
          out += wire("res", "preflight response", acaoLine, {ok:false, text: acao==="none" ? "No approval → real request is NEVER sent" : "Wildcard rejected in credentials mode → real request never sent"});
          why = acao==="none"
            ? "Preflighted requests fail closed: without server approval, the actual request doesn't go out at all. Compare that with the simple-request case, which is always sent."
            : "With credentials: include, the browser demands the exact origin plus Allow-Credentials: true. A wildcard answer fails the preflight.";
        } else {
          out += wire("res", "preflight response", acaoLine + "\nAccess-Control-Allow-Methods: GET, POST, PUT\nAccess-Control-Allow-Headers: authorization, content-type\nAccess-Control-Max-Age: 3600", {ok:true, text:"Approved — cached for 1 hour"});
          out += wire("req", "actual request", method + " /api/transfer HTTP/1.1\nHost: api.bank.com\n" + reqHeaders, {ok:true, text:"Sent — and response readable by the script"});
          why = "One extra round trip, then Access-Control-Max-Age caches the approval. This is the everyday SPA-to-API pattern: JSON POSTs and Authorization headers always preflight.";
        }
      } else {
        out += wire("req", "simple request — sent immediately, no preflight",
          method + " /api/transfer HTTP/1.1\nHost: api.bank.com\n" + reqHeaders, {ok:true, text:"Sent — simple requests always go out"});
        out += wire("res", "response", acaoLine, {ok:readable, text: readable ? "Script may read the response" : "Executed server-side — but the READ is blocked"});
        why = readable
          ? (acao==="star" ? "Wildcard works here only because no credentials rode along." : "Exact origin match — full access.")
          : "The request was processed. The server did the work, state changed if it was going to. Only the script's view of the response is withheld — which is why CORS is not a CSRF defence.";
      }
      document.getElementById("cp-out").innerHTML = out + '<div class="callout" style="background:var(--panel)">' + why + '</div>';
    }
    el.addEventListener("click", function(e){
      const b = e.target.closest("button"); if(!b) return;
      if(b.hasAttribute("data-m")) method = b.getAttribute("data-m");
      else if(b.hasAttribute("data-c")) ctype = b.getAttribute("data-c");
      else if(b.hasAttribute("data-a")) auth = !auth;
      else if(b.hasAttribute("data-cr")) creds = !creds;
      else if(b.hasAttribute("data-o")) acao = b.getAttribute("data-o");
      else return;
      update();
    });
    update();
  },

  "refresh-rotate": function(el){
    let sim;
    el.innerHTML =
      '<h4>Rotation &amp; reuse detection</h4>' +
      '<p class="hint">Play the happy path, then steal a token and replay it.</p>' +
      '<div class="opt-row">' +
      '<button data-act="api">Call API</button>' +
      '<button data-act="expire">10 min pass</button>' +
      '<button data-act="refresh">Refresh</button>' +
      '<button data-act="steal">Attacker steals current RT</button>' +
      '<button data-act="replay">Attacker replays it</button>' +
      '<button data-act="reset">Reset</button></div>' +
      '<div id="rr-state" class="anatomy" style="white-space:normal"></div>' +
      '<div class="wire"><div class="wire-head"><span class="wire-dir res">▼ EVENT LOG</span><span>server\'s view</span></div>' +
      '<div id="rr-log" style="padding:12px 14px;font-size:13.5px;line-height:1.9;font-family:var(--mono)"></div></div>';

    function reset(){
      sim = { current:1, userRT:1, attackerRT:null, accessValid:true, familyAlive:true, log:[] };
      log("ok", "Login → family F1 created, RT-1 issued to user, access token minted (TTL 10 min)");
      render();
    }
    function log(kind, text){ sim.log.push({kind:kind, text:text}); }
    function render(){
      document.getElementById("rr-state").innerHTML =
        "Access token: " + (sim.accessValid ? '<span style="color:#34D399">valid</span>' : '<span style="color:#F87171">expired</span>') +
        " &nbsp;·&nbsp; User holds: RT-" + sim.userRT +
        " &nbsp;·&nbsp; Server's live token: RT-" + sim.current +
        " &nbsp;·&nbsp; Family F1: " + (sim.familyAlive ? '<span style="color:#34D399">alive</span>' : '<span style="color:#F87171">REVOKED</span>') +
        (sim.attackerRT ? " &nbsp;·&nbsp; Attacker holds: RT-" + sim.attackerRT : "");
      document.getElementById("rr-log").innerHTML = sim.log.map(function(e){
        const c = e.kind==="ok" ? "#34D399" : e.kind==="warn" ? "#FBBF24" : "#F87171";
        return '<div style="color:' + c + '">› ' + e.text + '</div>';
      }).join("");
    }
    el.addEventListener("click", function(e){
      const b = e.target.closest("[data-act]"); if(!b) return;
      const act = b.getAttribute("data-act");
      if(act==="reset"){ reset(); return; }
      if(act==="api"){
        if(sim.accessValid) log("ok", "GET /api/accounts + Bearer access → 200 (verified locally, no lookup)");
        else log("bad", "GET /api/accounts → 401 token expired. Client should refresh.");
      }
      if(act==="expire"){ sim.accessValid = false; log("warn", "Access token TTL elapsed"); }
      if(act==="refresh"){
        if(!sim.familyAlive){ log("bad", "User: POST /auth/refresh (cookie: RT-" + sim.userRT + ") → 401. Family F1 revoked — full login required."); }
        else if(sim.userRT === sim.current){
          sim.current++; sim.userRT = sim.current; sim.accessValid = true;
          log("ok", "User: POST /auth/refresh (cookie: RT-" + (sim.current-1) + ") → marked USED, RT-" + sim.current + " issued, new access token");
        } else {
          sim.familyAlive = false;
          log("bad", "User presents RT-" + sim.userRT + " — already USED (the attacker spent it first). Reuse detected → FAMILY F1 REVOKED");
          log("warn", "The attacker's stolen session dies with the family. User re-authenticates and carries on — theft detected, not silent.");
        }
      }
      if(act==="steal"){
        sim.attackerRT = sim.userRT;
        log("warn", "(off the wire) attacker obtains a copy of RT-" + sim.userRT + " — server sees nothing yet");
      }
      if(act==="replay"){
        if(sim.attackerRT === null){ log("warn", "Attacker holds nothing — steal a token first"); }
        else if(!sim.familyAlive){ log("bad", "Attacker replays RT-" + sim.attackerRT + " → 401. Family already revoked."); }
        else if(sim.attackerRT === sim.current){
          sim.current++; sim.attackerRT = sim.current;
          log("bad", "Attacker replays RT-" + (sim.current-1) + " FIRST — still unused, server can't tell → rotated to RT-" + sim.current + ", attacker gets an access token");
          log("warn", "But the real user still holds RT-" + sim.userRT + ". Their next Refresh presents a spent token → reuse detection. Try it.");
        } else {
          sim.familyAlive = false;
          log("bad", "Attacker replays RT-" + sim.attackerRT + " — token already USED. Reuse = two parties hold copies → FAMILY F1 REVOKED");
          log("warn", "Next refresh from anyone fails: user re-logs in and carries on; attacker is out. Theft detected, not silent.");
        }
      }
      render();
    });
    reset();
  },

        document.getElementById("cj-res").innerHTML = msg;
      });
      const confirm = stage.querySelector("#cj-confirm");
      if(confirm) confirm.addEventListener("click", function(){
        msg = verdict(false, "You just confirmed a $9,000 transfer. You aimed at CLAIM PRIZE — but the bank's Confirm button was layered invisibly on top, and your click, cookies and all, went to it. " + (opacity>0 ? "" : "Drag the slider to see what you actually clicked."));
        document.getElementById("cj-res").innerHTML = msg;
      });
      document.getElementById("cj-res").innerHTML = msg;
    }
    el.querySelector("#cj-op").addEventListener("input", function(e){
      opacity = parseInt(e.target.value, 10);
      const bank = stage.querySelector("#cj-bank");
      if(bank) bank.style.opacity = opacity/100;
    });
    el.querySelector("#cj-fa").addEventListener("click", function(){
      blocked = !blocked; msg = ""; render();
    });
    render();
  }
};

/* ---------- shared render helpers ---------- */
function wire(dir, label, body, v){
  return '<div class="wire">' +
    '<div class="wire-head"><span class="wire-dir ' + dir + '">' + (dir==="req" ? "▲ REQUEST" : "▼ RESPONSE") + '</span><span>' + label + '</span></div>' +
    '<pre>' + body + '</pre>' +
    (v ? '<div class="verdict ' + (v.ok ? "ok" : "no") + '"><span class="dot"></span>' + v.text + '</div>' : '') +
    '</div>';
}
function verdict(ok, text){
  return '<div class="verdict ' + (ok ? "ok" : "no") + '" style="border:1px solid var(--line);border-radius:8px"><span class="dot"></span>' + text + '</div>';
}

/* ---------- nav + module rendering ---------- */
function renderNav(){
  const nav = document.getElementById("modNav");
  nav.innerHTML = "";
  COURSE.modules.forEach(function(m, idx){
    const b = document.createElement("button");
    b.textContent = m.code + " " + m.title;
    b.className = (idx===current ? "active " : "") + (state.done[m.id] ? "done" : "");
    b.addEventListener("click", function(){ current = idx; renderModule(); window.scrollTo({top:0}); });
    nav.appendChild(b);
  });
  const doneCount = COURSE.modules.filter(function(m){ return state.done[m.id]; }).length;
  document.getElementById("progressPill").textContent = doneCount + " / " + COURSE.modules.length + " modules";
}

function renderModule(){
  const m = COURSE.modules[current];
  const root = document.getElementById("content");
  root.innerHTML = "";

  const head = document.createElement("div");
  head.className = "mod-head";
  head.innerHTML = '<div class="mod-code">MODULE ' + m.code + '</div><h1 class="mod-title">' + m.title + '</h1><div class="mod-sub">' + m.sub + '</div>';
  root.appendChild(head);

  if(m.placeholder){
    const ph = document.createElement("div");
    ph.className = "placeholder-note";
    ph.textContent = "Module " + m.code + " — coming in the next build session.";
    root.appendChild(ph);
  } else {
    (m.sections || []).forEach(function(sec){
      if(sec.md){
        const src = document.getElementById(sec.md);
        const div = document.createElement("div");
        div.className = "md";
        div.innerHTML = marked.parse(src ? src.textContent.replace(/<\\\//g, "</") : "_missing block: " + sec.md + "_");
        root.appendChild(div);
      } else if(sec.widget){
        const div = document.createElement("div");
        div.className = "widget";
        root.appendChild(div);
        if(WIDGETS[sec.widget]) WIDGETS[sec.widget](div);
        else div.textContent = "missing widget: " + sec.widget;
      }
    });
    if(m.quiz && m.quiz.length) renderQuiz(m, root);
  }

  const foot = document.createElement("div");
  foot.className = "mod-footer";
  const prev = document.createElement("button");
  prev.textContent = "← Previous";
  prev.disabled = current === 0;
  prev.addEventListener("click", function(){ current--; renderModule(); window.scrollTo({top:0}); });
  const doneBtn = document.createElement("button");
  doneBtn.className = "primary";
  doneBtn.textContent = state.done[m.id] ? "Completed ✓ — next module →" : "Mark complete & continue →";
  doneBtn.addEventListener("click", function(){
    state.done[m.id] = true; saveState();
    if(current < COURSE.modules.length - 1) current++;
    renderNav(); renderModule(); window.scrollTo({top:0});
  });
  foot.appendChild(prev); foot.appendChild(doneBtn);
  root.appendChild(foot);
  renderNav();
}

function renderQuiz(m, root){
  const wrap = document.createElement("div");
  wrap.className = "quiz";
  wrap.innerHTML = '<h2>Quick check</h2><div class="qmeta">' + m.quiz.length + ' questions · answers reveal explanations</div>';
  let score = 0, answeredCount = 0;
  m.quiz.forEach(function(q, qi){
    const qd = document.createElement("div");
    qd.className = "q";
    qd.innerHTML = '<div class="q-text">' + (qi+1) + '. ' + q.t + '</div>';
    const ch = document.createElement("div");
    ch.className = "choices";
    const why = document.createElement("div");
    why.className = "why";
    q.c.forEach(function(opt){
      const b = document.createElement("button");
      b.textContent = opt.x;
      b.addEventListener("click", function(){
        if(qd.classList.contains("answered")) return;
        qd.classList.add("answered");
        answeredCount++;
        if(opt.ok){ b.classList.add("picked-ok"); score++; }
        else {
          b.classList.add("picked-no");
          ch.querySelectorAll("button").forEach(function(bb, bi){ if(q.c[bi].ok) bb.classList.add("reveal-ok"); });
        }
        why.textContent = opt.why;
        if(answeredCount === m.quiz.length){
          const sc = wrap.querySelector(".quiz-score");
          sc.style.display = "block";
          sc.textContent = "Score: " + score + " / " + m.quiz.length;
          state.quiz[m.id] = score; saveState();
        }
      });
      ch.appendChild(b);
    });
    qd.appendChild(ch); qd.appendChild(why); wrap.appendChild(qd);
  });
  const sc = document.createElement("div");
  sc.className = "quiz-score";
  wrap.appendChild(sc);
  root.appendChild(wrap);
}

marked.setOptions({ mangle:false, headerIds:false });
renderNav();
renderModule();
</script>
