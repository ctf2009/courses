with no `match` block matches everything, so anything below it is dead config. If a rule seems to be ignored, check what is above it before checking the rule itself.\n:::\n\n## The canary that isn't a canary\n\nWeighted routing shifts a percentage of *requests*, not of users. A customer refreshing the page can land on v1, then v2, then v1 again. For anything stateful — a shopping cart, a multi-step form — that is a bug, not a release strategy.\n\nTwo fixes, and they solve different problems:\n\n```yaml\n# consistent hashing: same user, same pod\nspec:\n  host: checkout\n  trafficPolicy:\n    loadBalancer:\n      consistentHash:\n        httpCookie: { name: session, ttl: 3600s }\n```\n\nOr route on an explicit signal — a header set by the gateway for internal testers, a cookie set at login for a cohort. That is the `match` rule in the example above, and it is what most \"canary\" deployments actually want: deterministic exposure for a known group, then a weighted ramp for the rest.\n\n## Resilience settings\n\n### Timeouts\n\n```yaml\n  http:\n  - route: [{ destination: { host: payments } }]\n    timeout: 3s\n```\n\nDefault is no timeout at the mesh level, which means a hung upstream ties up a connection indefinitely. Setting one is usually the single highest-value change in a new mesh. Set it shorter than the caller's own patience, and be aware that a mesh timeout does not cancel work already running in the upstream application.\n\n### Retries\n\n```yaml\n    retries:\n      attempts: 3\n      perTryTimeout: 1s\n      retryOn: connect-failure,refused-stream,5xx\n```\n\nRead `retryOn` carefully. Retrying `5xx` includes `500` — and retrying a non-idempotent `POST` that returned 500 after partially succeeding is how duplicate payments happen. For anything that mutates state, restrict to `connect-failure,refused-stream` or nothing at all.\n\n:::warn Retries compose\nIstio applies a default of two retries on connect failures for HTTP routes unless you say otherwise. If your HTTP client also retries and your caller retries, you have a multiplier. Decide where retry lives — one layer, on purpose — and turn it off everywhere else.\n:::\n\n### Circuit breaking and outlier detection\n\n```yaml\nspec:\n  host: payments\n  trafficPolicy:\n    connectionPool:\n      tcp: { maxConnections: 100 }\n      http:\n        http2MaxRequests: 200\n        maxRequestsPerConnection: 10\n    outlierDetection:\n      consecutive5xxErrors: 5\n      interval: 10s\n      baseEjectionTime: 30s\n      maxEjectionPercent: 50\n```\n\n`connectionPool` limits are the circuit breaker: exceed them and the proxy fails fast with a `503 UO` rather than queueing. `outlierDetection` ejects individual misbehaving endpoints from the pool for a while — the mesh equivalent of a health check that actually reflects real traffic.\n\n`maxEjectionPercent` is the safety valve. Without it, a bad deploy where every pod returns 500 gets every pod ejected, and you have taken the service fully down rather than degraded it.\n\n## Fault injection\n\nBreaking things deliberately is a first-class feature, and it is one of the capabilities Gateway API does not have.\n\n```yaml\n  http:\n  - fault:\n      delay: { percentage: { value: 10 }, fixedDelay: 5s }\n      abort: { percentage: { value: 5 }, httpStatus: 503 }\n    route: [{ destination: { host: payments } }]\n```\n\nThis is how you test that your timeout and retry configuration is right, in a real environment, without a chaos platform. Scope it with a header match so only your test traffic is affected — a fault injection rule with no match block applies to every caller, which is a memorable way to learn about rule ordering.\n\n## Reaching outside the cluster\n\n`ServiceEntry` adds a non-Kubernetes destination to the mesh's registry so you can apply the same routing and policy to it — a payment provider's API, a database on a VM, a mainframe endpoint.\n\n```yaml\napiVersion: networking.istio.io/v1\nkind: ServiceEntry\nmetadata: { name: card-provider, namespace: shop }\nspec:\n  hosts: [\"api.cardprovider.com\"]\n  ports: [{ number: 443, name: https, protocol: HTTPS }]\n  resolution: DNS\n  location: MESH_EXTERNAL\n```\n\nRelated, and worth knowing the name of: `outboundTrafficPolicy` controls whether unknown external traffic is allowed (`ALLOW_ANY`, the default) or blocked (`REGISTRY_ONLY`). Switching to `REGISTRY_ONLY` gives you egress control — every external destination must be declared — which is often the actual reason a security team wanted a mesh. It also breaks every undeclared dependency the moment you enable it, so stage it.\n\n:::lab Watch a split move\nWith `checkout` deployed as v1 and v2 and the resources above applied:\n```bash\n# 100 requests, count where they land\nkubectl -n shop run probe --image=curlimages/curl -it --rm -- sh -c \\\n  'for i in $(seq 100); do curl -s checkout:8080/version; done' | sort | uniq -c\n\n# now the header path\nkubectl -n shop run probe --image=curlimages/curl -it --rm -- \\\n  curl -s -H \"x-beta: true\" checkout:8080/version\n\n# add a 5s delay to 100% of traffic and watch your timeout fire\nkubectl -n shop patch virtualservice checkout --type=json -p= \\\n  '[{\"op\":\"add\",\"path\":\"/spec/http/1/fault\",\"value\":{\"delay\":{\"percentage\":{\"value\":100},\"fixedDelay\":\"5s\"}}}]'\n```\n:::", "quiz": [{"q": "Your VirtualService has a catch-all route first and a header match second. What happens?", "o": ["The header match takes priority because it is more specific", "The catch-all matches everything and the header rule is dead config", "Both apply in sequence", "Istio rejects the config"], "a": 1, "e": "HTTP rules are evaluated top to bottom and the first match wins — there is no specificity ranking. A rule with no match block matches everything, so anything below it never runs."}, {"q": "Where are subsets like v1 and v2 defined?", "o": ["In the VirtualService", "In the DestinationRule, then referenced by the VirtualService", "In the Service", "In the Deployment"], "a": 1, "e": "DestinationRule maps subset names to pod labels; VirtualService routes to those names. This is why version-aware routing almost always needs both resources."}, {"q": "A 90/10 weighted split is live and a customer reports their cart emptying at random. What is the likely cause?", "o": ["The DestinationRule is missing", "Weights apply per request, so the customer is bouncing between versions mid-session", "The proxy is dropping cookies", "Outlier detection ejected a pod"], "a": 1, "e": "Weighted routing distributes requests, not users. Anything session-stateful needs consistent hashing on a cookie or header, or explicit cohort routing via a match rule."}, {"q": "Why is `retryOn: 5xx` dangerous for a payment API?", "o": ["5xx is not a valid value", "It retries 500 responses, which may re-submit a non-idempotent request that partly succeeded", "It disables timeouts", "It conflicts with outlier detection"], "a": 1, "e": "A 500 may mean the upstream did some of the work before failing. Retrying that is how duplicate charges happen. Mutating endpoints should retry only on connect-level failures, if at all."}, {"q": "What does `maxEjectionPercent` protect you from?", "o": ["Too many retries", "Outlier detection ejecting every endpoint during a bad deploy and taking the service fully down", "Connection pool exhaustion", "Certificate expiry"], "a": 1, "e": "If every pod starts returning 500 — say, a broken release — unbounded ejection removes the entire pool. Capping it keeps a degraded service rather than converting a partial failure into a total one."}, {"q": "What does switching `outboundTrafficPolicy` to REGISTRY_ONLY do?", "o": ["Blocks all ingress traffic", "Blocks outbound traffic to any destination not declared in the mesh registry", "Disables ServiceEntry", "Forces mTLS on external calls"], "a": 1, "e": "It turns egress into an allow-list, which is frequently the real security requirement behind a mesh. It also immediately breaks every undeclared external dependency, so it needs staging and an inventory first."}]}, {"title": "Identity, mTLS and policy", "sub": "Where workload identity comes from, what mTLS does and doesn't prove, and the three policy resources — including the one that will take your service down.", "body": "## Identity is the foundation\n\nEverything security-shaped in Istio rests on one idea: **a workload's identity comes from its Kubernetes ServiceAccount**, not its IP address, its namespace, or which network it sits on.\n\n[[fig:identity]]\n\nistiod acts as a certificate authority. When a proxy starts, it presents its pod's ServiceAccount token, istiod validates it against the Kubernetes API, and issues a short-lived X.509 certificate (24 hours by default, rotated automatically) carrying a SPIFFE identity:\n\n```text\nspiffe://cluster.local/ns/shop/sa/checkout\n```\n\nThat string is what every policy in this module matches on. Which means: **if all your workloads run under the `default` ServiceAccount, you have one identity and your policies cannot distinguish anything.** Giving each workload its own ServiceAccount is the unglamorous prerequisite for the entire security story, and it is the step most often skipped.\n\n## mTLS: what it does and doesn't prove\n\nEnabled, mesh traffic is mutually authenticated and encrypted, with both ends presenting certificates. That gives you two things a network policy cannot: encryption in transit that does not depend on application code, and cryptographic proof of *which workload* is calling.\n\nBe precise about the limits, because this is where security reviews go wrong:\n\n- It authenticates **workloads, not users**. `checkout` proving it is `checkout` says nothing about which customer's request it is carrying.\n- It covers **mesh traffic only**. A pod that is not enrolled, a port excluded from capture, or a `PASSTHROUGH` listener all sit outside it.\n- It is not a substitute for authorization. Proving who is calling is worthless if everyone is allowed to call everything.\n\n### PeerAuthentication\n\nControls whether mTLS is required.\n\n```yaml\napiVersion: security.istio.io/v1\nkind: PeerAuthentication\nmetadata: { name: default, namespace: shop }\nspec:\n  mtls: { mode: STRICT }\n```\n\n| Mode | Behaviour |\n| --- | --- |\n| `PERMISSIVE` | Accept both mTLS and plaintext. The default, and what makes incremental adoption possible |\n| `STRICT` | Reject plaintext. The end state you want |\n| `DISABLE` | No mTLS |\n\nThe migration path is the reason `PERMISSIVE` is the default: enrol workloads, confirm from telemetry that all traffic is actually mTLS, then flip to `STRICT`. Flipping first breaks every un-enrolled caller instantly.\n\n:::warn The classic mTLS deadlock\nA `DestinationRule` with `tls.mode: DISABLE` on the client side, against a server with `PeerAuthentication: STRICT`, gives you a `503 UF` and a genuinely confusing debugging session. The client sends plaintext, the server refuses it. When mTLS \"randomly\" stops working, look for a DestinationRule someone added for an unrelated reason.\n:::\n\n## AuthorizationPolicy\n\nThis is the resource that does the real work, and the one that causes the most self-inflicted outages.\n\n```yaml\napiVersion: security.istio.io/v1\nkind: AuthorizationPolicy\nmetadata: { name: payments-allow-checkout, namespace: shop }\nspec:\n  selector:\n    matchLabels: { app: payments }\n  action: ALLOW\n  rules:\n  - from:\n    - source:\n        principals: [\"cluster.local/ns/shop/sa/checkout\"]\n    to:\n    - operation:\n        methods: [\"POST\"]\n        paths: [\"/api/pay*\"]\n```\n\n[[widget:authz]]\n\nPlay with that widget until the behaviour is boring, because the rule underneath it is the important one:\n\n:::key The default flips\nWith no policy attached, a workload allows everything. The moment **any** ALLOW policy selects that workload, everything not explicitly matched is denied. So adding one narrow policy to permit `checkout` also silently blocks `reporting`, the health checker, and anything else you forgot.\n:::\n\nThe order of evaluation, in full: `CUSTOM` policies first, then any `DENY` policy that matches wins outright, then if any `ALLOW` policy selects the workload the request must match one of them. DENY beats ALLOW — always.\n\nA safe rollout sequence:\n\n1. Write the policy with `action: AUDIT` and watch the logs, or apply it to a canary workload only.\n2. Enumerate every legitimate caller — including probes, scrapers and batch jobs. This list is always longer than the design document says.\n3. Apply ALLOW to one workload, verify, then widen.\n4. Only then consider a namespace-wide default-deny.\n\n```yaml\n# namespace default-deny — powerful, and a good way to cause an incident if applied first\napiVersion: security.istio.io/v1\nkind: AuthorizationPolicy\nmetadata: { name: deny-all, namespace: shop }\nspec:\n  {}          # empty spec, ALLOW action, no rules = nothing is allowed\n```\n\n## End-user authentication\n\n`RequestAuthentication` validates JWTs. Note carefully what it does *not* do:\n\n```yaml\napiVersion: security.istio.io/v1\nkind: RequestAuthentication\nmetadata: { name: jwt-shop, namespace: shop }\nspec:\n  selector: { matchLabels: { app: storefront } }\n  jwtRules:\n  - issuer: \"https://auth.example.com\"\n    jwksUri: \"https://auth.example.com/.well-known/jwks.json\"\n```\n\nThis says: *if* a JWT is present, it must be valid, and its claims become available to authorization rules. A request with **no token at all still passes**. To actually require one you need a companion `AuthorizationPolicy`:\n\n```yaml\nspec:\n  selector: { matchLabels: { app: storefront } }\n  action: ALLOW\n  rules:\n  - from: [{ source: { requestPrincipals: [\"*\"] } }]\n```\n\nThat two-resource pattern catches almost everyone once. `RequestAuthentication` is authentication; requiring it is authorization.\n\nWhere to enforce it is a design decision worth arguing: at the gateway keeps token handling in one place but means internal traffic is trusted on workload identity alone; at each workload is defence in depth but multiplies JWKS fetches and config. Most estates do both — validate at the edge, and re-check claims on the services that genuinely need user context.\n\n:::lab Prove mTLS is actually on\n```bash\n# what does ztunnel/the proxy think the peer identity is?\nistioctl ztunnel-config workload -n shop            # ambient\nistioctl proxy-config secret deploy/checkout -n shop # sidecar: inspect the cert\n\n# is anything still plaintext? check the telemetry\nkubectl -n shop exec deploy/checkout -c istio-proxy -- \\\n  pilot-agent request GET stats | grep -E 'ssl.handshake|tls_inspector'\n```\nThen set `PeerAuthentication` to `STRICT` in the namespace and curl `payments` from a pod in a *different, unmeshed* namespace. The failure you get is what a real un-enrolled caller experiences — worth seeing once before you flip it in an environment that matters.\n:::", "quiz": [{"q": "Where does a workload's mesh identity come from?", "o": ["Its pod IP address", "Its Kubernetes ServiceAccount, encoded as a SPIFFE URI in a short-lived certificate", "Its namespace label", "A secret mounted by the operator"], "a": 1, "e": "istiod validates the pod's ServiceAccount token and issues a certificate carrying spiffe://cluster.local/ns/<ns>/sa/<name>. If every workload uses the `default` ServiceAccount, every workload has the same identity and policy cannot distinguish them."}, {"q": "You add one ALLOW AuthorizationPolicy permitting `checkout` to call `payments`. What happens to the reporting service that also calls payments?", "o": ["Nothing — it is unaffected", "It is now denied, because any ALLOW policy on a workload denies everything unmatched", "It is allowed if it uses mTLS", "It gets a 401"], "a": 1, "e": "The default flips from allow-all to deny-unless-matched the moment an ALLOW policy selects the workload. Enumerating every legitimate caller — including probes and batch jobs — before applying is the whole job."}, {"q": "A RequestAuthentication is applied to storefront. A request arrives with no JWT at all. What happens?", "o": ["It is rejected with 401", "It passes — RequestAuthentication only validates tokens that are present", "It is rejected with 403", "istiod issues a token"], "a": 1, "e": "RequestAuthentication validates a token if one exists. Requiring a token needs a companion AuthorizationPolicy matching `requestPrincipals: [\"*\"]`. This two-resource pattern catches nearly everyone once."}, {"q": "Both a DENY policy and an ALLOW policy match a request. What happens?", "o": ["ALLOW wins as the more specific rule", "DENY wins — deny is always evaluated first and is final", "The request is audited but permitted", "Behaviour is undefined"], "a": 1, "e": "Evaluation runs CUSTOM, then DENY, then ALLOW. A matching DENY ends it. This makes DENY policies a reliable emergency brake and a reliable way to break things you did not intend to."}, {"q": "Client-side DestinationRule sets tls.mode DISABLE; the server namespace has PeerAuthentication STRICT. What do you see?", "o": ["Traffic falls back to plaintext successfully", "503 UF — the client sends plaintext and the server refuses it", "A certificate error in the app logs", "mTLS is negotiated anyway"], "a": 1, "e": "This mismatch is one of the most common confusing failures in a mesh, because the DestinationRule was usually added for an unrelated reason (like load balancing) and nobody connects it to the outage."}, {"q": "Does mTLS between checkout and payments tell you which end user made the request?", "o": ["Yes, the certificate carries the user identity", "No — it authenticates workloads, not users; user identity needs a JWT or equivalent", "Only if PERMISSIVE mode is off", "Only with a waypoint proxy"], "a": 1, "e": "Workload identity and end-user identity are separate layers. Conflating them is a common security-review error: `checkout` proving it is `checkout` says nothing about whose request it is carrying."}]}, {"title": "Observability, honestly", "sub": "What the proxies give you for free, what they cannot give you, and the cardinality problem nobody mentions in the demo.", "body": "## The genuine win\n\nBecause a proxy sits on both ends of every call, you get consistent golden-signal metrics for every service without any application changes — request count, error rate, duration, and request/response sizes, labelled with source and destination workload, namespace, service account, response code and response flag.\n\nThat last label, `response_flags`, is the one worth learning. It is how the proxy tells you *why* something failed, and module 9 is largely built on it.\n\nThe value here is uniformity rather than novelty. Your Java services probably already emit metrics; so do your Go ones, differently, with different names and different histogram buckets. The mesh gives you one set of dimensions across all of them, produced by something the application team cannot accidentally break.\n\n## The three signals, and their asterisks\n\n### Metrics\n\nEmitted by every proxy, scraped by Prometheus. In sidecar mode you get HTTP-level metrics for all mesh traffic by default. **In ambient mode without a waypoint you get L4/TCP metrics only** — connection counts and bytes, not request rates and status codes. Detailed HTTP telemetry comes from waypoints.\n\nThat is not a footnote. If a team enrols a namespace in ambient and then asks why their per-endpoint dashboards are empty, this is the answer, and the fix is a waypoint (with its extra hop) rather than a config flag.\n\n### Access logs\n\nOff by default in some profiles, on in `demo`. Turn them on deliberately — they are the highest-value signal during an incident and a meaningful cost at volume.\n\n```yaml\napiVersion: telemetry.istio.io/v1\nkind: Telemetry\nmetadata: { name: mesh-logging, namespace: istio-system }\nspec:\n  accessLogging:\n  - providers: [{ name: envoy }]\n```\n\nA line looks roughly like this, and the fields that matter are the response code and the flag right after it:\n\n```text\n[2026-09-10T04:12:55.912Z] \"POST /api/pay/card HTTP/1.1\" 503 UF\n  upstream_reset_before_response_started{connection_failure} - 142 0 3\n  \"-\" \"curl/8.4.0\" \"9f2c...\" \"payments:8080\" \"10.244.1.7:8080\"\n```\n\n### Traces\n\nHere is the part people get wrong. The mesh generates spans, but **it cannot stitch them into a trace unless your application propagates the trace headers**. A proxy sees an inbound request and an outbound request and has no way to know they are the same logical operation — that is in-process context the application holds.\n\nSo distributed tracing through a mesh requires application changes: propagate `traceparent` (W3C) or the `x-b3-*` headers from every inbound request to every outbound one. In Spring Boot that is Micrometer Tracing doing it for you; in other stacks it may be manual.\n\n:::myth \"Install the mesh and get distributed tracing for free\"\nYou get spans for free. You get *traces* only if headers propagate. A mesh with no propagation gives you a pile of disconnected single-span traces, which looks like tracing on a dashboard and is useless in an incident.\n:::\n\nSampling defaults are low for a reason. Set it deliberately:\n\n```yaml\nspec:\n  tracing:\n  - providers: [{ name: otel }]\n    randomSamplingPercentage: 1.0\n```\n\n## Kiali and the topology map\n\nKiali builds a live service graph from the mesh's metrics — who calls whom, at what rate, with what error percentage. It is the single best artefact for a conversation with people who do not read YAML, and it makes the case for a mesh better than any slide.\n\nTwo cautions worth carrying:\n\n- It shows **observed** traffic. A dependency that only fires monthly is invisible, so the graph is not an architecture document.\n- It reflects the same asterisk as above: an ambient namespace without waypoints produces a coarser graph.\n\n## The cardinality problem\n\nIstio's standard metrics carry a lot of labels. Multiply source workload × destination workload × response code × response flag × path-ish dimensions, and in a large estate the time series count grows uncomfortably fast. Teams discover this when their Prometheus falls over, usually about three months after adoption.\n\nMitigations, in the order most people apply them:\n\n- Drop labels you do not query, using a `Telemetry` resource to customise metric dimensions.\n- Do not add request path as a dimension unless you have bounded it — an unbounded path label from a REST API with IDs in the URL is the classic cardinality bomb.\n- Scrape at a sensible interval and keep high-resolution retention short.\n- Federate or use a remote-write store rather than a single Prometheus for a large mesh.\n\nBudget for this in the adoption plan rather than treating it as an operational surprise. \"The mesh made our monitoring bill go up\" is a fair criticism that better planning avoids.\n\n## What the mesh still cannot tell you\n\nUseful to say out loud in a design review, because it sets expectations:\n\n- **Why** a request was slow inside the application. The proxy sees duration, not what the JVM was doing.\n- Anything about work that does not cross the network — queue consumers doing local processing, batch jobs.\n- Business-level outcomes. Payment declined versus payment succeeded is both `HTTP 200` to the mesh.\n- Message-broker semantics. Traffic to Kafka looks like long-lived TCP connections; the mesh sees bytes on a connection, not produce and consume operations, consumer lag or partition assignment. If your estate is event-driven, the mesh's observability story covers a smaller share of your traffic than the demo suggests.\n\nThat last one is worth weighing honestly. A mesh's telemetry value is proportional to how much of your traffic is synchronous request/response.", "quiz": [{"q": "An ambient namespace has no waypoint. A team asks why their HTTP error-rate dashboard is empty. Why?", "o": ["Prometheus is misconfigured", "ztunnel emits L4/TCP telemetry; HTTP-level metrics require a waypoint proxy", "Access logging is disabled", "Ambient does not support Prometheus"], "a": 1, "e": "The L4/L7 split in ambient applies to telemetry as much as to policy. Getting HTTP metrics means deploying a waypoint for that service and accepting the extra hop."}, {"q": "You install the mesh and expect distributed tracing. Spans appear but every trace has one span. Why?", "o": ["Sampling is set to 0", "The application is not propagating trace headers between inbound and outbound requests", "Traces need a waypoint", "istiod is out of sync"], "a": 1, "e": "A proxy cannot know that an inbound and an outbound request belong to the same logical operation — only the application holds that context. Propagating traceparent or x-b3-* headers is an application change the mesh cannot do for you."}, {"q": "Which Envoy access log field tells you which hop failed?", "o": ["The user agent", "The response flag (UC, UF, NR, UO and similar)", "The request ID", "The bytes sent"], "a": 1, "e": "The response flag is the mesh's most useful debugging output. It distinguishes an upstream connection failure from a missing route from your own circuit breaker tripping."}, {"q": "What is the most common cause of Prometheus falling over after mesh adoption?", "o": ["Too many nodes", "Metric cardinality — high-dimension labels multiplied across every service pair", "Access logs", "Kiali"], "a": 1, "e": "Source × destination × code × flag × any path-like label produces a lot of series. Trimming dimensions with a Telemetry resource and never adding unbounded path labels is the fix, and it belongs in the adoption plan."}, {"q": "Your estate is heavily Kafka-based. How much observability value does the mesh add?", "o": ["The same as for HTTP services", "Less — broker traffic looks like long-lived TCP connections, so you get bytes on a connection, not produce/consume semantics or lag", "More, because Kafka is TCP", "None at all"], "a": 1, "e": "Mesh telemetry value is proportional to how much traffic is synchronous request/response. This is a fair thing to raise when someone claims a mesh will give an event-driven estate full observability."}]}, {"title": "When it breaks", "sub": "A triage method, the response flags worth memorising, and the five failures that account for most mesh incidents.", "body": "## A method, before the specifics\n\nA mesh adds two proxies to every call, so \"the service returned 503\" now has several possible authors. Work in this order and you will rarely get lost:\n\n1. **Is the config even there?** `istioctl proxy-status` — is every proxy synced with istiod? An out-of-sync proxy means your YAML never arrived, and no amount of staring at the YAML will help.\n2. **Does the config say what I think?** `istioctl analyze` catches a surprising number of mistakes statically. Then `istioctl proxy-config route|cluster|endpoint` dumps what the proxy actually holds.\n3. **Which hop failed?** Read the response flag in the access log.\n4. **Was it the app or the mesh?** Bypass the proxy and see if the symptom persists.\n\n[[fig:failpoints]]\n\n## The response flags\n\n[[widget:triage]]\n\nClick through all five. These cover the large majority of what you will actually meet, and knowing the flag turns a vague outage into a specific question.\n\nThe most valuable habit here is small: when someone reports \"we're getting 503s\", your first question is \"which flag?\" If they do not know, that is the next thing to find out, not something to guess around.\n\n## Failure one: the config never arrived\n\n```bash\nistioctl proxy-status\n# NAME                    CDS      LDS      EDS      RDS\n# checkout-7d9.shop       SYNCED   SYNCED   SYNCED   STALE\n```\n\n`STALE` or `NOT SENT` means istiod has not successfully pushed. Causes are usually istiod under CPU pressure in a large cluster, a proxy that lost its connection, or a config so invalid it failed to compile. Check istiod's logs before touching anything else.\n\n## Failure two: the port name\n\nCovered in module 2 and worth repeating because it keeps happening. A Service port named `backend` rather than `http-backend` gets TCP treatment. Symptoms: HTTP metrics missing, path-based routing silently ignored, retries not applying. Nothing errors — it just quietly does less than you asked.\n\n```bash\nistioctl analyze -n shop     # will usually flag this for you\n```\n\n## Failure three: mTLS mismatch\n\nA `DestinationRule` disabling TLS against a `STRICT` `PeerAuthentication`, giving `503 UF`. The reason it is hard is that the DestinationRule was usually added months earlier by someone doing load balancing, and nothing connects the two in anyone's head.\n\n```bash\n# what does the client proxy think about TLS to this destination?\nistioctl proxy-config cluster deploy/checkout -n shop \\\n  --fqdn payments.shop.svc.cluster.local -o json | grep -A5 transportSocket\n```\n\n## Failure four: an AuthorizationPolicy you forgot\n\nSymptom: `403 RBAC: access denied` from a service that worked yesterday. Cause: someone added an ALLOW policy elsewhere that selects the workload, flipping its default to deny.\n\n```bash\nkubectl get authorizationpolicy -A\nistioctl analyze -n shop\n# turn on RBAC debug logging on the receiving proxy\nistioctl proxy-config log deploy/payments -n shop --level rbac:debug\nkubectl logs deploy/payments -n shop -c istio-proxy | grep -i rbac\n```\n\nThat last pair is the fastest route to \"which rule denied this and why\", and few people know it exists.\n\n## Failure five: it was never the mesh\n\nAlways worth eliminating early, and it takes thirty seconds:\n\n```bash\n# talk to the pod IP directly, bypassing Service routing and much of the mesh path\nkubectl -n shop exec deploy/checkout -c checkout -- \\\n  curl -s -o /dev/null -w \"%{http_code}\\n\" http://10.244.1.7:8080/health\n```\n\nIf it fails there too, stop debugging Istio. A meaningful share of \"the mesh broke it\" incidents are an application regression, a missing environment variable, or a readiness probe that was always wrong and only now has a proxy to blame.\n\n:::key The command that answers most questions\n`istioctl proxy-config` with `route`, `cluster`, `endpoint`, `listener` and `secret`. It reads live state out of a running proxy rather than telling you what your YAML meant. When what you configured and what is happening disagree, this is the referee.\n:::\n\n## Two habits worth building\n\n**Run `istioctl analyze` in CI.** It catches conflicting VirtualServices, unnamed ports, references to nonexistent hosts and policies with no effect — before they reach a cluster. It is cheap and it removes a whole class of incident.\n\n**Keep a known-good debug pod.** A tiny image with `curl`, `dig` and `openssl` that you can drop into any namespace, both meshed and unmeshed. Comparing behaviour from inside and outside the mesh is the single most informative test you can run, and hunting for a shell during an incident wastes the minutes that matter.\n\n:::lab Break it on purpose\nWork through each of these and watch what the flag tells you. Doing it deliberately once is worth more than reading about it three times.\n```bash\n# 1. no route: point a VirtualService at a host that does not exist\nkubectl -n shop patch virtualservice checkout --type=json -p= \\\n  '[{\"op\":\"replace\",\"path\":\"/spec/http/1/route/0/destination/host\",\"value\":\"ghost\"}]'\n\n# 2. circuit break yourself: maxConnections 1, then send concurrent load\n# 3. lock yourself out: apply an ALLOW policy that matches nothing\nkubectl -n shop apply -f - <<'EOF'\napiVersion: security.istio.io/v1\nkind: AuthorizationPolicy\nmetadata: { name: oops, namespace: shop }\nspec:\n  selector: { matchLabels: { app: payments } }\n  action: ALLOW\n  rules:\n  - from: [{ source: { principals: [\"cluster.local/ns/nowhere/sa/nobody\"] } }]\nEOF\n\n# then, each time:\nistioctl analyze -n shop\nkubectl logs deploy/checkout -n shop -c istio-proxy --tail=20\n```\n:::", "quiz": [{"q": "A team reports intermittent 503s. What is your first question?", "o": ["Which Istio version are you on?", "Which response flag is in the access log?", "Have you restarted the pods?", "Is mTLS enabled?"], "a": 1, "e": "The flag names the hop and the cause. UC, UF, NR and UO point at four completely different investigations, and guessing between them wastes the first hour of an incident."}, {"q": "`istioctl proxy-status` shows RDS as STALE for one workload. What does that mean?", "o": ["The VirtualService YAML is invalid", "That proxy has not received the current route config from istiod", "mTLS handshake failed", "The pod is not injected"], "a": 1, "e": "It is a delivery problem, not a content problem. Check istiod health and logs — often CPU pressure in a large cluster or a broken xDS connection — before re-reading your YAML."}, {"q": "A service starts returning `403 RBAC: access denied` with no change to its own config. Most likely cause?", "o": ["Certificate expiry", "Someone applied an ALLOW AuthorizationPolicy that selects this workload, flipping its default to deny", "Outlier detection", "A stale DestinationRule"], "a": 1, "e": "An ALLOW policy anywhere that selects the workload changes its default from allow-all to deny-unless-matched. Enabling `rbac:debug` on the receiving proxy shows exactly which rule decided."}, {"q": "Which command shows what a running proxy actually holds, rather than what you configured?", "o": ["kubectl describe virtualservice", "istioctl proxy-config route|cluster|endpoint", "istioctl profile dump", "kubectl get events"], "a": 1, "e": "`proxy-config` reads live state out of the Envoy instance. When intent and behaviour disagree it is the referee, and it is the difference between debugging by reasoning and debugging by evidence."}, {"q": "Why curl a pod IP directly early in an investigation?", "o": ["It is faster than a Service call", "It eliminates the mesh as the cause — a surprising share of 'mesh' incidents are application regressions", "It refreshes the endpoint list", "It forces a config push"], "a": 1, "e": "Thirty seconds spent proving the app itself is healthy saves an hour of debugging a mesh that was working fine."}]}, {"title": "What owning it costs", "sub": "Upgrades, the support window, resource footprint, multi-cluster, and the operating model you are signing up for.", "body": "## The commitment nobody costs properly\n\nIstio ships a minor release roughly every three to four months, and a minor is supported until about six weeks after N+2 arrives. Do the arithmetic: **you have roughly six to nine months on any given version before you are unsupported and unpatched.** That is not a background task; it is a recurring, scheduled piece of platform work with a coordination cost across application teams.\n\nThe two failure modes are symmetrical. Fall behind and you are running an unsupported version with no security patches, on a component that carries CVEs regularly (Envoy CVEs flow into Istio patch releases). Upgrade too eagerly and you meet bugs that have not been shaken out yet. A reasonable posture: track N-1, upgrade on a schedule, and take patch releases promptly.\n\n:::key The question to ask before adoption\nNot \"can we install this?\" but \"who upgrades this every quarter for the next five years, and what happens when they leave?\" If there is no answer, the honest recommendation is to stay with a gateway-only deployment.\n:::\n\n## Upgrading without an outage\n\n**Canary control plane upgrades** are the supported approach, and they are why revisions matter from day one:\n\n```bash\n# 1. install the new control plane alongside the old\nistioctl install --set revision=1-31-0 --set profile=default\n\n# 2. move one namespace to the new revision\nkubectl label ns shop istio.io/rev=1-31-0 --overwrite\nkubectl rollout restart deployment -n shop     # sidecar mode only\n\n# 3. verify, then move the rest, then remove the old control plane\nistioctl uninstall --revision=1-30-3\n```\n\nRevision tags make this cleaner: namespaces point at a stable tag like `prod`, and you move the tag rather than relabelling every namespace.\n\nThis is also where the two data plane modes differ most in operational cost. In sidecar mode, step 2 means a rolling restart of every application pod — a coordination exercise with every team, every cycle. In ambient, ztunnel upgrades roll as a DaemonSet update and waypoints upgrade independently, with application pods untouched.\n\nAlways read the upgrade notes for behavioural changes, not just version numbers. Defaults do change between minors, and a default that changes underneath you is harder to spot than a breaking API.\n\n## Resource footprint\n\nRough planning figures, worth validating against your own workload rather than trusting anyone's table:\n\n| Component | Typical ask |\n| --- | --- |\n| Sidecar proxy | ~50–100MB memory, 10–50m CPU per pod at modest traffic, scaling with connections and config size |\n| ztunnel | One per node; smaller per-workload cost, and it does not scale with pod count |\n| Waypoint | A full Envoy per namespace or service you opt in |\n| istiod | Scales with rate of change, not just size; CPU-hungry in busy clusters |\n\nThe sidecar figure is the one that surprises finance. A thousand pods is a thousand proxies — real memory, on every node, permanently. That arithmetic is the origin story of ambient mode.\n\nFor istiod, the lever is reducing how much config each proxy is told about. In sidecar mode a `Sidecar` resource scopes a namespace's visibility to only the services it actually calls:\n\n```yaml\napiVersion: networking.istio.io/v1\nkind: Sidecar\nmetadata: { name: default, namespace: shop }\nspec:\n  egress:\n  - hosts:\n    - \"./*\"                  # everything in my own namespace\n    - \"istio-system/*\"\n    - \"payments-ns/payments.payments-ns.svc.cluster.local\"\n```\n\nWithout this, every proxy in a large cluster holds config for every service in it. This is a real scaling lever and one of the more common causes of bloated proxy memory.\n\n## Multi-cluster, briefly\n\nThere are two axes: one network or several, one control plane or several. The combinations give you primary-remote, multi-primary, and various network topologies with east-west gateways between clusters.\n\nThe short version for a design review: it works, it is well-documented, and it roughly doubles the operational complexity. Cross-cluster service discovery, trust domain federation and failover behaviour all become things you own and must test. Multi-cluster is also one of the areas where sidecar support has historically been ahead of ambient, so check the current state against your specific topology rather than assuming parity.\n\nDo not adopt multi-cluster mesh because it appears on a slide. Adopt it when you have a concrete requirement — regional failover with in-flight session continuity, or genuine cross-cluster service consumption — that a gateway between clusters cannot satisfy.\n\n## Non-Kubernetes workloads\n\nIstio can mesh VMs. It works, and it is more effort than it looks: an agent on the host, identity bootstrapping without a Kubernetes ServiceAccount to lean on, and a health-checking story that is yours to maintain.\n\nFor a bank or telco with a large legacy estate, be realistic. Meshing a mainframe-adjacent VM fleet is a programme, not a sprint. Frequently the better answer is a gateway at the boundary and `ServiceEntry` declarations, accepting that those endpoints sit outside the mesh's guarantees and documenting that clearly.\n\n## An operating model checklist\n\nBefore a mesh goes to production, these should have named owners:\n\n- Who owns the control plane, and who is on call for it\n- The upgrade calendar, and how application teams are notified of restart windows\n- Who can create `AuthorizationPolicy`, and what review gate applies — this is the resource with the widest blast radius\n- Where mesh config lives in Git, and how it gets to the cluster\n- Metric retention and cardinality budget\n- The documented list of exclusions: unmeshed workloads, excluded ports, passthrough listeners\n- How a developer debugs a 503 without a platform engineer — because if they cannot, every incident escalates to one team", "quiz": [{"q": "Roughly how long is a given Istio minor version supported?", "o": ["Three years", "Until about six weeks after N+2 ships — so roughly six to nine months", "Indefinitely with patches", "Twelve months minimum"], "a": 1, "e": "Minors land quarterly and support ends shortly after N+2. Adoption is a standing commitment to upgrade, not a one-time install."}, {"q": "What is a canary control plane upgrade?", "o": ["Sending 10% of traffic to a new service version", "Installing a new istiod revision alongside the old one and moving namespaces across gradually", "Upgrading one node at a time", "Running two clusters"], "a": 1, "e": "Revisions let two control planes coexist so you move namespace by namespace and can roll back by relabelling. Setting up revisions after the fact is far more painful than doing it at install."}, {"q": "What does a `Sidecar` resource with a scoped egress list buy you?", "o": ["It enables mTLS", "It limits which services each proxy is configured for, cutting proxy memory and istiod push load", "It creates a sidecar container", "It restricts ingress"], "a": 1, "e": "By default every proxy holds config for every service in the cluster. Scoping visibility is one of the main levers for large-cluster scaling and bloated proxy memory."}, {"q": "Why is the sidecar resource footprint the origin of ambient mode?", "o": ["Sidecars cannot do mTLS", "Proxy cost scales with pod count — a thousand pods means a thousand proxies, permanently", "Sidecars are slower than ztunnel", "Sidecars require more nodes"], "a": 1, "e": "Ambient moves the L4 proxy to one shared instance per node, so cost tracks node count rather than pod count, and adds full Envoy only where L7 is genuinely needed."}, {"q": "Which resource most deserves a review gate before anyone can apply it?", "o": ["Telemetry", "AuthorizationPolicy — an ALLOW policy silently flips a workload's default to deny", "ServiceEntry", "Gateway"], "a": 1, "e": "It has the widest blast radius and the least obvious behaviour. A single well-meant policy can deny every unenumerated caller of a workload the moment it lands."}]}, {"title": "Judgement", "sub": "When not to use Istio, what the alternatives actually give you, and how to argue either side of the decision credibly.", "body": "## Argue against it first\n\nThe most useful thing you can do in an adoption conversation is make the case against, properly, before anyone commits. If the case survives, the decision is sound. If it does not, you have saved a lot of money.\n\n**\"We want mTLS between services.\"** Reasonable, and a mesh delivers it well. But ask what threat is being addressed. If it is an audit requirement satisfied by encryption in transit, and your services are few and homogeneous, application-level TLS or a CNI with transparent encryption may meet it at a fraction of the operating cost. If the requirement is workload identity and per-service authorization, the mesh case is much stronger — that is hard to build any other way.\n\n**\"We want observability.\"** Ask what fraction of traffic is synchronous HTTP or gRPC. In a heavily event-driven estate, the mesh sees your Kafka traffic as long-lived TCP connections — bytes on a wire, not produce and consume operations or consumer lag. The observability win is proportional to the request/response share, and that number is often much lower than assumed.\n\n**\"We want canary releases.\"** A progressive delivery tool (Argo Rollouts, Flagger) can drive this, and both can drive Istio *or* a plain ingress controller. If canary is the only requirement, a mesh is a large piece of infrastructure to buy for one feature.\n\n**\"Everyone else is doing it.\"** In a large enterprise this is sometimes a real argument — hiring, vendor support, the ability to buy expertise. Say so explicitly rather than dressing it as a technical case, because stated honestly it can be legitimate, and disguised it corrodes trust in the rest of the argument.\n\n[[widget:needmesh]]\n\n## When the case is genuinely strong\n\n- Dozens of services, several languages, and a real need for uniform policy that no single team can enforce in code.\n- A regulatory requirement for encryption in transit and authenticated service-to-service calls, where \"it's in the code\" is not an acceptable answer to an auditor.\n- Egress control — every external destination declared and enforced. `REGISTRY_ONLY` plus `ServiceEntry` is a capability that is genuinely hard to replicate.\n- A platform team that already owns Kubernetes and can absorb another component into an existing operating model.\n\n## The alternatives, fairly\n\n| | Istio | Linkerd | Cilium mesh | Gateway only |\n| --- | --- | --- | --- | --- |\n| Data plane | Envoy (or ztunnel in ambient) | Its own Rust micro-proxy | eBPF in the kernel, Envoy for L7 | One Envoy at the edge |\n| Feature surface | Largest by a distance | Deliberately small | Strong L3/L4, L7 via Envoy | North-south only |\n| Learning cost | High | Low | Medium, plus eBPF and CNI knowledge | Low |\n| Best when | You need the full policy and routing surface | You want mTLS and golden signals with minimal operational load | You already run Cilium as your CNI | You only have a north-south problem |\n| Watch out | Feature surface is also failure surface | You will eventually want something it does not do | Couples mesh choice to CNI choice | No east-west identity or policy at all |\n\nLinkerd deserves more consideration than it usually gets. If the requirement is genuinely \"mTLS plus golden signals plus retries\", it does that with substantially less to learn and less to operate. The argument for Istio is the breadth — and breadth is only worth paying for if you will use it.\n\nThe last column matters most for readers whose organisation is already running Istio as ingress. There is a coherent, defensible position that says: *we use Istio at the edge, we do not mesh, and our east-west controls are network policy plus application-level TLS.* That is not a failure to adopt properly. It is a smaller surface with fewer things to break, and it should be argued on its merits rather than treated as a half-finished migration.\n\n## Adoption sequence that works\n\nIf the decision is yes, the order below reduces risk far more than any amount of upfront design:\n\n1. **Gateway first.** Ingress only, no workloads meshed. Learn Envoy behaviour, get the observability stack running, build the operational muscle where the blast radius is a single component.\n2. **One namespace, ambient, L4 only.** Encryption and identity, no restarts, no L7. Low risk, real benefit, and it produces the topology map that makes the case internally.\n3. **PERMISSIVE, then measure, then STRICT.** Prove from telemetry that all traffic is mTLS before requiring it. Never the other way round.\n4. **Waypoints where L7 is needed.** Service by service, with a stated reason each time. Each one is a hop and a cost.\n5. **Authorization last, and narrowly.** Start with the highest-value workload — the one holding money or personal data — and enumerate every caller before you apply anything.\n\nNote what is not in that list: a big-bang migration, a mesh-everything mandate, or `STRICT` on day one. Each of those has a well-populated graveyard.\n\n:::key If you take one thing into a design review\nBe the person who separates the three conversations — gateway, mesh, and mode — and who asks who owns the upgrade. Those two moves are worth more than knowing every field in a `VirtualService`.\n:::", "quiz": [{"q": "An estate is mostly Kafka-based with a handful of HTTP services. Someone proposes a mesh for observability. What is the honest response?", "o": ["Ideal fit — meshes excel at Kafka", "Mesh telemetry value tracks the share of synchronous request/response traffic; broker traffic appears as long-lived TCP", "Meshes cannot handle Kafka at all", "Only ambient mode supports Kafka"], "a": 1, "e": "Istio will carry the traffic fine, but it sees bytes on a connection rather than produce/consume semantics, consumer lag or partition assignment. The observability case is much weaker than the demo implies."}, {"q": "The only stated requirement is canary releases. Why is a mesh a questionable answer?", "o": ["Meshes cannot do canary releases", "It is a very large piece of infrastructure to own for one feature that progressive delivery tools can drive against a plain ingress controller", "Canary requires ambient mode", "Canary needs Gateway API"], "a": 1, "e": "Argo Rollouts or Flagger can drive progressive delivery with or without a mesh. Buying a mesh for a single capability means paying the full operational cost for a narrow benefit."}, {"q": "When is Linkerd the better recommendation?", "o": ["When you need ServiceEntry and egress control", "When the requirement is mTLS, golden signals and retries, and operational simplicity is valued over feature breadth", "When you run on VMs", "When you need multi-cluster"], "a": 1, "e": "Linkerd is deliberately smaller. Istio's advantage is breadth of policy and routing surface, and breadth is only worth its learning and operating cost if you will actually use it."}, {"q": "What is the correct first step in a low-risk adoption sequence?", "o": ["Enable STRICT mTLS mesh-wide", "Deploy as an ingress gateway only, with nothing meshed", "Apply a namespace default-deny", "Enrol every namespace in ambient"], "a": 1, "e": "Gateway-first gets you Envoy experience and an observability stack with a single-component blast radius. Meshing workloads comes after, one namespace at a time."}, {"q": "An organisation runs Istio as ingress and has deliberately never meshed anything. How should that be characterised?", "o": ["An incomplete migration that should be finished", "A coherent position with a smaller operational surface, to be judged on its merits", "A misconfiguration", "Only valid with Gateway API"], "a": 1, "e": "Gateway-only is a legitimate architecture, not a half-done one. It should be argued against the actual east-west requirements rather than assumed to be a stalled adoption."}]}, {"title": "Atlas", "sub": "Every resource, command and failure mode in one place — the page to keep open during a design review.", "body": "## The course in twelve sentences\n\n1. A mesh moves network concerns — retries, timeouts, encryption, identity, telemetry — out of application code and into proxies the platform controls.\n2. Istio's data plane is Envoy; its control plane is istiod, which compiles your YAML into Envoy config and issues workload certificates, and which is never in the request path.\n3. An Istio ingress gateway is a standalone Envoy for north-south traffic and works with no mesh at all — sidecar and ambient are modes of the *mesh*, not the gateway.\n4. Sidecar mode puts a full Envoy in every pod; ambient mode puts a shared L4 ztunnel on every node and adds L7 waypoints only where you ask for them.\n5. Istio recommends new users start with ambient, and most of the project's energy is going there, while sidecar remains fully supported and still wins for L7-everywhere and some advanced cases.\n6. Gateway API is where Istio's traffic management is heading, but fault injection, circuit breaking and subset mirroring still live in `VirtualService` and `DestinationRule`.\n7. `VirtualService` decides where a request goes; `DestinationRule` decides how the destination is treated; rules match top-down and the first match wins.\n8. Workload identity comes from the Kubernetes ServiceAccount as a SPIFFE URI, which is why per-workload ServiceAccounts are a prerequisite for any useful policy.\n9. Any ALLOW `AuthorizationPolicy` selecting a workload flips its default to deny-unless-matched — the widest blast radius in the product.\n10. The mesh gives you uniform golden signals for free, but traces require the application to propagate headers, and ambient without a waypoint gives L4 telemetry only.\n11. Debugging is a sequence: is the proxy synced, does its config say what you think, which response flag fired, and would it fail without the mesh anyway.\n12. Adoption is a standing commitment — quarterly minors, roughly six to nine months of support per version — so the decisive question is who owns the upgrade, not whether you can install it.\n\n---\n\n## Resource atlas\n\n| Resource | API | Answers |\n| --- | --- | --- |\n| `Gateway` (Istio) | networking.istio.io | What does the edge proxy listen on? Configures an existing deployment |\n| `Gateway` (K8s) | gateway.networking.k8s.io | Same, portable, and provisions the proxy for you |\n| `VirtualService` | networking.istio.io | Where does a matching request go? Timeouts, retries, mirroring, faults |\n| `HTTPRoute` | gateway.networking.k8s.io | Gateway API's routing, without the Istio-only extras |\n| `DestinationRule` | networking.istio.io | Subsets, load balancing, connection pools, outlier detection, client TLS |\n| `ServiceEntry` | networking.istio.io | Bring an external or non-Kubernetes endpoint into the registry |\n| `Sidecar` | networking.istio.io | Scope which services a proxy is configured for — a scaling lever |\n| `PeerAuthentication` | security.istio.io | Is mTLS required? STRICT / PERMISSIVE / DISABLE |\n| `RequestAuthentication` | security.istio.io | Validate a JWT if present — does not require one |\n| `AuthorizationPolicy` | security.istio.io | Who may call what. ALLOW / DENY / AUDIT / CUSTOM |\n| `Telemetry` | telemetry.istio.io | Access logs, tracing providers, metric dimensions |\n| `WasmPlugin` / `EnvoyFilter` | extensions / networking | Escape hatches. `EnvoyFilter` is unversioned Envoy config — powerful, and it breaks across upgrades |\n\n## Command atlas\n\n```bash\n# state of the world\nistioctl proxy-status                     # is every proxy in sync with istiod?\nistioctl analyze -n shop                  # static analysis; run this in CI\nistioctl version                          # control plane and data plane versions\n\n# what a live proxy actually holds\nistioctl proxy-config listener deploy/checkout -n shop\nistioctl proxy-config route    deploy/checkout -n shop\nistioctl proxy-config cluster  deploy/checkout -n shop --fqdn payments.shop.svc.cluster.local\nistioctl proxy-config endpoint deploy/checkout -n shop\nistioctl proxy-config secret   deploy/checkout -n shop      # certificates\nistioctl proxy-config log      deploy/checkout -n shop --level rbac:debug\n\n# ambient\nistioctl ztunnel-config workload -n shop\nistioctl waypoint apply -n shop --name shop-waypoint\nistioctl waypoint list -n shop\n\n# enrolment\nkubectl label ns shop istio.io/dataplane-mode=ambient      # ambient, no restart\nkubectl label ns shop istio-injection=enabled              # sidecar, then restart\nkubectl rollout restart deployment -n shop\n\n# raw Envoy stats from inside a pod\nkubectl exec deploy/checkout -c istio-proxy -- pilot-agent request GET stats | grep overflow\n```\n\n## Failure atlas\n\n| Symptom | Usual cause | First move |\n| --- | --- | --- |\n| `503 UC` | App closed a connection the proxy was using; keep-alive shorter than the proxy's idle timeout | Raise app keep-alive above 60s |\n| `503 UF` | Cannot connect: wrong port, no endpoints, or mTLS mismatch | Check endpoints, then DestinationRule TLS vs PeerAuthentication |\n| `503 UO` | Your own circuit breaker tripped | Check `connectionPool` limits and overflow stats |\n| `404 NR` | No matching route — host or gateway binding wrong | `proxy-config route` on the gateway |\n| `403 RBAC` | An ALLOW policy selects the workload and this caller is not matched | `--level rbac:debug`, read which rule denied |\n| Metrics missing | Unnamed port, or ambient with no waypoint | `istioctl analyze`; check the Service port name |\n| Single-span traces | App is not propagating trace headers | Application change, not a mesh setting |\n| Nothing meshed after labelling | Sidecar injection needs a pod restart | `kubectl rollout restart` |\n| Config not applying | Proxy STALE or NOT SENT | `proxy-status`, then istiod logs |\n\n## Vocabulary\n\n**HBONE** — HTTP-Based Overlay Network Environment. mTLS inside an HTTP CONNECT tunnel on port 15008, used between ztunnels in ambient mode.\n**ztunnel** — the per-node L4 DaemonSet in ambient mode. Rust, not Envoy.\n**Waypoint** — an opt-in Envoy providing L7 for a namespace or service in ambient mode.\n**xDS** — the gRPC API family istiod uses to push listeners, routes, clusters and endpoints to proxies.\n**SPIFFE** — the identity format Istio uses: `spiffe://cluster.local/ns/<ns>/sa/<serviceaccount>`.\n**Response flag** — the short code in an access log naming which hop failed and why.\n**Revision / revision tag** — parallel control plane versions, and the stable alias that lets you move namespaces between them.\n**North-south / east-west** — traffic entering the cluster versus traffic between services inside it.\n\n## Where to go next\n\nThe primary sources worth using over any blog post, including this one: `istio.io/latest/docs/overview/dataplane-modes/` for the sidecar-versus-ambient framing, the release notes at `istio.io/latest/news/` for what changed and which CVEs were patched, and the Envoy documentation for anything about response flags and proxy internals. When something here disagrees with those, they win — this course was written against 1.31 and Istio moves quarterly.", "quiz": [{"q": "What is HBONE?", "o": ["Istio's certificate format", "mTLS carried inside an HTTP CONNECT tunnel on port 15008, used between ztunnels", "A load balancing algorithm", "The gateway API implementation"], "a": 1, "e": "It is the ambient mode transport between node proxies, carrying identity and encryption without requiring an Envoy in every pod."}, {"q": "Which resource is the escape hatch that most reliably breaks on upgrade?", "o": ["Telemetry", "EnvoyFilter — unversioned raw Envoy config", "ServiceEntry", "PeerAuthentication"], "a": 1, "e": "EnvoyFilter patches Envoy configuration directly, so it is coupled to Envoy internals that change between releases. Powerful, occasionally necessary, and the first thing to check when an upgrade breaks something strange."}, {"q": "HTTP metrics are missing for one service. What are the two things to check first?", "o": ["istiod logs and node capacity", "The Service port name, and whether an ambient namespace has a waypoint", "Certificate expiry and DNS", "Retry settings and timeouts"], "a": 1, "e": "An unrecognised port name gets TCP treatment, and ambient without a waypoint emits L4 telemetry only. Both produce the same symptom from completely different causes."}, {"q": "What single question best separates a sound Istio adoption from an unsound one?", "o": ["Which version are we installing?", "Who owns the quarterly upgrade for the next five years?", "Ambient or sidecar?", "Gateway API or classic?"], "a": 1, "e": "Installation is easy and reversible; the standing operational commitment is neither. With no named owner for upgrades, a gateway-only deployment is the more honest recommendation."}]}];

<script>
/* ============ storage ============ */
const KEY='istio-course-v1';
let S={done:[],lab:true,theme:null,last:0};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ============ tiny markup parser ============ */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(t){
  return esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
}
function hi(code,lang){
  let c=esc(code);
  if(lang==='yaml'){
    c=c.replace(/^(\s*)([A-Za-z0-9_.\-]+)(:)/gm,'$1<span class="k">$2</span>$3')
       .replace(/(#.*)$/gm,'<span class="c">$1</span>');
  }else if(lang==='bash'||lang==='sh'){
    c=c.replace(/(#.*)$/gm,'<span class="c">$1</span>')
       .replace(/\b(kubectl|istioctl|helm|curl|kind|export|watch)\b/g,'<span class="k">$1</span>');
  }else if(lang==='text'){
    c=c.replace(/(#.*)$/gm,'<span class="c">$1</span>');
  }
  return c;
}
let cbN=0;
function codeblock(lang,body){
  const id='cb'+(cbN++);
  return `<div class="cb"><div class="cb-top"><span class="cb-lang">${esc(lang||'text')}</span>`+
    `<button class="cb-copy" data-copy="${id}">copy</button></div>`+
    `<pre id="${id}" data-raw="${esc(body).replace(/"/g,'&quot;')}"><code>${hi(body,lang)}</code></pre></div>`;
}
function render(src){
  const L=src.replace(/\r/g,'').split('\n');
  let out='',i=0;
  const flushList=(tag,items)=>`<${tag}>`+items.map(x=>'<li>'+inline(x)+'</li>').join('')+`</${tag}>`;
  while(i<L.length){
    const l=L[i];
    if(/^\s*$/.test(l)){i++;continue;}
    // code
    let m=l.match(/^(?:```|~~~)(\w*)$/);
    if(m){const lang=m[1];let b=[];i++;while(i<L.length&&!/^(?:```|~~~)$/.test(L[i])){b.push(L[i]);i++;}i++;out+=codeblock(lang,b.join('\n'));continue;}
    // callout / lab
    m=l.match(/^:::(note|key|warn|myth|lab)\s*(.*)$/);
    if(m){const kind=m[1],title=m[2]||'';let b=[];i++;while(i<L.length&&!/^:::$/.test(L[i])){b.push(L[i]);i++;}i++;
      const inner=render(b.join('\n'));
      if(kind==='lab'){
        out+=`<div class="lab"><button class="lab-t"><span class="lab-tag">optional lab</span>${esc(title)}<span class="chev">›</span></button><div class="lab-b">${inner}</div></div>`;
      }else{
        out+=`<div class="call ${kind}">${title?`<h4>${esc(title)}</h4>`:''}${inner}</div>`;
      }
      continue;}
    // figure / widget
    m=l.match(/^\[\[(fig|widget):([\w-]+)\]\]$/);
    if(m){out+= m[1]==='fig' ? (FIGS[m[2]]||'') : `<div class="wgt" data-widget="${m[2]}"></div>`; i++; continue;}
    // table
    if(/^\|/.test(l)){
      let rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++;}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]);const body=rows.slice(2).map(cells);
      out+='<div class="tw"><table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      continue;}
    // lists
    if(/^[-*] /.test(l)){let it=[];while(i<L.length&&/^[-*] /.test(L[i])){it.push(L[i].replace(/^[-*] /,''));i++;}out+=flushList('ul',it);continue;}
    if(/^\d+\. /.test(l)){let it=[];while(i<L.length&&/^\d+\. /.test(L[i])){it.push(L[i].replace(/^\d+\. /,''));i++;}out+=flushList('ol',it);continue;}
    // headings, rule
    if(/^### /.test(l)){out+='<h3>'+inline(l.slice(4))+'</h3>';i++;continue;}
    if(/^## /.test(l)){out+='<h2>'+inline(l.slice(3))+'</h2>';i++;continue;}
    if(/^---$/.test(l)){out+='<hr>';i++;continue;}
    // paragraph
    let p=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(```|~~~|:::|\||[-*] |\d+\. |#|---$|\[\[)/.test(L[i])){p.push(L[i]);i++;}
    out+='<p>'+inline(p.join(' '))+'</p>';
  }
  return out;
}

/* ============ view ============ */
const art=document.getElementById('art');
function toc(){
  const t=document.getElementById('toc');
  t.innerHTML=COURSE.map((m,ix)=>`<button class="toc-i${ix===S.last?' on':''}${S.done.includes(ix)?' done':''}" data-go="${ix}">`+
    `<span class="toc-n">${String(ix).padStart(2,'0')}</span><span class="toc-t">${esc(m.title)}</span></button>`).join('');
  const pct=Math.round(S.done.length/COURSE.length*100);
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('pnum').textContent=S.done.length+'/'+COURSE.length;
}
function go(ix){
  ix=Math.max(0,Math.min(COURSE.length-1,ix));
  S.last=ix;save();
  const m=COURSE[ix];
  let h=`<div class="mod-head"><div class="mod-kicker">Module ${String(ix).padStart(2,'0')}</div><h1>${esc(m.title)}</h1><p class="mod-sub">${esc(m.sub)}</p></div>`;
  h+=render(m.body);
  if(m.quiz&&m.quiz.length){
    h+='<div class="quiz"><h2>Check yourself</h2>'+m.quiz.map((q,qi)=>
      `<div class="q" data-q="${qi}"><p class="q-p">${inline(q.q)}</p>`+
      q.o.map((o,oi)=>`<button class="opt" data-o="${oi}">${inline(o)}</button>`).join('')+
      `<div class="expl" hidden><b>Why:</b> ${inline(q.e)}</div></div>`).join('')+
      `<div class="score" id="score">0 of ${m.quiz.length} answered</div></div>`;
  }
  const isDone=S.done.includes(ix);
  h+=`<button class="done-btn" id="doneBtn" aria-pressed="${isDone}">${isDone?'Marked complete ✓':'Mark module complete'}</button>`;
  h+=`<div class="pager">`+
     (ix>0?`<button class="pg" data-go="${ix-1}"><small>Previous</small>${esc(COURSE[ix-1].title)}</button>`:`<button class="pg" disabled><small>Start</small>You're at the beginning</button>`)+
     (ix<COURSE.length-1?`<button class="pg" data-go="${ix+1}" style="text-align:right"><small>Next</small>${esc(COURSE[ix+1].title)}</button>`:`<button class="pg" disabled>Done</button>`)+
     `</div>`;
  art.innerHTML=h;
  art.querySelectorAll('[data-widget]').forEach(el=>{const f=WIDGETS[el.dataset.widget];if(f)f(el);});
  window.scrollTo({top:0,behavior:'instant'});
  document.body.classList.remove('nav-open');
  toc();
}
/* events */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){go(+g.dataset.go);return;}
  const c=e.target.closest('[data-copy]');
  if(c){const pre=document.getElementById(c.dataset.copy);
    navigator.clipboard.writeText(pre.dataset.raw).then(()=>{c.textContent='copied';setTimeout(()=>c.textContent='copy',1400);},()=>{c.textContent='select manually';});return;}
  const lt=e.target.closest('.lab-t');
  if(lt){lt.parentElement.classList.toggle('open');return;}
  const o=e.target.closest('.opt');
  if(o){
    const qd=o.closest('.q'),qi=+qd.dataset.q,q=COURSE[S.last].quiz[qi];
    if(qd.dataset.answered)return;
    qd.dataset.answered='1';
    qd.querySelectorAll('.opt').forEach((b,bi)=>{b.disabled=true;if(bi===q.a)b.classList.add('right');});
    if(+o.dataset.o!==q.a)o.classList.add('wrong');
    qd.querySelector('.expl').hidden=false;
    const n=art.querySelectorAll('.q[data-answered]').length;
    document.getElementById('score').textContent=n+' of '+COURSE[S.last].quiz.length+' answered';
    return;}
  const d=e.target.closest('#doneBtn');
  if(d){
    const ix=S.last;
    if(S.done.includes(ix)){S.done=S.done.filter(x=>x!==ix);d.setAttribute('aria-pressed','false');d.textContent='Mark module complete';}
    else{S.done.push(ix);d.setAttribute('aria-pressed','true');d.textContent='Marked complete ✓';}
    save();toc();return;}
});
document.getElementById('burger').onclick=()=>document.body.classList.toggle('nav-open');
const labBtn=document.getElementById('labToggle');
function applyLab(){document.body.classList.toggle('nolab',!S.lab);labBtn.setAttribute('aria-pressed',String(S.lab));labBtn.textContent=S.lab?'Lab track on':'Lab track off';}
labBtn.onclick=()=>{S.lab=!S.lab;save();applyLab();};
const thBtn=document.getElementById('themeToggle');
function applyTheme(){
  const dark = S.theme ? S.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  thBtn.textContent=dark?'Light':'Dark';
}
thBtn.onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark';S.theme=dark?'light':'dark';save();applyTheme();};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Clear progress and start again?')){S.done=[];S.last=0;save();go(0);}};
applyLab();applyTheme();go(S.last||0);
</script>
</body>
</html>
