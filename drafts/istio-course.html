<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Istio &amp; Service Mesh — from nothing to judgement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#4f46e5; --indigo-soft:#eef2ff; --indigo-line:#c7d2fe;
  --amber:#b45309; --amber-soft:#fffbeb; --amber-line:#fde68a;
  --teal:#0d9488; --teal-soft:#f0fdfa; --teal-line:#99f6e4;
  --rose:#be123c; --rose-soft:#fff1f2; --rose-line:#fecdd3;
  --bg:#fbfbfd; --panel:#ffffff; --sunk:#f4f4f8;
  --ink:#16161d; --ink-2:#41414f; --ink-3:#71717f;
  --line:#e4e4ec; --line-2:#d0d0dc;
  --code-bg:#1c1c25; --code-ink:#e6e6f0;
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --rail:290px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --indigo:#a5b4fc; --indigo-soft:#1e1b40; --indigo-line:#3f3a7a;
    --amber:#fcd34d; --amber-soft:#2a2110; --amber-line:#6b5320;
    --teal:#5eead4; --teal-soft:#0d2b28; --teal-line:#1f5c55;
    --rose:#fda4af; --rose-soft:#33131c; --rose-line:#7a2b3c;
    --bg:#0e0e13; --panel:#16161e; --sunk:#1c1c26;
    --ink:#eaeaf2; --ink-2:#b9b9c8; --ink-3:#8a8a9c;
    --line:#282833; --line-2:#3a3a48;
    --code-bg:#0a0a0f; --code-ink:#e6e6f0;
  }
}
:root[data-theme="dark"]{
  --indigo:#a5b4fc; --indigo-soft:#1e1b40; --indigo-line:#3f3a7a;
  --amber:#fcd34d; --amber-soft:#2a2110; --amber-line:#6b5320;
  --teal:#5eead4; --teal-soft:#0d2b28; --teal-line:#1f5c55;
  --rose:#fda4af; --rose-soft:#33131c; --rose-line:#7a2b3c;
  --bg:#0e0e13; --panel:#16161e; --sunk:#1c1c26;
  --ink:#eaeaf2; --ink-2:#b9b9c8; --ink-3:#8a8a9c;
  --line:#282833; --line-2:#3a3a48;
  --code-bg:#0a0a0f; --code-ink:#e6e6f0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;}
a{color:var(--indigo)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--indigo);outline-offset:2px;border-radius:3px}

/* ---------- rail ---------- */
#rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
#rail header{padding:22px 22px 16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.2;margin:0}
.brand span{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--ink-3);letter-spacing:0;margin-top:5px}
.prog{margin-top:16px;display:flex;align-items:center;gap:10px}
.prog-bar{flex:1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;width:0;background:var(--teal);border-radius:99px;transition:width .35s ease}
.prog-num{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
#toc{flex:1;overflow-y:auto;padding:10px 12px 24px}
.toc-i{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;color:var(--ink-2);line-height:1.35}
.toc-i:hover{background:var(--sunk);color:var(--ink)}
.toc-i.on{background:var(--indigo-soft);color:var(--ink)}
.toc-i.on .toc-n{color:var(--indigo)}
.toc-n{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:20px;flex:none}
.toc-t{font-size:14.5px;font-weight:500}
.toc-i.done .toc-t::after{content:"✓";color:var(--teal);font-weight:700;margin-left:6px}
#rail footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);border-radius:7px;padding:5px 9px;font-size:12.5px}
.mini:hover{border-color:var(--indigo);color:var(--indigo)}
.mini[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal-line);color:var(--teal)}

/* ---------- main ---------- */
#main{margin-left:var(--rail);padding:0 40px 120px;max-width:calc(var(--rail) + 1180px)}
#burger{display:none}
article{max-width:74ch;margin:0 auto}
.mod-head{padding:56px 0 22px;border-bottom:1px solid var(--line);margin-bottom:34px}
.mod-kicker{font-family:var(--mono);font-size:13px;color:var(--indigo)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.4vw,42px);line-height:1.1;letter-spacing:-.025em;margin:8px 0 14px}
.mod-sub{font-size:19px;color:var(--ink-2);margin:0;max-width:62ch}
h2{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.015em;margin:44px 0 12px;line-height:1.25}
h3{font-family:var(--display);font-weight:600;font-size:19.5px;margin:30px 0 8px;letter-spacing:-.01em}
p{margin:0 0 16px}
ul,ol{margin:0 0 16px;padding-left:22px}
li{margin:0 0 7px}
li::marker{color:var(--ink-3)}
code{font-family:var(--mono);font-size:.87em;background:var(--sunk);padding:1.5px 5px;border-radius:5px;border:1px solid var(--line);word-break:break-word}
strong{font-weight:600}
hr{border:0;border-top:1px solid var(--line);margin:38px 0}

/* code blocks */
.cb{position:relative;margin:0 0 20px;background:var(--code-bg);border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.cb-top{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.09)}
.cb-lang{font-family:var(--mono);font-size:11.5px;color:#9797ad}
.cb-copy{background:rgba(255,255,255,.07);border:0;color:#c9c9dd;font-size:11.5px;padding:3px 9px;border-radius:6px;font-family:var(--mono)}
.cb-copy:hover{background:rgba(255,255,255,.16);color:#fff}
.cb pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.62;color:var(--code-ink)}
.cb .k{color:#8ab4f8}.cb .s{color:#a5d6a7}.cb .c{color:#7d7d92;font-style:italic}.cb .n{color:#f0b37e}

/* callouts */
.call{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:15px 18px;margin:0 0 22px;background:var(--panel)}
.call h4{margin:0 0 7px;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.005em}
.call p:last-child,.call ul:last-child{margin-bottom:0}
.call.note{border-left-color:var(--indigo);background:var(--indigo-soft)}
.call.note h4{color:var(--indigo)}
.call.key{border-left-color:var(--teal);background:var(--teal-soft)}
.call.key h4{color:var(--teal)}
.call.warn{border-left-color:var(--amber);background:var(--amber-soft)}
.call.warn h4{color:var(--amber)}
.call.myth{border-left-color:var(--rose);background:var(--rose-soft)}
.call.myth h4{color:var(--rose)}

/* lab */
.lab{border:1px dashed var(--teal-line);border-radius:11px;margin:0 0 22px;background:var(--teal-soft);overflow:hidden}
body.nolab .lab{display:none}
.lab-t{width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;padding:12px 16px;text-align:left;color:var(--teal);font-family:var(--display);font-weight:600;font-size:15px}
.lab-tag{font-family:var(--mono);font-size:10.5px;border:1px solid var(--teal-line);border-radius:99px;padding:1px 8px;color:var(--teal)}
.lab-t .chev{margin-left:auto;transition:transform .2s}
.lab.open .chev{transform:rotate(90deg)}
.lab-b{display:none;padding:0 16px 14px}
.lab.open .lab-b{display:block}
.lab-b .cb{margin-bottom:14px}

/* tables */
.tw{overflow-x:auto;margin:0 0 22px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:460px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:600;font-family:var(--display);font-size:14px}
tr:last-child td{border-bottom:0}

/* figures */
figure{margin:0 0 26px}
figure svg{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
figcaption{font-size:13.5px;color:var(--ink-3);margin-top:9px;padding-left:2px}
.svg-ink{fill:var(--ink)}.svg-ink2{fill:var(--ink-2)}.svg-ink3{fill:var(--ink-3)}
.svg-line{stroke:var(--line-2);fill:none}
.svg-box{fill:var(--sunk);stroke:var(--line-2)}

/* widgets */
.wgt{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:0 0 26px;overflow:hidden}
.wgt-h{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--sunk);font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px}
.wgt-h em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:99px;padding:1px 8px}
.wgt-b{padding:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);border-radius:99px;padding:5px 12px;font-size:13.5px}
.chip:hover{border-color:var(--indigo)}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"],
:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#16161e}
.lbl{font-size:12.5px;color:var(--ink-3);font-family:var(--mono);margin:0 0 6px}
.out{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:13px 15px;font-size:14.5px}
.out p{margin:0 0 9px}.out p:last-child{margin:0}
.hop{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line);}
.hop:last-child{border:0}
.hop b{font-family:var(--mono);font-size:11.5px;background:var(--indigo-soft);color:var(--indigo);border-radius:5px;padding:2px 7px;flex:none}
.hop .d{color:var(--ink-3);font-size:13px}
.bar{height:22px;border-radius:6px;background:var(--indigo);display:flex;align-items:center;justify-content:flex-end;padding-right:7px;color:#fff;font-family:var(--mono);font-size:11.5px;transition:width .3s ease;min-width:34px}
:root[data-theme="dark"] .bar,:root:not([data-theme="light"]) .bar{color:#16161e}
.bar.v2{background:var(--amber)}
input[type=range]{width:100%;accent-color:var(--indigo)}
.verdict{font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:6px}
.verdict.yes{color:var(--teal)}.verdict.no{color:var(--rose)}.verdict.mid{color:var(--amber)}

/* quiz */
.quiz{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:20px 22px;margin:44px 0 0}
.quiz h2{margin-top:0}
.q{padding:16px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q-p{font-weight:500;margin:0 0 11px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:9px 13px;margin-bottom:7px;font-size:15px;color:var(--ink-2);line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--indigo);color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft);color:var(--ink)}
.expl{font-size:14.5px;color:var(--ink-2);background:var(--sunk);border-radius:8px;padding:11px 13px;margin-top:4px}
.expl b{color:var(--ink)}
.score{font-family:var(--mono);font-size:13px;color:var(--ink-3);margin-top:14px}

/* nav */
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:52px;padding-top:26px;border-top:1px solid var(--line)}
.pg{border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:11px 18px;color:var(--ink);font-family:var(--display);font-weight:600;font-size:14.5px;max-width:47%;text-align:left}
.pg:hover{border-color:var(--indigo);color:var(--indigo)}
.pg small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--ink-3)}
.pg:disabled{opacity:.35;cursor:default}
.done-btn{width:100%;margin-top:26px;border:1px solid var(--teal-line);background:var(--teal-soft);color:var(--teal);border-radius:10px;padding:12px;font-family:var(--display);font-weight:600}
.done-btn[aria-pressed="true"]{background:var(--teal);color:var(--panel);border-color:var(--teal)}

@media(max-width:960px){
  #rail{transform:translateX(-100%);transition:transform .25s ease;width:280px;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.nav-open #rail{transform:none}
  #main{margin-left:0;padding:0 20px 90px}
  #burger{display:flex;position:fixed;top:12px;left:12px;z-index:50;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink);align-items:center;gap:7px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .mod-head{padding-top:64px}
  body{font-size:16.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<button id="burger" aria-label="Toggle contents">☰ Contents</button>
<nav id="rail" aria-label="Course contents">
  <header>
    <h1 class="brand">Istio &amp; the Service Mesh<span>From "I know nothing" to defensible judgement</span></h1>
    <div class="prog"><div class="prog-bar"><div class="prog-fill" id="pfill"></div></div><span class="prog-num" id="pnum">0/13</span></div>
  </header>
  <div id="toc"></div>
  <footer>
    <button class="mini" id="labToggle" aria-pressed="true">Lab track on</button>
    <button class="mini" id="themeToggle">Dark</button>
    <button class="mini" id="resetBtn">Reset</button>
  </footer>
</nav>
<main id="main"><article id="art"></article></main>

<script>
/* ================= FIGURES ================= */
const SV=(vb,inner,cap)=>`<figure><svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" font-family="IBM Plex Sans, sans-serif">${inner}</svg><figcaption>${cap}</figcaption></figure>`;
const box=(x,y,w,h,label,sub,fill)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" class="svg-box" ${fill?`style="fill:${fill}"`:''} stroke-width="1.5"/>`+
  `<text x="${x+w/2}" y="${y+(sub?h/2-3:h/2+5)}" text-anchor="middle" font-size="13" font-weight="600" class="svg-ink">${label}</text>`+
  (sub?`<text x="${x+w/2}" y="${y+h/2+15}" text-anchor="middle" font-size="11" class="svg-ink3">${sub}</text>`:'');
const arrow=(x1,y1,x2,y2,dash)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="svg-line" stroke-width="1.6" marker-end="url(#ah)" ${dash?'stroke-dasharray="5 4"':''}/>`;
const lbl=(x,y,t,anchor)=>`<text x="${x}" y="${y}" text-anchor="${anchor||'middle'}" font-size="11" class="svg-ink3">${t}</text>`;
const DEF=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" class="svg-ink2"/></marker></defs>`;

const FIGS={};

FIGS['nomesh']=SV('0 0 780 250',DEF+
  box(40,60,190,130,'checkout','your code')+
  box(300,60,190,130,'payments','your code')+
  box(560,60,190,130,'ledger','your code')+
  `<rect x="55" y="105" width="160" height="70" rx="6" class="svg-box" stroke-dasharray="4 3"/>`+
  `<text x="135" y="128" text-anchor="middle" font-size="11" class="svg-ink2">retry / timeout</text>`+
  `<text x="135" y="145" text-anchor="middle" font-size="11" class="svg-ink2">TLS / auth</text>`+
  `<text x="135" y="162" text-anchor="middle" font-size="11" class="svg-ink2">metrics / tracing</text>`+
  `<rect x="315" y="105" width="160" height="70" rx="6" class="svg-box" stroke-dasharray="4 3"/>`+
  `<text x="395" y="128" text-anchor="middle" font-size="11" class="svg-ink2">retry / timeout</text>`+
  `<text x="395" y="145" text-anchor="middle" font-size="11" class="svg-ink2">TLS / auth</text>`+
  `<text x="395" y="162" text-anchor="middle" font-size="11" class="svg-ink2">metrics / tracing</text>`+
  `<rect x="575" y="105" width="160" height="70" rx="6" class="svg-box" stroke-dasharray="4 3"/>`+
  `<text x="655" y="128" text-anchor="middle" font-size="11" class="svg-ink2">retry / timeout</text>`+
  `<text x="655" y="145" text-anchor="middle" font-size="11" class="svg-ink2">TLS / auth</text>`+
  `<text x="655" y="162" text-anchor="middle" font-size="11" class="svg-ink2">metrics / tracing</text>`+
  arrow(232,90,298,90)+arrow(492,90,558,90)+
  `<text x="390" y="30" text-anchor="middle" font-size="13" font-weight="600" class="svg-ink">Same concerns, three copies, three languages, three release cycles</text>`+
  lbl(390,225,'Every upgrade to the retry policy is a code change and a redeploy of every service'),
  'Before the mesh: cross-cutting network concerns live inside each application, usually as a library.');

FIGS['anatomy']=SV('0 0 780 320',DEF+
  `<rect x="230" y="20" width="320" height="76" rx="10" class="svg-box" stroke-width="1.5"/>`+
  `<text x="390" y="48" text-anchor="middle" font-size="14" font-weight="600" class="svg-ink">istiod (control plane)</text>`+
  `<text x="390" y="70" text-anchor="middle" font-size="11" class="svg-ink3">config + service discovery + certificate authority</text>`+
  `<text x="390" y="86" text-anchor="middle" font-size="11" class="svg-ink3">watches Kubernetes API, compiles your YAML into Envoy config</text>`+
  arrow(300,100,180,180,true)+arrow(390,100,390,180,true)+arrow(480,100,600,180,true)+
  lbl(215,140,'xDS')+lbl(405,142,'xDS',"start")+lbl(565,140,'xDS')+
  box(90,185,180,90,'proxy','Envoy')+
  box(300,185,180,90,'proxy','Envoy')+
  box(510,185,180,90,'proxy','Envoy')+
  `<text x="390" y="305" text-anchor="middle" font-size="12" class="svg-ink2">data plane — every byte of traffic passes through here; istiod never does</text>`,
  'Control plane and data plane. istiod configures proxies; it is not in the request path.');

FIGS['intercept']=SV('0 0 780 260',DEF+
  `<rect x="140" y="40" width="500" height="180" rx="12" class="svg-box" stroke-dasharray="6 4"/>`+
  `<text x="165" y="63" font-size="12" class="svg-ink3">pod</text>`+
  box(190,90,180,90,'app container','listens on :8080')+
  box(420,90,180,90,'istio-proxy','Envoy sidecar')+
  arrow(372,120,418,120)+arrow(418,155,372,155)+
  lbl(395,110,'out')+lbl(395,178,'in')+
  arrow(60,135,138,135)+lbl(95,125,'inbound')+
  arrow(642,135,730,135)+lbl(690,125,'outbound')+
  `<text x="390" y="240" text-anchor="middle" font-size="12" class="svg-ink2">iptables rules (or the CNI plugin) redirect all pod traffic through the proxy — the app never knows</text>`,
  'Sidecar interception. The application dials the destination normally; the redirect happens below it.');

FIGS['gateway']=SV('0 0 780 300',DEF+
  box(30,110,120,70,'client','browser / app')+
  box(190,110,130,70,'cloud LB','Service type=LB')+
  `<rect x="360" y="30" width="390" height="240" rx="12" class="svg-box" stroke-dasharray="6 4"/>`+
  `<text x="382" y="52" font-size="12" class="svg-ink3">Kubernetes cluster</text>`+
  box(390,110,130,70,'gateway pod','Envoy')+
  box(590,70,130,60,'svc A','no proxy')+
  box(590,170,130,60,'svc B','no proxy')+
  arrow(152,145,188,145)+arrow(322,145,388,145)+
  arrow(522,130,588,105)+arrow(522,160,588,192)+
  `<text x="555" y="285" text-anchor="middle" font-size="12" class="svg-ink2">these workloads are not in the mesh — and it still works</text>`,
  'Istio as an ingress gateway. Nothing here requires a single workload to be meshed.');

/* ================= WIDGETS ================= */
const WIDGETS={};
const wrap=(el,title,tag,body)=>{el.innerHTML=`<div class="wgt-h">${title}<em>${tag}</em></div><div class="wgt-b">${body}</div>`;};

/* --- do you need a mesh --- */
WIDGETS['needmesh']=el=>{
  const qs=[
    {k:'many',t:'More than ~15 services talking to each other'},
    {k:'poly',t:'More than one language / framework in play'},
    {k:'mtls',t:'Someone is asking for encryption in transit between services'},
    {k:'canary',t:'You want canary or header-based routing without code changes'},
    {k:'k8s',t:'It all runs on Kubernetes already'},
    {k:'team',t:'There is a platform team who will own it on day 2'}
  ];
  const st={};
  wrap(el,'Do you actually need a mesh?','decide',
    `<div class="row" id="nm">${qs.map(q=>`<button class="chip" data-k="${q.k}" aria-pressed="false">${q.t}</button>`).join('')}</div><div class="out" id="nmo"></div>`);
  const out=el.querySelector('#nmo');
  const calc=()=>{
    const n=Object.values(st).filter(Boolean).length;
    let v,c,txt;
    if(!st.k8s&&n>0){v='mid';c='Istio is Kubernetes-shaped';txt='Istio can mesh VMs, but if the bulk of the estate is not on Kubernetes the operating model gets expensive fast. Look at a gateway-only deployment or a different tool.';}
    else if(!st.team&&n>=3){v='no';c='Not yet — you have no owner';txt='A mesh is a distributed system you now have to run, upgrade quarterly and debug at 3am. Without a platform team it becomes the thing everyone blames and nobody patches.';}
    else if(n<=1){v='no';c='Skip it';txt='At this size, library-level retries and an ingress controller will do the job with a fraction of the operational surface.';}
    else if(n<=3){v='mid';c='Start at the edge';txt='Deploy Istio as a gateway for north-south traffic, get comfortable, and enrol workloads into the mesh later if the case builds.';}
    else{v='yes';c='A mesh earns its keep here';txt='Polyglot services plus mTLS plus routing requirements is exactly the shape the mesh was built for. Start in ambient mode, one namespace at a time.';}
    out.innerHTML=`<p class="verdict ${v}">${c}</p><p>${txt}</p>`;
  };
  el.querySelector('#nm').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;
    st[b.dataset.k]=!st[b.dataset.k];b.setAttribute('aria-pressed',String(!!st[b.dataset.k]));calc();};
  calc();
};

/* --- request path --- */
WIDGETS['path']=el=>{
  const modes={
    none:{n:'No mesh',h:[['app','checkout opens a TCP connection straight to payments'],['net','plaintext unless the app did TLS itself'],['app','payments receives it; you know nothing about the call unless the app logged it']]},
    sidecar:{n:'Sidecar',h:[['app','checkout calls payments:8080 as usual'],['iptables','outbound is redirected into the local Envoy'],['envoy','client proxy picks an endpoint, applies retries/timeouts, starts mTLS'],['envoy','server proxy terminates mTLS, checks AuthorizationPolicy'],['iptables','inbound redirected to the app port'],['app','payments handles the request; both proxies emit L7 metrics']]},
    ambientL4:{n:'Ambient, L4 only',h:[['app','checkout calls payments:8080'],['cni','the node CNI redirects the connection to the local ztunnel'],['ztunnel','opens an HBONE tunnel (mTLS over CONNECT, port 15008) to the destination node'],['ztunnel','destination ztunnel checks L4 authorization, forwards to the pod'],['app','payments handles it. You get TCP-level telemetry, not HTTP']]},
    ambientL7:{n:'Ambient + waypoint',h:[['app','checkout calls payments:8080'],['cni','redirected to the local ztunnel'],['ztunnel','HBONE to the waypoint for the payments service'],['waypoint','full Envoy: HTTP routing, retries, L7 authorization, HTTP metrics'],['ztunnel','HBONE onward to the destination node'],['app','payments handles it']]}
  };
  let cur='sidecar';
  wrap(el,'One request, four worlds','trace',
    `<div class="row" id="pm">${Object.entries(modes).map(([k,v])=>`<button class="chip" data-m="${k}" aria-pressed="${k===cur}">${v.n}</button>`).join('')}</div><div class="out" id="po"></div>`);
  const draw=()=>{el.querySelector('#po').innerHTML=modes[cur].h.map(h=>`<div class="hop"><b>${h[0]}</b><span class="d">${h[1]}</span></div>`).join('')+
    `<p style="margin-top:12px;color:var(--ink-3);font-size:13px">${modes[cur].h.length} steps</p>`;};
  el.querySelector('#pm').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;cur=b.dataset.m;
    el.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m===cur)));draw();};
  draw();
};

/* --- canary --- */
WIDGETS['canary']=el=>{
  wrap(el,'Weight and match, side by side','routing',
    `<p class="lbl">Weight to v2</p><input type="range" min="0" max="100" value="10" id="cw">
     <div style="display:flex;gap:6px;margin:12px 0 6px"><div class="bar" id="b1" style="width:90%">v1</div><div class="bar v2" id="b2" style="width:10%">v2</div></div>
     <div class="row" style="margin-top:14px"><button class="chip" id="ch" aria-pressed="false">Send header <code>x-beta: true</code></button></div>
     <div class="out" id="co"></div>`);
  const w=el.querySelector('#cw'),b1=el.querySelector('#b1'),b2=el.querySelector('#b2'),h=el.querySelector('#ch'),o=el.querySelector('#co');
  let hdr=false;
  const draw=()=>{
    const v=+w.value;
    b1.style.width=(100-v)+'%';b2.style.width=v+'%';
    b1.textContent=(100-v)+'% v1';b2.textContent=v+'% v2';
    o.innerHTML = hdr
      ? `<p class="verdict mid">Match rule wins — 100% to v2</p><p>Match blocks are evaluated in order, before any weighting. Your own testers hit v2 every time regardless of the slider; everyone else falls through to the weighted rule below.</p>`
      : `<p class="verdict">Weighted split — ${100-v}/${v}</p><p>Weights are applied per request, not per user. A customer refreshing the page can bounce between versions unless you also set consistent hashing in the DestinationRule.</p>`;
  };
  w.oninput=draw; h.onclick=()=>{hdr=!hdr;h.setAttribute('aria-pressed',String(hdr));draw();};
  draw();
};

/* --- 503 triage --- */
WIDGETS['triage']=el=>{
  const cases={
    UC:{n:'503 UC',c:'Upstream connection termination. The app closed the connection while the proxy was using it — nine times out of ten the app\'s keep-alive idle timeout is shorter than Envoy\'s.',f:'Raise the application server\'s keep-alive timeout above 60s, or lower the proxy idle timeout in the DestinationRule.',cmd:'istioctl proxy-config cluster deploy/payments --fqdn payments.shop.svc.cluster.local -o json'},
    UF:{n:'503 UF',c:'Upstream connection failure. The proxy could not connect at all — wrong port, no endpoints, or an mTLS mismatch where one side expects TLS and the other sends plaintext.',f:'Check endpoints exist, then check for a DestinationRule setting DISABLE while PeerAuthentication is STRICT.',cmd:'istioctl proxy-config endpoint deploy/checkout | grep payments'},
    NR:{n:'404 NR',c:'No route. The proxy had no matching route for the Host header. Usually a VirtualService host that does not match, or a Gateway the route was never bound to.',f:'Confirm the VirtualService lists the gateway and the exact host, and that the Service port has a recognised name.',cmd:'istioctl proxy-config route deploy/istio-ingressgateway -o json'},
    UO:{n:'503 UO',c:'Upstream overflow. Your own circuit breaker tripped — the connection pool or pending request limit in the DestinationRule was hit.',f:'This is the mesh doing what you told it to. Either the limits are too tight or the upstream is genuinely struggling.',cmd:'kubectl exec deploy/checkout -c istio-proxy -- pilot-agent request GET stats | grep overflow'},
    none:{n:'Nothing in the mesh logs',c:'If the access log shows no entry at all, traffic never reached the proxy. Check the pod is actually enrolled and the port is being captured.',f:'Ports Istio cannot classify still pass through, but unnamed ports and excluded ranges bypass policy entirely.',cmd:'istioctl analyze -n shop'}
  };
  let cur='UC';
  wrap(el,'503 triage','debug',
    `<div class="row" id="ts">${Object.entries(cases).map(([k,v])=>`<button class="chip" data-t="${k}" aria-pressed="${k===cur}">${v.n}</button>`).join('')}</div><div class="out" id="to"></div>`);
  const draw=()=>{const c=cases[cur];
    el.querySelector('#to').innerHTML=`<p><strong>What it means.</strong> ${c.c}</p><p><strong>Where to look.</strong> ${c.f}</p>`+
      `<div class="cb" style="margin-top:12px;margin-bottom:0"><pre style="padding:11px 13px"><code>${c.cmd.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code></pre></div>`;};
  el.querySelector('#ts').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;cur=b.dataset.t;
    el.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.t===cur)));draw();};
  draw();
};

WIDGETS['apipick']=el=>{
  const feats={
    basic:{n:'Host/path routing',v:'both',t:'Both APIs do this cleanly. Use Gateway API — it is where Istio is heading.'},
    split:{n:'Weighted traffic split',v:'both',t:'HTTPRoute supports backend weights; VirtualService supports weights across DestinationRule subsets. If you split by pod version label rather than by Service, you still need the Istio pair.'},
    fault:{n:'Fault injection',v:'istio',t:'Delay and abort injection only exist in VirtualService. Gateway API has no equivalent.'},
    cb:{n:'Circuit breaking / outlier detection',v:'istio',t:'DestinationRule territory. Gateway API does not model connection pools or ejection.'},
    mirror:{n:'Traffic mirroring',v:'both',t:'Gateway API has a RequestMirror filter, but it mirrors to a backend reference — not to a DestinationRule subset. Subset-level mirroring stays Istio-only.'},
    ext:{n:'External / legacy endpoint',v:'istio',t:'ServiceEntry is how non-Kubernetes destinations enter the mesh. No Gateway API equivalent.'},
    portable:{n:'Portability across mesh vendors',v:'gw',t:'This is the whole point of Gateway API. Istio-specific CRDs lock the config to Istio.'}
  };
  let cur='basic';
  wrap(el,'Gateway API or Istio classic?','decide',
    `<div class="row" id="fs">${Object.entries(feats).map(([k,v])=>`<button class="chip" data-f="${k}" aria-pressed="${k===cur}">${v.n}</button>`).join('')}</div><div class="out" id="fo"></div>`);
  const draw=()=>{const f=feats[cur];
    const map={both:['mid','Either — prefer Gateway API'],istio:['no','Istio classic API only'],gw:['yes','Gateway API']};
    el.querySelector('#fo').innerHTML=`<p class="verdict ${map[f.v][0]}">${map[f.v][1]}</p><p>${f.t}</p>`;};
  el.querySelector('#fs').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;cur=b.dataset.f;
    el.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.f===cur)));draw();};
  draw();
};

const COURSE=[{"title": "Orientation", "sub": "What a service mesh is, what this course assumes, and what you'll be able to argue about by the end.", "body": "## Start here\n\nYou are told your organisation \"uses Istio\". Somebody mentions ambient. Somebody else mentions sidecars. The thing you actually see day to day is a gateway handling ingress. These are three different conversations, and the fastest way to sound lost in a design review is to mix them up.\n\nSo the first thing this course does is separate them.\n\n- **Istio as a gateway** is an Envoy proxy at the edge of your cluster, terminating TLS and routing north-south traffic. It works whether or not you have a mesh.\n- **The mesh** is what happens when the workloads themselves are enrolled, so service-to-service (east-west) traffic gets identity, encryption, policy and telemetry.\n- **Sidecar and ambient** are two ways of building that mesh. They are modes of the mesh, not modes of the gateway.\n\n:::key The sentence to hold on to\nA gateway without an enrolled workload is not a service mesh. It is a very good ingress controller with a confusing name.\n:::\n\n## What you get out of this\n\nBy module 12 you should be able to sit in a design review and do four things without bluffing:\n\n1. Say what the mesh is actually doing to a request, hop by hop, in either mode.\n2. Explain why ambient exists and what it costs you compared to sidecars.\n3. Read a `VirtualService` or an `HTTPRoute` and predict where a request lands.\n4. Argue the case *against* adopting it, which is the part most Istio material skips entirely.\n\nThat last one matters. A mesh is not a feature you switch on; it is a distributed system you have taken ownership of, with a quarterly upgrade cycle and a support window that expires.\n\n## Assumptions and shape\n\nYou know what Kubernetes pods, services and namespaces are. You do not need to have touched Istio, Envoy or a mesh before. Everything is worked through one small e-commerce estate in a namespace called `shop`:\n\n| Service | Talks to | Why it's here |\n| --- | --- | --- |\n| `storefront` | catalog, checkout | The public entry point — the ingress example |\n| `catalog` | — | Read-heavy, cacheable, boring on purpose |\n| `checkout` | payments | Where routing and canary examples live |\n| `payments` | — | Where the security examples live; sensitive, deserves policy |\n\nLabs are marked and optional. Everything in them runs on a laptop with `kind` and about 4GB of spare memory. If you never open one you will still follow the course — the toggle is in the sidebar if you want them gone entirely.\n\n:::note Versions\nThis course is written against Istio 1.31 (released August 2026). Istio ships a minor release roughly quarterly and supports a release until about six weeks after N+2 lands, so anything written more than a year ago is likely to be describing an unsupported version. Where a detail is version-sensitive I say so.\n:::\n\n## How the modules run\n\nModules 1 to 2 build the mental model. Module 3 is the one closest to what you are seeing at work — ingress. Module 4 is the sidecar/ambient fork. Modules 5 to 8 are the working parts: install, routing, security, observability. Modules 9 to 10 are what it feels like when it misbehaves and what owning it costs. Modules 11 to 12 are judgement and a reference card.\n\nThere is a short quiz at the end of each module. It exists to catch the specific misconceptions people leave that module with, so a wrong answer there is more useful than a right one.", "quiz": [{"q": "Your platform team runs an Istio ingress gateway. No workloads are labelled for injection. Do you have a service mesh?", "o": ["Yes — the gateway is part of the mesh by definition", "No — you have an ingress gateway; the mesh is the enrolled workloads", "Only if you are running ambient mode", "Only if mTLS is enabled on the gateway"], "a": 1, "e": "The gateway is a standalone Envoy deployment. Sidecar and ambient are modes of the **mesh**, and the mesh only exists where workloads are enrolled. Plenty of organisations run Istio purely as a gateway and never mesh anything."}, {"q": "Which statement about Istio's release cadence is right?", "o": ["Istio releases yearly with long-term support branches", "Minor releases land roughly quarterly and support ends shortly after N+2", "Only major versions matter; minors are patches", "Releases are continuous with no version boundaries"], "a": 1, "e": "A minor version lands about every quarter and is supported until roughly six weeks after N+2 ships. Staying current is an ongoing operational commitment, not a one-off install."}]}, {"title": "Why a mesh exists at all", "sub": "The problem that produced service meshes, the two solutions that came before, and what specifically was wrong with them.", "body": "## The problem is not new\n\nSplit a monolith into services and you convert method calls into network calls. Method calls do not fail halfway. Network calls do. Everything you got for free inside a process now needs an answer:\n\n- What happens when the callee is slow? (timeout)\n- What happens when it fails once? (retry — and how do you avoid retry storms?)\n- What happens when it fails constantly? (circuit breaking, outlier ejection)\n- Is this connection encrypted? Who is on the other end, really?\n- Which caller caused this spike, and how do I see the whole chain?\n- How do I shift 5% of traffic to the new version without a redeploy?\n\nNone of that is exotic. Every distributed system needs it. The only question is *where the code lives*.\n\n[[fig:nomesh]]\n\n## Answer one: put it in a library\n\nThis was the Netflix OSS era, and in the Java world it was Hystrix, Ribbon and Eureka; later Resilience4j and Spring Cloud. It works, and honestly it works well — the logic runs in-process, there is no extra hop, and you can debug it with a normal debugger.\n\nThe problems show up at organisational scale rather than technical scale:\n\n- **It is per-language.** The moment a team ships something in Go, Python or Node, your retry policy, your service discovery and your tracing propagation have to be reimplemented and kept in step.\n- **Upgrading it is a redeploy of everything.** Changing a company-wide timeout default means a coordinated release across every service and every team. In practice this means the policy never changes.\n- **Compliance can't verify it.** \"Is all internal traffic encrypted?\" becomes an audit of source code across dozens of repos rather than a property of the platform.\n\n:::note Worth being fair about this\nLibrary-based resilience is not obsolete and a mesh does not replace it. Application-level concerns — bulkheads around a thread pool, idempotency keys, business-aware fallbacks — still belong in the app. What moves to the mesh is the transport-level, uniform, policy-shaped part.\n:::\n\n## Answer two: put it in a shared gateway\n\nRoute everything through a central proxy — an ESB in the older world, an API gateway in the newer one — and you get one place to enforce policy. This is genuinely good for north-south traffic, which is why API gateways are not going anywhere.\n\nFor east-west traffic it has two failure modes:\n\n- **Hairpinning.** Two services in the same cluster now route through a central appliance and back. You have added latency and a shared failure domain to every internal call.\n- **It becomes a bottleneck, technically and politically.** One team owns the config for everyone; changes queue behind a change board.\n\n## Answer three: put it beside every workload\n\nThe mesh insight is small and slightly odd: keep the proxy, but stop centralising it. Give every workload its own proxy, running *next to* it rather than in it, and have a control plane configure them all consistently.\n\nThat buys you three properties at once:\n\n- The logic is out of the application, so it is language-agnostic and upgradeable independently.\n- It is not centralised, so there is no hairpin and no single chokepoint.\n- Because a proxy sits on both ends of every call, the platform can assert things the application cannot lie about — like \"this traffic was mutually authenticated\".\n\nThat last point is the one that sells meshes into banks and regulated environments. Encryption in transit and workload identity stop being a claim in a design document and become an observable property with a certificate behind it.\n\n[[widget:needmesh]]\n\n## What it costs, stated up front\n\nThe honest counterweight, because you will be asked:\n\n| Cost | Detail |\n| --- | --- |\n| Latency | An extra proxy hop on each end of every call. Single-digit milliseconds in normal conditions, but it is not zero, and tail latency is what people notice |\n| Resource | In sidecar mode, a proxy per pod — memory and CPU that scale with pod count, not traffic |\n| Cognitive load | A 503 now has three possible origins instead of one, and your engineers need to know which |\n| Operational | Quarterly upgrades, a control plane to run, CVE patching on Envoy |\n| Blast radius | A bad `AuthorizationPolicy` or a malformed config can break every service at once |\n\nAmbient mode was designed largely to attack rows two and four. It does not remove rows one, three or five.\n\n:::myth \"The mesh will make our services reliable\"\nIt will not. It gives you uniform, configurable failure handling. Retries applied carelessly turn a slow dependency into an overloaded one — a retry at the proxy plus a retry in the app plus a retry in the client is 27 requests from one click. The mesh makes failure policy *visible and central*; whether it is *correct* is still your problem.\n:::\n\n## Where Istio fits\n\nIstio is the most feature-complete of the meshes and the one with the most surface area to learn. Its data plane is Envoy, a proxy that predates it and is used far beyond it. Its control plane is `istiod`. The alternatives are worth naming now and we return to them in module 11: Linkerd (smaller, opinionated, its own Rust proxy), and Cilium's mesh (eBPF-based, tied to its CNI).", "quiz": [{"q": "What is the strongest argument against library-based resilience in a large organisation?", "o": ["It adds an extra network hop", "It cannot express retries or timeouts", "Policy changes require a coordinated redeploy of every service, per language", "It cannot be monitored"], "a": 2, "e": "The technical capability is fine — the failure is organisational. Every language needs its own implementation, and changing a shared default means releasing everything at once, so in practice the default never changes."}, {"q": "Why is routing east-west traffic through a central API gateway a poor fit?", "o": ["Gateways cannot terminate TLS", "It hairpins internal calls through a shared bottleneck and failure domain", "Gateways cannot do weighted routing", "Kubernetes forbids it"], "a": 1, "e": "Two pods in the same cluster end up routing out to a central appliance and back, adding latency and coupling every internal call to one shared component. Gateways remain the right answer for north-south traffic."}, {"q": "A mesh applies a retry policy, the HTTP client library also retries, and the caller retries on failure. What have you built?", "o": ["Defence in depth — three chances to succeed", "A retry storm that multiplies load on a struggling dependency", "Nothing, the mesh suppresses application retries", "A circuit breaker"], "a": 1, "e": "Retries compose multiplicatively. Three layers of three attempts is 27 requests from a single user action, aimed at a service that is already failing. Retry budgets need to be owned in one place deliberately."}, {"q": "Which cost did ambient mode specifically set out to reduce?", "o": ["The extra latency hop", "The per-pod proxy resource footprint and the restart-to-upgrade problem", "The need for a control plane", "The complexity of AuthorizationPolicy"], "a": 1, "e": "Ambient removes the per-pod Envoy in favour of a shared per-node L4 proxy, which cuts resource cost and lets proxy upgrades roll as a DaemonSet update instead of restarting every application pod."}]}, {"title": "Anatomy of Istio", "sub": "istiod, Envoy, xDS and traffic interception — the four pieces that explain almost every behaviour you will meet later.", "body": "## Two planes, and they are not equal\n\n[[fig:anatomy]]\n\n**The data plane** is Envoy. It carries every byte of your traffic. If it is down, your traffic is down.\n\n**The control plane** is `istiod` — a single binary that does three jobs: it watches the Kubernetes API for your config and your Services, compiles that into Envoy configuration, and acts as a certificate authority issuing workload identities.\n\nThe critical property, and the one people get wrong: **istiod is not in the request path.** If istiod dies, existing proxies keep running on their last known configuration. Traffic keeps flowing. What you lose is the ability to *change* anything — new pods can't get config or certificates, so scaling and deployments break, and eventually certificates expire (default lifetime is 24 hours). It is an urgent problem, not an instant outage. Knowing that distinction is worth having in your head before an incident, not during one.\n\n## Envoy, briefly\n\nEnvoy is a general-purpose L4/L7 proxy. It is not Istio-specific — it is used standalone, inside other gateways, and by other meshes. Its configuration model is worth knowing because every Istio debugging command maps onto it:\n\n| Envoy concept | What it means | Istio config that produces it |\n| --- | --- | --- |\n| Listener | A port the proxy accepts connections on | Ports on your Services, gateway `Gateway` listeners |\n| Route | Match rules deciding which cluster a request goes to | `VirtualService` / `HTTPRoute` |\n| Cluster | A named group of endpoints, plus how to treat them | `DestinationRule` and the Service itself |\n| Endpoint | An actual pod IP and port | Kubernetes endpoints, discovered by istiod |\n\nWhen you later run `istioctl proxy-config route` or `... cluster`, you are dumping exactly these objects out of a live proxy. That command is the single most useful debugging tool in the product, because it answers \"what does the proxy *actually* think\" rather than \"what did I mean to configure\".\n\n## xDS: how config gets there\n\nistiod pushes configuration to proxies over a gRPC streaming API called xDS (the family name for LDS, RDS, CDS, EDS — listeners, routes, clusters, endpoints). Proxies hold an open connection to istiod and receive updates as things change.\n\nTwo consequences you will meet in the real world:\n\n- **Config propagation is eventually consistent.** You apply a `VirtualService` and it takes a moment to reach every proxy. During a rollout this shows up as a brief window of mixed behaviour.\n- **It scales with change rate, not just cluster size.** In a large, busy cluster, istiod CPU is driven by how often endpoints change. This is why `Sidecar` resources and namespace scoping exist — to reduce how much config each proxy has to be told about.\n\n## Interception: the part that feels like magic\n\nThe application makes an ordinary connection to `payments:8080`. It does not know a proxy exists. Something has to divert that traffic.\n\n[[fig:intercept]]\n\nIn sidecar mode this is done with iptables rules inside the pod's network namespace, set up either by an init container or, preferably, by the Istio CNI plugin (which avoids needing `NET_ADMIN` on every pod — the CNI approach is the one to prefer in a locked-down environment, and it is what ambient mode requires anyway).\n\nTwo things follow from this mechanism, and both cause real incidents:\n\n:::warn Port naming matters\nIstio decides how to treat a port partly from the Service port name. A port named `http` gets L7 treatment; a port named nothing in particular may be treated as plain TCP, which silently costs you HTTP metrics, retries and path-based policy. Use `http`, `grpc`, `tls`, `tcp` prefixes — `http-api`, `grpc-internal` — deliberately.\n:::\n\n:::warn Startup races\nThe application container can start before the proxy is ready and fail its first outbound calls. Modern Istio handles this for you (`holdApplicationUntilProxyStarts` and native sidecar container support in recent Kubernetes), but if you meet a service that fails only on the first few seconds after a deploy, this is your suspect.\n:::\n\n## Put it together\n\n[[widget:path]]\n\nWork through all four options in that widget. The difference between them is the whole of module 4, and the number of steps is the honest cost of the feature set.\n\n:::key The three questions that resolve most confusion\nWhen something behaves strangely, ask in this order: **which proxy** is handling this hop, **what config does it actually have**, and **did istiod ever manage to send it**. `istioctl proxy-config` answers the second. `istioctl proxy-status` answers the third — it tells you whether each proxy is in sync with istiod.\n:::\n\n:::lab See the two planes for yourself\nThis assumes you have a cluster with Istio installed — module 5 does that from scratch. Come back to this once you do.\n~~~bash\n# who is connected to istiod, and are they in sync?\nistioctl proxy-status\n\n# every listener the storefront proxy has\nistioctl proxy-config listener deploy/storefront -n shop\n\n# the routes it would use, in readable form\nistioctl proxy-config route deploy/storefront -n shop\n\n# where a call to payments would actually land\nistioctl proxy-config endpoint deploy/storefront -n shop --cluster \\\n  \"outbound|8080||payments.shop.svc.cluster.local\"\n~~~\nKill istiod (`kubectl -n istio-system scale deploy/istiod --replicas=0`), then curl between two existing pods. Traffic still flows. Now try deploying a new pod. That contrast is the lesson.\n:::", "quiz": [{"q": "istiod crashes at 2am. What happens to traffic between two already-running meshed pods?", "o": ["It stops immediately — istiod is in the request path", "It continues on the proxies' last-known config; changes and new pods are what break", "It falls back to plaintext", "Only ingress traffic survives"], "a": 1, "e": "istiod configures the data plane but never carries traffic. Existing proxies keep their config and keep working. What you lose is config updates, certificate issuance for new workloads, and eventually cert renewal — urgent, but not an instant outage."}, {"q": "You name a Service port `backend` instead of `http-backend`. What is the likely consequence?", "o": ["The Service will not be created", "Istio may treat the traffic as opaque TCP, silently losing HTTP metrics, retries and path-based policy", "mTLS will be disabled", "The pod will fail injection"], "a": 1, "e": "Istio uses the port name (and appProtocol) to decide on L4 versus L7 handling. An unrecognised name gets TCP treatment, and everything HTTP-shaped quietly stops applying. This is one of the most common self-inflicted wounds in a new mesh."}, {"q": "Which command tells you whether a proxy has actually received the config you applied?", "o": ["kubectl get virtualservice", "istioctl proxy-status", "kubectl describe pod", "istioctl install --dry-run"], "a": 1, "e": "`istioctl proxy-status` shows each proxy's sync state against istiod. `proxy-config` then shows you what that proxy actually holds. Between them they separate 'my YAML is wrong' from 'my YAML never arrived'."}, {"q": "What is the relationship between Envoy and Istio?", "o": ["Envoy is Istio's control plane", "Envoy is a general-purpose proxy that Istio uses as its data plane and configures over xDS", "Istio is a fork of Envoy", "Envoy replaced Istio in recent versions"], "a": 1, "e": "Envoy is an independent project used well beyond Istio. Istio's contribution is the control plane — turning Kubernetes-shaped YAML into Envoy configuration, and issuing the identities the proxies use."}]}, {"title": "The gateway that isn't the mesh", "sub": "North-south traffic, Gateway API versus the Istio classic APIs, and why an ingress deployment tells you nothing about whether a mesh exists.", "body": "## What people usually meet first\n\nMost organisations meet Istio as an ingress controller. Something has to terminate TLS at the edge of the cluster and route `shop.example.com/checkout` to the right Service, and Istio's gateway is good at it — it is Envoy, so it handles TLS, header manipulation, rate limiting hooks and observability better than the basic Ingress spec ever could.\n\n[[fig:gateway]]\n\nLook carefully at that diagram. The gateway is a normal Kubernetes Deployment of Envoy, fronted by a Service of type LoadBalancer. The backend workloads have no proxy. They are not enrolled. **There is no mesh in that picture** — and everything still works.\n\n:::key This is the distinction that trips people up\nAmbient and sidecar are modes of the *mesh*. If you are only using Istio as a gateway, the question \"are we sidecar or ambient?\" has no answer, because neither applies. You would only opt into one when you start enrolling workloads for east-west traffic.\n:::\n\nThere is one wrinkle worth knowing: in a recent install you have to opt in during installation to the *ability* to enrol pods into ambient, whereas the ability to enrol with sidecars is on by default. So a cluster can look \"ambient-capable\" or not from the install profile alone, regardless of whether anything is actually meshed.\n\n## Two APIs for the same job\n\nThis is the live tension in Istio right now, and being clear on it is most of what you need to sound current.\n\nIstio built its own CRDs years ago because Kubernetes Ingress was too limited: `Gateway`, `VirtualService`, `DestinationRule`, `ServiceEntry`. These are the \"Istio classic\" or \"Istio networking\" APIs.\n\nKubernetes then produced the **Gateway API** — a standard, role-oriented, portable replacement for Ingress. Istio supports it, and intends to make it the default API for traffic management. Istio's own docs now present both paths for ingress and let you choose.\n\n[[widget:apipick]]\n\n### The classic shape\n\nTwo resources, split by concern: the `Gateway` describes the listener (what to expose, on what port, with what TLS), the `VirtualService` describes routing (where matching requests go).\n\n```yaml\napiVersion: networking.istio.io/v1\nkind: Gateway\nmetadata:\n  name: shop-gateway\n  namespace: shop\nspec:\n  selector:\n    istio: ingressgateway        # selects the gateway Deployment's pods\n  servers:\n  - port: { number: 443, name: https, protocol: HTTPS }\n    hosts: [\"shop.example.com\"]\n    tls:\n      mode: SIMPLE\n      credentialName: shop-tls   # a Secret in the gateway's namespace\n---\napiVersion: networking.istio.io/v1\nkind: VirtualService\nmetadata:\n  name: shop-routes\n  namespace: shop\nspec:\n  hosts: [\"shop.example.com\"]\n  gateways: [\"shop-gateway\"]     # bind the routes to that listener\n  http:\n  - match: [{ uri: { prefix: /checkout } }]\n    route:\n    - destination: { host: checkout, port: { number: 8080 } }\n  - route:\n    - destination: { host: storefront, port: { number: 8080 } }\n```\n\nThe `selector` is the part that catches people: the `Gateway` resource does not create anything. It configures an *existing* Envoy deployment whose pods carry those labels.\n\n### The Gateway API shape\n\nHere the listener is a `Gateway` (the Kubernetes kind, not Istio's) and the routing is an `HTTPRoute`. Istio deploys the actual proxy for you when the Gateway is created.\n\n```yaml\napiVersion: gateway.networking.k8s.io/v1\nkind: Gateway\nmetadata:\n  name: shop-gateway\n  namespace: shop\nspec:\n  gatewayClassName: istio\n  listeners:\n  - name: https\n    port: 443\n    protocol: HTTPS\n    hostname: shop.example.com\n    tls:\n      mode: Terminate\n      certificateRefs: [{ name: shop-tls }]\n    allowedRoutes:\n      namespaces: { from: Same }\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata:\n  name: shop-routes\n  namespace: shop\nspec:\n  parentRefs: [{ name: shop-gateway }]\n  hostnames: [\"shop.example.com\"]\n  rules:\n  - matches: [{ path: { type: PathPrefix, value: /checkout } }]\n    backendRefs: [{ name: checkout, port: 8080 }]\n  - backendRefs: [{ name: storefront, port: 8080 }]\n```\n\nTwo genuine improvements here, and they are not cosmetic:\n\n- **Roles are separated properly.** A platform team owns the `Gateway`; application teams own `HTTPRoute` in their own namespaces. `allowedRoutes` makes the delegation explicit rather than implicit, which is exactly the control an enterprise wants.\n- **It is portable.** The same `HTTPRoute` works against another Gateway API implementation.\n\n### Which to use\n\nGateway API for new work, unless you need something it does not model. The gaps are real and they are mostly Istio's advanced traffic features — fault injection, circuit breaking and connection-pool settings, and subset-based mirroring all remain `VirtualService` / `DestinationRule` territory. Mixing the two is possible but awkward, so it is a decision worth making per-gateway rather than per-route.\n\n:::warn A migration trap\nThe Istio `Gateway` and the Kubernetes `Gateway` are different kinds with the same name in conversation. In a review, say \"Istio Gateway\" or \"Gateway API Gateway\" explicitly. More than one outage has come from a change applied against the wrong kind.\n:::\n\n## Where TLS actually stops\n\nWorth being precise about, because it comes up in every security review:\n\n| Mode | What happens | When you'd use it |\n| --- | --- | --- |\n| `SIMPLE` / `Terminate` | Gateway terminates TLS, forwards onward (plaintext, or mTLS if the backend is meshed) | The default for public HTTPS |\n| `MUTUAL` | Gateway requires a client certificate | Partner APIs, B2B |\n| `PASSTHROUGH` | Gateway routes on SNI without decrypting | End-to-end TLS to the app; you lose all L7 routing and metrics |\n\nNotice the trade in `PASSTHROUGH`: you cannot route on path or read headers, because you never see them. People ask for it on instinct and then discover their routing rules stopped working.\n\n:::lab Stand up a gateway, no mesh required\n```bash\n# Gateway API CRDs are not installed in most clusters by default\nkubectl get crd gateways.gateway.networking.k8s.io || \\\n  kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml\n\nkubectl create ns shop\nkubectl -n shop create deployment storefront --image=nginx --port=80\nkubectl -n shop expose deployment storefront --port=8080 --target-port=80\n```\nNow apply a Gateway API `Gateway` and `HTTPRoute` for `storefront`, and watch Istio create a proxy deployment for you:\n```bash\nkubectl -n shop get gateway,pods\nkubectl -n shop port-forward svc/shop-gateway-istio 8080:80\ncurl -H \"Host: shop.example.com\" localhost:8080\n```\nNo workload was labelled for injection. No mesh exists. Ingress works anyway — that is the whole point of this module.\n:::", "quiz": [{"q": "A colleague asks whether your Istio ingress gateway is running in sidecar or ambient mode. What is the correct response?", "o": ["Check the gateway pod for an injected sidecar", "Neither applies — sidecar and ambient are mesh data plane modes; a gateway is a standalone proxy", "Gateways always run in ambient mode", "It depends on the Gateway API version"], "a": 1, "e": "The question conflates two things. A gateway is a standalone Envoy deployment handling north-south traffic. Sidecar and ambient describe how workloads are enrolled into the mesh for east-west traffic."}, {"q": "You apply an Istio `Gateway` resource and no proxy appears. Why?", "o": ["The Gateway CRD is broken", "The Istio `Gateway` configures an existing Envoy deployment via its selector; it does not create one", "Gateways only work in istio-system", "You need to restart istiod"], "a": 1, "e": "The classic Istio `Gateway` is pure configuration attached to a pre-existing deployment (typically `istio-ingressgateway`) matched by labels. Gateway API behaves differently — creating a `Gateway` there causes Istio to provision the proxy for you."}, {"q": "Which capability is NOT available through the Kubernetes Gateway API and requires Istio's classic CRDs?", "o": ["Weighted traffic splitting", "Host and path routing", "Fault injection with delays and aborts", "TLS termination"], "a": 2, "e": "Fault injection lives only in `VirtualService`. Circuit breaking and connection-pool settings (DestinationRule) and subset-based mirroring are similarly Istio-only. Basic routing, weights and TLS are well covered by Gateway API."}, {"q": "You switch a listener to PASSTHROUGH mode and your path-based routing stops working. Why?", "o": ["PASSTHROUGH is deprecated", "The gateway never decrypts the traffic, so it cannot see paths or headers — only SNI", "Paths must be lowercase in PASSTHROUGH", "A DestinationRule is missing"], "a": 1, "e": "In passthrough the gateway routes on the TLS SNI value and forwards the encrypted stream untouched. No decryption means no L7 visibility — no path matching, no header manipulation and no HTTP metrics at the edge."}]}, {"title": "Sidecar or ambient", "sub": "The two data plane modes, what ztunnel and waypoints actually are, and how to make the choice defensibly.", "body": "## The fork in the road\n\nIstio has been built on the sidecar pattern since 2017: an Envoy proxy injected into every pod, handling L4 and L7 for that workload. It is battle-tested and well understood, and it comes with a resource cost and operational overhead that users complained about for years.\n\nAmbient mode, launched in 2022 and production-ready for single-cluster use from Istio 1.22, is the response. Istio now recommends that **new users start with ambient**, describing it as faster, cheaper and easier to manage — while sidecar mode remains fully supported, and new features are expected to work in both.\n\n[[fig:modes]]\n\nThat recommendation is the single most useful fact in this module. Most Istio content on the internet predates it, which is why so much of what you read leads with sidecars.\n\n## How ambient is built\n\nAmbient splits the data plane into two layers that you adopt separately.\n\n**ztunnel** is a per-node agent, deployed as a DaemonSet, written in Rust rather than being an Envoy. It handles L4 only: mTLS, workload identity, TCP-level authorization and basic telemetry. Traffic between ztunnels runs over **HBONE** — an HTTP CONNECT tunnel carrying mTLS, on port 15008.\n\n**Waypoint proxies** are full Envoy instances you deploy *per namespace or per service*, and only where you need L7: HTTP routing, retries, header-based policy, request-level metrics.\n\n[[fig:ambientpath]]\n\nThe consequence is a genuinely different adoption curve. You can label a namespace and immediately get encryption and identity for everything in it, with no pod restarts, and decide later — service by service — where the L7 features are worth an extra hop.\n\n```bash\n# L4 layer: whole namespace, no restarts\nkubectl label namespace shop istio.io/dataplane-mode=ambient\n\n# L7 layer: only where you need it\nistioctl waypoint apply -n shop --name shop-waypoint\nkubectl label service payments -n shop istio.io/use-waypoint=shop-waypoint\n```\n\nCompare that to enrolling a namespace in sidecar mode, which requires every pod to restart before anything is in the mesh.\n\n## The honest comparison\n\n| | Sidecar | Ambient |\n| --- | --- | --- |\n| Proxy placement | One Envoy per pod | Shared ztunnel per node, waypoints per namespace/service |\n| Resource cost | Scales with pod count | Scales with node count, plus waypoints you choose |\n| Enrolling a workload | Label + restart every pod | Label the namespace, no restart |\n| Upgrading the proxy | Rolling restart of every application pod | DaemonSet update; app pods untouched |\n| L7 features | Everywhere by default | Only where a waypoint is deployed |\n| L7 telemetry | HTTP metrics for all mesh traffic out of the box | L4 telemetry by default; HTTP metrics come from waypoints |\n| Security isolation | Proxy shares the pod with the app; a compromised app container can interfere with it | ztunnel runs as a separate pod with its own security context |\n| Maturity | Since 2017, thoroughly battle-tested | Production-ready single-cluster since 1.22; where the project's energy is now |\n\nTwo rows deserve expanding, because they are the ones that decide real designs.\n\n### The L7-everywhere row\n\nIf every service needs HTTP-aware routing, header-based authorization and request-level metrics, sidecar mode is arguably simpler: the L7 proxy is already local to every pod, and processing happens in-pod. In ambient, L7 features mean traffic takes an extra hop through a waypoint — source ztunnel, waypoint, destination ztunnel, pod. Istio's benchmarks show latency stays low, but the impact depends on your traffic pattern and infrastructure.\n\nIf only *some* services need L7 — which is the common case — ambient is clearly better: ztunnel for the bulk, waypoints for the handful that need more.\n\n### The upgrade row\n\nThis one is under-appreciated and is the reason many platform teams move. In sidecar mode, upgrading the proxy version means restarting every pod in the mesh. Even with revision-based canary upgrades, you eventually roll every workload. That is a coordination exercise with application teams, every quarter, forever. In ambient, ztunnel upgrades roll through nodes as a DaemonSet update, and waypoints upgrade independently of application pods.\n\n[[widget:path]]\n\n:::warn Where sidecar still wins\nAmbient is not a superset yet. Multi-cluster topologies, some advanced `EnvoyFilter` work, and a handful of edge integrations still assume sidecars, and closing those gaps has been an ongoing roadmap item. Before committing a design, check the current release notes against your specific requirement rather than trusting this table or any other written months ago — this is exactly the kind of thing that moves between releases.\n:::\n\n## They coexist\n\nYou can run both modes in the same cluster, on different namespaces. That matters for migration: an existing sidecar estate does not have to convert in one move. What you cannot do is have the same workload in both at once, and Istio will tell you when a `Sidecar` resource has no effect because the workload is in ambient mode.\n\n## Making the call\n\nA defensible position for a new deployment, stated the way you would in a design review:\n\n> Start ambient. Get L4 mTLS and identity across the namespace with no restarts and a small resource footprint. Add waypoints only for the services that need HTTP routing or L7 policy, so we pay the extra hop only where it earns something. Keep sidecars for any workload with a requirement ambient does not yet cover, and check that list at each upgrade.\n\nThe counter-argument, which is also reasonable: if your estate is already fully sidecar, working and understood, \"it is the new thing\" is not a business case. Migrate when a specific pain — resource cost, restart-driven upgrade coordination, or the security isolation model — is costing you something you can name.", "quiz": [{"q": "What does ztunnel handle?", "o": ["Full L7 routing for all mesh traffic", "L4 only — mTLS, identity and TCP-level authorization, per node", "Certificate issuance", "Ingress traffic"], "a": 1, "e": "ztunnel is a per-node DaemonSet handling the L4 layer: transparent mTLS, workload identity and TCP-level policy. Anything HTTP-aware requires a waypoint proxy."}, {"q": "You label a namespace for ambient mode. What happens to running pods?", "o": ["They restart to pick up a sidecar", "Nothing restarts — they are enrolled in place", "They lose connectivity until redeployed", "Only new pods are enrolled"], "a": 1, "e": "No restart is required, which is the sharpest operational contrast with sidecar mode where every pod must restart to receive an injected proxy."}, {"q": "Your team needs HTTP header-based authorization on every one of forty services. Which mode is the simpler fit?", "o": ["Ambient — waypoints scale better", "Sidecar — the L7 proxy is already in every pod, with no extra hop", "Neither supports it", "Ambient, but only with Gateway API"], "a": 1, "e": "L7 everywhere is the case where sidecars are arguably simpler. In ambient you would need waypoints for all forty services, and each adds a hop. Ambient's advantage is strongest when only some services need L7."}, {"q": "Why do many platform teams cite upgrades as their reason to move to ambient?", "o": ["Ambient has no proxy to upgrade", "Sidecar proxy upgrades eventually require restarting every application pod; ztunnel upgrades roll as a DaemonSet", "Ambient upgrades are automatic", "Sidecars cannot be upgraded at all"], "a": 1, "e": "A quarterly release cadence plus restart-to-upgrade means recurring coordination with every application team. Ambient decouples proxy lifecycle from application pod lifecycle."}, {"q": "In ambient mode with no waypoint deployed, what telemetry do you get for a service's traffic?", "o": ["Full HTTP request metrics", "L4/TCP-level metrics; HTTP-level metrics require a waypoint", "No telemetry at all", "The same as sidecar mode"], "a": 1, "e": "ztunnel emits L4 telemetry for all mesh traffic. Detailed HTTP metrics, traces and request-level attributes come from waypoints. If someone expects per-endpoint latency from an ambient namespace with no waypoint, they will be disappointed."}]}, {"title": "Installing and enrolling", "sub": "Profiles, istioctl versus Helm, revisions, and what \"in the mesh\" actually means in each mode.", "body": "## Install choices that matter later\n\nThere are three supported ways in, and the choice constrains your upgrade story more than your install story.\n\n| Method | Good for | Watch out |\n| --- | --- | --- |\n| `istioctl install` | Learning, small clusters, quick iteration | Imperative; harder to fit into GitOps |\n| Helm charts | Production, GitOps, fine-grained control | You install `base`, `istiod`, `cni`, `ztunnel` and gateways as separate releases |\n| Operator / IstioOperator CR | Was common historically | The in-cluster operator has been deprecated — do not build new work on it |\n\nFor anything that will outlive a demo, Helm. The component split is worth memorising because it tells you the architecture:\n\n```bash\nhelm install istio-base istio/base -n istio-system --create-namespace\nhelm install istiod istio/istiod -n istio-system --set profile=ambient\nhelm install istio-cni istio/cni -n istio-system --set profile=ambient\nhelm install ztunnel istio/ztunnel -n istio-system\nhelm install istio-ingress istio/gateway -n istio-ingress --create-namespace\n```\n\nNote what is separable: the gateway is its own release in its own namespace, and needs neither `istio-cni` nor `ztunnel` if you are not meshing anything. That is module 3's point in Helm form.\n\n:::warn Container registry migration\nIstio images are moving off `gcr.io/istio-release`. That mirror will stop serving from 1 January 2027, and `registry.istio.io` is the new home — clusters still pointing at the old registry risk failing to create pods after that date. The default has long been Docker Hub (`docker.io/istio`), so this only bites installs that explicitly chose the gcr mirror. Worth grepping your Helm values for now rather than in December.\n:::\n\n## Profiles\n\nA profile is a bundle of defaults. `demo` turns on everything with generous logging and is fine for a laptop and wrong for production. `default` is the sensible production baseline. `ambient` sets up the ambient components. `minimal` gives you istiod alone.\n\n```bash\nistioctl profile list\nistioctl profile dump default          # see exactly what you are about to get\nistioctl install --set profile=ambient --dry-run\n```\n\nReading the dump before installing is a good habit. It is also the fastest way to answer \"what did we actually turn on?\" about a cluster you inherited.\n\n## Revisions: the thing to set up on day one\n\nIstio supports running two control plane versions side by side, tagged by revision. This is how you do a canary upgrade rather than an in-place one, and retrofitting it later is painful.\n\n```bash\nistioctl install --set profile=default --set revisionTags={} --revision=1-31-0\nkubectl label namespace shop istio.io/rev=1-31-0 --overwrite\n```\n\nBetter still, point namespaces at a *tag* (`prod-stable`) rather than a version, and move the tag when you are ready. Then upgrading a namespace is a label change plus a restart, not an edit to every namespace.\n\n## Enrolling workloads\n\nThis is where the two modes visibly diverge.\n\n### Sidecar\n\n```bash\nkubectl label namespace shop istio-injection=enabled\n# or, with revisions:\nkubectl label namespace shop istio.io/rev=1-31-0\n\nkubectl rollout restart deployment -n shop   # nothing is meshed until this happens\n```\n\nInjection is a mutating admission webhook: it rewrites the pod spec at creation time. Existing pods are untouched, which is why the restart is mandatory and why \"I labelled the namespace and nothing changed\" is such a common first bug.\n\nVerify rather than assume:\n```bash\nkubectl -n shop get pods -o custom-columns=\\\nNAME:.metadata.name,CONTAINERS:.spec.containers[*].name\n# you want to see istio-proxy alongside your app container\n```\n\n### Ambient\n\n```bash\nkubectl label namespace shop istio.io/dataplane-mode=ambient\n```\nThat is it for L4. No restart. Then, per service that needs L7:\n```bash\nistioctl waypoint apply -n shop --name shop-waypoint\nkubectl label service payments -n shop istio.io/use-waypoint=shop-waypoint\n```\n\n:::key \"In the mesh\" means different things\nIn sidecar mode it is binary: a pod has a proxy or it does not. In ambient it is layered — a workload can be in the mesh at L4 (encrypted, identified, L4 policy) without any L7 processing at all. When someone says \"payments is in the mesh\", in an ambient cluster the follow-up question is \"at which layer?\"\n:::\n\n## Excluding things\n\nYou will need this. Some workloads should not be meshed — a job that finishes before the proxy is ready, a database client that speaks a protocol Istio mangles, a legacy component you cannot restart.\n\n```yaml\n# per-pod opt-out in an injected namespace\nmetadata:\n  annotations:\n    sidecar.istio.io/inject: \"false\"\n```\n```yaml\n# exclude specific outbound ports from capture\nmetadata:\n  annotations:\n    traffic.sidecar.istio.io/excludeOutboundPorts: \"3306\"\n```\n\nBe deliberate about these. Every exclusion is a hole in whatever the mesh was supposed to guarantee, and an auditor will eventually ask you to enumerate them.\n\n:::lab Full local build, ~15 minutes\n```bash\n# 1. cluster\nkind create cluster --name mesh --image kindest/node:v1.31.0\n\n# 2. istio\ncurl -L https://istio.io/downloadIstio | sh -\ncd istio-*/ && export PATH=$PWD/bin:$PATH\nistioctl install --set profile=ambient -y\n\n# 3. the shop\nkubectl create ns shop\nkubectl -n shop create deployment storefront --image=nginx --port=80\nkubectl -n shop expose deploy storefront --port=8080 --target-port=80\nkubectl -n shop create deployment payments --image=nginx --port=80\nkubectl -n shop expose deploy payments --port=8080 --target-port=80\n\n# 4. before: is traffic encrypted? (no)\nkubectl -n shop run probe --image=curlimages/curl -it --rm -- \\\n  curl -s -o /dev/null -w \"%{http_code}\\n\" payments:8080\n\n# 5. enrol at L4 — note that nothing restarts\nkubectl label namespace shop istio.io/dataplane-mode=ambient\nkubectl -n shop get pods       # same pods, same ages\n\n# 6. confirm the workloads are known to the mesh\nistioctl ztunnel-config workload --namespace shop\n```\nThen repeat from step 3 in a second namespace using `istio-injection=enabled` and watch the pod restart requirement bite. Doing both back to back is the fastest way to internalise the difference.\n:::", "quiz": [{"q": "You add `istio-injection=enabled` to a namespace with running pods. What is meshed?", "o": ["All existing pods immediately", "Nothing until the pods are restarted — injection happens at pod creation", "Only pods with a matching label", "Existing pods, but not new ones"], "a": 1, "e": "Injection is a mutating admission webhook that rewrites the pod spec at creation. Existing pods are untouched, so a rollout restart is required. This is the classic first-day confusion."}, {"q": "Why set up revisions and revision tags on day one?", "o": ["They are required for mTLS", "They enable canary control plane upgrades; retrofitting them onto a live mesh is painful", "They reduce proxy memory", "They are needed for Gateway API"], "a": 1, "e": "Revisions let two control plane versions run side by side so namespaces move one at a time. Pointing namespaces at a stable tag rather than a version number means upgrades become a tag move, not an edit to every namespace."}, {"q": "Which components can you skip if you only want an Istio ingress gateway and no mesh?", "o": ["istiod", "istio-cni and ztunnel", "the gateway chart", "istio-base"], "a": 1, "e": "The CNI plugin and ztunnel exist to enrol workloads. A gateway-only deployment needs base, istiod and the gateway chart. This mirrors module 3 — the gateway stands alone."}, {"q": "In an ambient cluster, someone says 'payments is in the mesh'. What should you ask?", "o": ["Which container is the proxy in?", "At which layer — L4 via ztunnel only, or L7 with a waypoint?", "Has it been restarted?", "Which Ingress class is it using?"], "a": 1, "e": "Ambient makes mesh membership layered rather than binary. L4 enrolment gives encryption, identity and TCP policy; L7 features and HTTP telemetry require a waypoint bound to the service."}, {"q": "What is the risk of `traffic.sidecar.istio.io/excludeOutboundPorts`?", "o": ["It breaks the pod's DNS", "Excluded traffic bypasses the mesh entirely — no mTLS, no policy, no telemetry on that port", "It disables the whole namespace", "It is ignored in recent versions"], "a": 1, "e": "Exclusions are holes in every guarantee the mesh was deployed to provide. They are sometimes necessary, but each one should be deliberate and documented, because you will eventually be asked to enumerate them."}]}, {"title": "Traffic management inside the mesh", "sub": "VirtualService and DestinationRule, canary releases, timeouts, retries, circuit breaking, and how to break things on purpose.", "body": "## The pair that does the work\n\nTwo resources, and the split between them is the thing to get straight:\n\n- **`VirtualService`** — *where does this request go?* Matching on host, path, header, method; splitting by weight; timeouts, retries, mirroring, fault injection.\n- **`DestinationRule`** — *how do we treat the destination once chosen?* Subsets (named groups of pods by label), load balancing algorithm, connection pool limits, outlier detection, TLS settings.\n\nYou almost always need both for anything version-aware, because subsets are defined in the `DestinationRule` and referenced from the `VirtualService`.\n\n```yaml\napiVersion: networking.istio.io/v1\nkind: DestinationRule\nmetadata: { name: checkout, namespace: shop }\nspec:\n  host: checkout\n  subsets:\n  - name: v1\n    labels: { version: v1 }\n  - name: v2\n    labels: { version: v2 }\n```\n\n```yaml\napiVersion: networking.istio.io/v1\nkind: VirtualService\nmetadata: { name: checkout, namespace: shop }\nspec:\n  hosts: [\"checkout\"]          # the in-mesh service name; no gateways = east-west only\n  http:\n  - match:\n    - headers: { x-beta: { exact: \"true\" } }\n    route:\n    - destination: { host: checkout, subset: v2 }\n  - route:\n    - destination: { host: checkout, subset: v1, port: { number: 8080 } }\n      weight: 90\n    - destination: { host: checkout, subset: v2, port: { number: 8080 } }\n      weight: 10\n```\n\n[[widget:canary]]\n\n:::key Order is everything\n`http` rules are evaluated top to bottom and the **first match wins**. A rule
