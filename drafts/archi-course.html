layer:'n',
dek:'The metamodel stops illegal models; it cannot stop bad ones. These are the seven patterns that make published ArchiMate examples so poor, with the fix for each.',
html: `
<h3>Rogue 1 — the app wearing a business costume</h3>
<p>The most common error on the public internet: "Internet Banking" drawn as a business actor, serving the customer. It feels natural — customers do use internet banking — and it destroys the model, because now the business view churns with every replatform and the layering means nothing.</p>

${D({w:840,h:290,n:'10.1',cap:'Left: the rogue — a system posing as a business actor. Right: the fix — the system is an application component whose service serves the role, with the business channel (if needed) as an interface. Same facts, but only the right-hand model survives contact with a migration.'},
[
 ['bad','group','Rogue', 20, 25, 380, 240],
 ['ba','bActor','Internet Banking', 55, 75, 170, 54],
 ['bc','bActor','Customer', 55, 180, 170, 54],
 ['good','group','Fix', 435, 25, 385, 240],
 ['gr','bRole','Account Holder', 620, 60, 170, 50],
 ['gs','aService','Preference Capture', 620, 135, 170, 50],
 ['gc','aComponent','Internet Banking', 620, 205, 170, 50]
],
[
 ['ba','bc','serving','serves ??'],
 ['gs','gr','serving',''],
 ['gc','gs','realization','']
])}

<h3>Rogue 2 — association soup</h3>
<p>Every element joined to every neighbour with plain lines. It looks finished; it asserts nothing. Ten associations carry less information than three typed relationships, because a typed relationship can be <em>wrong</em> — and only claims that can be wrong can be useful.</p>

${D({w:840,h:210,n:'10.2',cap:'Left: soup — related somehow, direction unknown, nothing checkable. Right: the same three elements making three checkable claims. If you cannot pick the type, that is the model telling you that you have not finished thinking.'},
[
 ['sg','group','Rogue', 20, 25, 380, 165],
 ['s1','bProcess','Update Preference', 50, 70, 150, 50],
 ['s2','bObject','Delivery Preference', 230, 70, 150, 50],
 ['s3','bService','Preference Mgmt', 140, 135, 150, 48],
 ['fg','group','Fix', 435, 25, 385, 165],
 ['f1','bProcess','Update Preference', 465, 70, 150, 50],
 ['f2','bObject','Delivery Preference', 650, 70, 150, 50],
 ['f3','bService','Preference Mgmt', 555, 135, 150, 48]
],
[
 ['s1','s2','association',''],
 ['s1','s3','association',''],
 ['s2','s3','association',''],
 ['f1','f2','access','',{acc:'rw'}],
 ['f1','f3','realization','']
])}

<h3>Rogues 3–7, briefly</h3>
<table>
<tr><th>Rogue</th><th>What it looks like</th><th>Fix</th></tr>
<tr><td><strong>Serving drawn backwards</strong></td><td>Arrow pointing at the provider, because "the customer uses it"</td><td>Arrow at the beneficiary, always. Say the sentence aloud: "X serves Y."</td></tr>
<tr><td><strong>BPMN cosplay</strong></td><td>Twenty-step process chains with decision diamonds improvised out of junctions</td><td>ArchiMate processes stop at the level executives recognise; detail goes to BPMN, linked in the documentation field. Junctions are for genuine and/or splits in coarse flows, not gateways.</td></tr>
<tr><td><strong>Interface promoted to service</strong></td><td>A service named "REST API" or "Preferences Endpoint"</td><td>The API is <em>where</em>; the service is <em>what</em>. "Preference Capture" (service) exposed at "Preferences API" (interface).</td></tr>
<tr><td><strong>CRUD explosion</strong></td><td>CreatePreferenceService, UpdatePreferenceService, DeletePreferenceService…</td><td>One service at the who-cares level. Operations are interface detail, not architecture.</td></tr>
<tr><td><strong>Function conveyor belt</strong></td><td>Business functions chained with triggering, left to right</td><td>Sequence toward a result = process. Functions stand still; processes flow through them (module 04).</td></tr>
</table>

<h3>When not to model</h3>
<p>Every element costs attention forever — it must be named, maintained, and explained in every review it appears in. So apply the test from module 02 in reverse: <strong>a view exists to answer a question; an element exists to be part of an answer.</strong> No question, no element. Some concrete permissions:</p>
<ul>
<li>You may leave out the interface when the channel story is not the point.</li>
<li>You may use the derived component-realises-service shortcut on every portfolio view.</li>
<li>You may model one function per component until the internal split matters.</li>
<li>You may omit actors entirely and work in roles until an org-mapping question shows up.</li>
</ul>
<p>Minimalism is not laziness; it is respect for the reader. The best ArchiMate views look almost empty and answer their question completely.</p>

<div class="co tip"><b class="lbl">Naming, one last time</b><p>Processes: verb + object. Services: capability noun phrase. Functions: gerund-free competence names ("Risk Assessment", not "Assessing Risks"). Objects: singular nouns. Events: past-tense facts ("Application Submitted"). Components: the name the operations team uses at 2am. An element fighting its convention is usually the wrong type.</p></div>
`,
quiz:[
{q:'What is actually wrong with "Internet Banking" as a business actor?', o:['The name is too vague','It binds the business view to an implementation, so the layering stops protecting anything','Business actors must be people','Nothing, if it is coloured yellow'], a:1, why:'The whole return on layering is a business view that survives replatforming. A system in the business layer forfeits it — legally, per the metamodel, an actor can be many things; the judgement rule is what protects you.'},
{q:'Why do three typed relationships beat ten associations?', o:['Fewer lines render faster','Typed relationships make checkable claims — they can be wrong, therefore they can be useful','Associations are deprecated','Associations cannot be labelled'], a:1, why:'A model is a set of claims. Association claims almost nothing, so it can almost never be wrong — and almost never be informative.'},
{q:'A colleague models CreateCustomer, UpdateCustomer and DeleteCustomer as three application services. Best advice?', o:['Add ReadCustomer for completeness','Collapse to one service at the who-cares level; operations are interface detail','Convert them to business services','Use flows instead'], a:1, why:'Nobody outside consumes "delete customer" as a distinct capability. Service granularity follows external meaning, not HTTP verbs.'},
{q:'The governing test for whether an element belongs in a view is…', o:['Whether it fits without overlapping','Whether it is part of the answer to the question the view exists to ask','Whether the validator allows it','Whether it appears in other views'], a:1, why:'Views answer questions. Elements that answer nothing cost attention forever and pay no rent.'}
]});

<h3>Say it → draw it</h3>
<table>
<tr><th>You want to say…</th><th>Draw</th><th>Direction check</th></tr>
<tr><td>Who performs this</td><td>Assignment</td><td>Ball on the doer, arrow on the deed</td></tr>

<tr><td>When this ends, that starts</td><td>Triggering (solid, filled head)</td><td>Time flows with the arrow</td></tr>
<tr><td>Something is passed along</td><td>Flow (dashed, filled head)</td><td>Label what flows, always</td></tr>
<tr><td>This is a part that dies with the whole</td><td>Composition</td><td>Filled diamond on the whole</td></tr>
<tr><td>This groups that (shareable part)</td><td>Aggregation</td><td>Hollow diamond on the whole</td></tr>

</table>

<h3>The cross-layer four</h3>
<table>
<tr><th>Claim</th><th>Pattern</th></tr>
<tr><td>System behaviour <em>supports</em> business behaviour</td><td>App service → serving → business process/function/role</td></tr>
<tr><td>Business behaviour <em>is</em> automated</td><td>App behaviour → realisation → business behaviour, or component → assignment → business process</td></tr>
<tr><td>This data is the automated form of that concept</td><td>Data object → realisation → business object</td></tr>
<tr><td>Portfolio shorthand</td><td>Component → realisation → app service (derived; licensed by the detail)</td></tr>
</table>

<h3>Naming</h3>
<table>
<tr><th>Element</th><th>Convention</th><th>Example</th></tr>
<tr><td>Business process</td><td>Verb + object</td><td>Update Statement Preference</td></tr>
<tr><td>Business service</td><td>Capability noun phrase</td><td>Statement Preference Management</td></tr>
<tr><td>Business function</td><td>Competence name</td><td>Risk Assessment</td></tr>
<tr><td>Event</td><td>Past-tense fact</td><td>Application Submitted</td></tr>
<tr><td>Object / data object</td><td>Singular noun</td><td>Customer File / Preference Record</td></tr>
<tr><td>Interface</td><td>Channel or access point</td><td>Digital Channel / Preferences API</td></tr>
<tr><td>Component</td><td>The 2am operational name</td><td>Customer Master</td></tr>
</table>

<h3>The course in ten sentences</h3>
<ol>
<li>ArchiMate is a language with a metamodel; Archi is the free tool that enforces it — the model is the tree, and views are projections of it.</li>
<li>Every layer is the same grammar: active structure performs behaviour that acts on passive structure, with interface and service as the external boundary.</li>
<li>A model is a set of claims, and every claim is carried by a typed, directed relationship — which is why type and direction are the craft.</li>
<li>The service is the anchor: externally meaningful behaviour, named at the level someone outside would consume, hiding everything internal.</li>
<li>Actors exist, roles are hats; attach behaviour to the hats and let assignments absorb the org chart.</li>
<li>Processes flow through time toward results; functions stand still and describe capability; events decouple the boundaries between them.</li>
<li>Objects are concepts, contracts are agreements, representations are their perceptible forms, and products bundle services for sale.</li>
<li>The application layer repeats the grammar in blue, at the granularity of things a solution design would name, with data objects realising business concepts.</li>
<li>Layers meet through four patterns — serving for support, realisation or cross-layer assignment for automation, data-realises-object for information — so the business view survives every replatform.</li>
<li>Model only what answers a question; minimal views with exact arrows beat crowded views with vague ones, every single time.</li>
</ol>

<div class="co tip"><b class="lbl">Where to next</b><p>Rebuild both worked examples from scratch in Archi without looking — tree first, then the three views by dragging from the tree. Then take one real capability you own, write its business view before naming any system, and see how long it survives your next architecture review. That is the whole method.</p></div>
`,
