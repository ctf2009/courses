name: Test publication deployment
run-name: Test existing site deployment at ${{ inputs.revision }}
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact current main SHA; public content must already match the live site
        required: true
        type: string
concurrency:
  group: courses-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  baseline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/*.test.mjs && node scripts/check-catalogue.mjs
      - name: Deploy unchanged site and verify baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE_REVISION: ${{ inputs.revision }}
          PUBLICATION_RECEIPT_PATH: ${{ runner.temp }}/publication-smoke-receipt.json
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/run-bootstrap.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: publication-smoke-receipt
          path: ${{ runner.temp }}/publication-smoke-receipt.json
          if-no-files-found: warn
          retention-days: 90
