name: Publish course
run-name: Publish ${{ inputs.publication_id }}
on:
  workflow_dispatch:
    inputs:
      publication_id:
        required: true
        type: string
      revision:
        required: true
        type: string
concurrency:
  group: courses-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    if: vars.CURATOR_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Publish and verify the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          CURATOR_PUBLICATION_ENABLED: ${{ vars.CURATOR_PUBLICATION_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          PUBLICATION_REVISION: ${{ inputs.revision }}
          PUBLICATION_RECEIPT_PATH: ${{ runner.temp }}/publication-receipt.json
        run: node scripts/run-publication.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: publication-receipt
          path: ${{ runner.temp }}/publication-receipt.json
          if-no-files-found: warn
          retention-days: 90
